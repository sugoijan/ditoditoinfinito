# The page and its own files (styles, the boot script, SEO data) live in
# site/; its links reach the crates, assets and generated files from there.
[build]
target = "site/index.html"
# The page (its boot script and styles inlined) minified in release
# builds, which xtask check-boot holds to the first round trip; a dev
# build (unminified, the dev server's reload script inside) skips the
# budget.
minify = "on_release"

[watch]
ignore = [
  "target",
  "dist",
  "dist-test",
  "docs",
  "xtask",
  # Output of the gen-credits pre_build hook; ignored so regenerating them
  # does not immediately trigger another rebuild.
  "credits/CREDITS.md",
  "credits/THIRD_PARTY_RUST.md",
]

# The page's inline scripts (site/boot.js, site/boot-art.js) minified with
# swc into target/boot/ in release builds, copied as they are otherwise
# (xtask/src/boot_minify.rs): Trunk inlines them verbatim and its HTML
# pass leaves JavaScript's comments and names alone.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "-p", "xtask", "--", "minify-boot"]

# Regenerates target/seo/ from site/seo/metadata.toml so the fragments inlined
# by site/index.html are always fresh and never need to be committed.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "-p", "xtask", "--", "regen-seo"]

# Song manifest from assets/songs/*/PROVENANCE.toml.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "-p", "xtask", "--", "gen-songs"]

# Bundled noteskins' index from assets/noteskins/*/*/ (files, texts).
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "-p", "xtask", "--", "gen-noteskins"]

# credits/CREDITS.md (checked in) and target/credits/credits.json (bundled) from
# REUSE.toml + PROVENANCE.toml files.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "-p", "xtask", "--", "gen-credits"]

# Only the web favicon, copied from its source-keyed target/icons cache.
# After the build, in this order (Trunk runs a stage's hooks at once,
# and three of these rewrite index.html, so they are one hook):
# - the web favicon (`icons --target web`);
# - the video decoder (target/video/, `just video`) into the site's
#   video/, built first when it is missing (after `cargo clean`) or older
#   than its sources; DDI_NO_VIDEO=1 builds the site without it
#   (`stage-video`);
# - the Opus worker's files named by their hash, and index.html told
#   (crates/web/src/web/opus.rs reads it; `stage-opus`), and the SVG
#   worker's the same way (crates/web/src/web/svg.rs; `stage-svg`);
# - last, on the page as it ships: the page draws its loader from its own
#   first bytes, within the first round trip compressed, nothing the first
#   paint waits for fetched (xtask/src/boot_check.rs; `check-boot`).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "-p", "xtask", "--", "post-build"]
