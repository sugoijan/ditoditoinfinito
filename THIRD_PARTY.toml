# Code and data from other projects compiled into the game, credited by
# `cargo run -p xtask -- gen-credits` in CREDITS.md and on the Credits
# screen, with the notice each licence asks to ship. REUSE.toml annotates
# the same files. Rust dependencies are not listed here.
#
# Fields: name, what (what is used and where), files (repository paths),
# spdx, holders, source, commit, license_url, and notice: a file holding
# the notice to reproduce (for MIT, omit it: the notice is LICENSES/MIT.txt
# with the holders' copyright line).

