[package]
name = "ddi-msd-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DitoDitoInfinito: the web's chart rating (MSD) worker, rating imported songs off the page's thread"

# Trunk builds it into the site as a worker (index.html, `data-type="worker"`);
# the web shell starts one only while a chart ratings option wants ratings
# (docs/plans/msd-ratings.md). Natively it is empty.
[[bin]]
name = "msd-worker"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ddi-chart.workspace = true
ddi-msd.workspace = true
ddi-rating.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
