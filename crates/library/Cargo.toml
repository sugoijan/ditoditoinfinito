[package]
name = "ddi-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DitoDitoInfinito: song library (pack scanning, zip index, manifest entries)"

[dependencies]
# StepMania's color strings (`RageColor::FromString`) for background
# changes' colors (`backgrounds::effects`).
ddi-actor.workspace = true
ddi-chart.workspace = true
# A work's charts' excessive setting, kept in its entry (`scan`).
ddi-engine.workspace = true
ddi-platform.workspace = true
serde.workspace = true
thiserror.workspace = true
miniz_oxide.workspace = true
serde_json.workspace = true
# Unicode's NFKD tables for the search where no browser folds text
# (desktop); the web uses `String.prototype.normalize`.
unicode-normalization = { workspace = true, optional = true }

[dev-dependencies]
encoding_rs.workspace = true

[features]
nfkd = ["dep:unicode-normalization"]
