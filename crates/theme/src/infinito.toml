[metrics]
"TitleMenu.Width" = 380
"TitleMenu.RowHeight" = 52
"TitleMenu.Gap" = 12
"TitleMenu.TitleWidth" = 520
"TitleMenu.TitleHeight" = 104
# Focus keeps the title's palette pace, with a faster spatial field.
"Active.EvolutionSpeed" = 8
"Active.Width" = 3
"Active.Gap" = 3
# Quiet, screen-aligned outline rain; speed in the 960×540 study's px/s.
"TitleMenu.RainSpeed" = 8
"TitleMenu.RainStrength" = 22
# The design size.
"Design.Width" = 1280
"Design.Height" = 720
# Below this many CSS pixels of height a window gets the compact layout:
# phones held sideways are 360–430 high, tablets and laptop windows 600
# and more.
"Compact.Below" = 480
"Compact.Narrower" = 600
"Compact.Width" = 844
"Compact.Height" = 390
# Kept clear at the sides of the compact layout (a phone's notch).
"Compact.Margin" = 48
# Header, footer, the margin at the sides.
"Header.Height" = 64
# Where the header's row (Back, the wordmark, the screen's name) ends.
"Header.TitleEnd" = 460
"Footer.Height" = 40
"Footer.HintGap" = 18
"Margin" = 32
# Song select: the selected song on the left, the wheel on the right.
"Select.Song.X" = 32
"Select.Song.Y" = 84
"Select.Song.Width" = 560
"Select.Banner.Height" = 175
# A jacket's square beside the banner (the gap between them), and the
# CD title's box in the banner's corner.
"Select.Jacket.Gap" = 8
"Select.CdTitle.Width" = 64
"Select.CdTitle.Height" = 48
"Select.Tabs.Y" = 377
"Select.Ladder.Y" = 421
"Select.Ladder.Row" = 44
"Select.Ladder.Gap" = 5
"Select.Search.Width" = 560
# The wheel's rows: their left at the design's 640 (kept from the
# right), their width, their pitch, the selected one's height, the gap
# between rows.
"Select.Wheel.X" = 640
"Select.Wheel.Width" = 596
"Select.Wheel.Row" = 66
"Select.Wheel.Selected" = 88
"Select.Wheel.Gap" = 6
"Select.Wheel.Inset" = 5
# The wheel's curve: rows drift right by this × distance², fade by this
# a row, to no less than the floor.
"Wheel.Drift" = 5
"Wheel.Fade" = 0.11
"Wheel.Floor" = 0.3
# Results.
"Results.Score.Width" = 400
"Results.Panels.X" = 464
"Results.Panels.Width" = 784
"Results.Bar.Y" = 584
# The start prompt's card, and its loading screen's "Loading" (lower right).
"Prompt.Width" = 560
"Prompt.Loading.Size" = 15
# Options.
"Options.Rail.Width" = 208
"Options.Rows.X" = 272
"Options.Rows.Width" = 600
"Options.Preview.X" = 904
# Compact: the preview's width sideways; upright, the layout's width
# (zoomed to the screen's).
"Options.Compact.Preview" = 320
"Options.Narrow.Width" = 480
# Song select upright on a phone: its side margins (the layout 480 wide).
"Compact.Upright.Margin" = 12
# The selected song's background behind the menus: how strong (results'
# fainter), its cached Gaussian image's longest side in physical pixels
# (independent of display scale), how long a new one fades in.
"Backdrop.Alpha" = 0.2
"Backdrop.Results" = 0.14
"Backdrop.Side" = 256
"Backdrop.Fade" = 0.35
# Motion: a selection moving; a screen's parts coming in (the header
# from above, the footer from below, a list from the right, a song's
# side from the left; `ddi_ui::screens::transitions`) and leaving, how
# far they slide (virtual pixels) sideways and up or down, and how much
# later the sides follow the top and bottom; and the beat pulse (the
# selection's ring lit this much on each beat, settling in this long).
"Motion.Select" = 0.12
"Motion.Screen" = 0.22
"Motion.Screen.Out" = 0.14
"Motion.Slide.X" = 120
"Motion.Slide.Y" = 56
"Motion.Stagger" = 0.05
# Lists moving fast blur their rows along them: by this share of a 60th
# of a second's travel past this speed (virtual pixels a second); none
# slower, none at rest or under reduced motion.
"List.MotionBlur" = 0.5
"List.MotionBlurFrom" = 600
"Pulse.Amount" = 0.35
"Pulse.Decay" = 0.3
