[package]
name = "ddi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DitoDitoInfinito, a dance rhythm game: the web app on wasm, the desktop app elsewhere"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ddi-web.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ddi-desktop.workspace = true

# The Windows executable's icon, drawn from `tools/package/icon.svg`
# (`build.rs`); on Windows hosts only, so other builds skip it.
[target.'cfg(windows)'.build-dependencies]
resvg = { version = "0.48.1", default-features = false }

[features]
default = ["video", "danoni-importer"]
video = ["ddi-desktop/video"]
danoni-importer = ["ddi-desktop/danoni-importer"]
danoni = ["danoni-importer"]
