[package]
name = "ddi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DitoDitoInfinito: the desktop shell (a window running the UI core; run through the `ddi` crate)"

[dependencies]
ddi-actor.workspace = true
# The field preview's demo and options (`src/field_preview.rs`).
ddi-chart.workspace = true
ddi-engine.workspace = true
ddi-library = { workspace = true, features = ["nfkd"] }
# The music's decoders (`decode-all`: MP3, Ogg Vorbis and Opus, FLAC,
# WAV; resampling).
ddi-platform = { workspace = true, features = ["decode-all"] }
# The noteskins in song folders (`src/library/noteskins.rs`), readied
# for a play with their Lua (`src/play/skins.rs`).
ddi-noteskin = { workspace = true, features = ["raster"] }
ddi-lua.workspace = true
ddi-render.workspace = true
# A Dancing☆Onigiri work's text layers drawn (`src/play/stage.rs`):
# cosmic-text, as the 2D pass's text, on the system's fonts.
glyphon.workspace = true
# Their colors, as a canvas's `fillStyle` reads them.
csscolorparser = "0.9.0"
# The play (`src/play/`): the session the web runs too.
ddi-session.workspace = true
# What both shells do between the settings and the renderer.
ddi-shell.workspace = true
ddi-ui.workspace = true
ddi-theme.workspace = true
serde_json.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }
winit = "0.30.13"
# File dialogs: on Linux through the XDG desktop portal (the default),
# not GTK.
rfd = "0.17.2"
# The clipboard, text only (no `image`); Wayland's data-control too.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# Banners and backgrounds: what StepMania reads (PNG, JPEG, GIF, BMP)
# and WebP, which browsers show.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Sound (`src/audio/`): the output stream (ALSA on Linux, linked from
# the system), and the lock-free rings to the mixer on its thread.
cpal = "0.18.2"
rtrb = "0.4.0"
# Controllers (`src/pads.rs`): gilrs on a thread of its own (libudev on
# Linux, linked from the system).
gilrs = "0.11.2"
# The library on disk (`src/library/`): simfiles and zip names in
# Shift-JIS, the cache's records, the data and cache folders.
encoding_rs.workspace = true
serde.workspace = true
dirs = "7.0.0"
# Background movies (`src/video.rs`, feature `video`): the contract with
# `ddi-video-helper`, the sandboxed FFmpeg process `build.rs` builds and
# stages beside the executable (`video/helper`); FFmpeg is never linked
# into the game.
ddi-video-protocol = { workspace = true, optional = true }

[features]
# Background movies through the sandboxed FFmpeg helper (steps 7.7 and
# 7.5), and the DanOni URL importer where it is supported (macOS, x86_64
# Linux; `build.rs`), both on by default; `--no-default-features` builds
# without them (and `build.rs` then builds no helper). Checks and tests set
# `DDI_IMPORTER_TEST_ONLY=1` to build without preparing the importer.
default = ["video", "danoni-importer"]
# Build and stage the isolated native URL importer beside the application.
# Runtime SDK dependencies stay in the separate helper process; the app
# links only the platform-free protocol and bundle integrity hashing.
danoni-importer = ["dep:ddi-importer-protocol", "dep:sha2", "dep:url"]
# Compatibility with the first development feature name.
danoni = ["danoni-importer"]
video = ["dep:ddi-video-protocol", "dep:objc2-video-toolbox", "dep:objc2-core-media", "dep:objc2-core-video", "dep:objc2-core-foundation", "dep:windows"]
# The pacing's simulated display (`src/pacing/sim.rs`), for tests only:
# not in the shipped binary.
sim = []
# Optional Metal planes: explicit DDI_VIDEO_PLANES=metal; copies remain default.
video-metal = ["video", "ddi-render/video-planes", "dep:objc2-metal", "objc2-core-video/CVMetalTexture", "objc2-core-video/CVMetalTextureCache", "objc2-core-video/CVPixelBufferIOSurface", "objc2-core-video/objc2", "objc2-core-video/objc2-metal"]

video-bench = ["video-metal", "ddi-render/video-bench"]

[build-dependencies]
ddi-icon.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
ddi-icon = { workspace = true, features = ["raster"] }

# The output device's latencies, read from CoreAudio's HAL (`src/audio/hal.rs`);
# already a dependency of cpal's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
# Keys' own times (`src/keyboard.rs`): an `NSEvent` local monitor; the
# pointer hidden until the mouse moves (`NSCursor`, `src/shell.rs`).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSCursor", "NSEvent", "NSResponder", "NSView", "block2", "objc2-quartz-core"] }
block2 = "0.6.2"
# The display's refreshes for the pacing (`src/display_link.rs`): the
# window's view's `CADisplayLink` (macOS 14), on the main run loop.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CABase", "CADisplayLink", "CAFrameRateRange", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSObjCRuntime", "NSRunLoop", "NSString"] }

objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLPixelFormat", "MTLResource"] }

# OS video decoding, copied planes; only built with `video` on macOS.
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", optional = true, default-features = false, features = ["std", "VTBase", "VTErrors", "VTSession", "VTDecompressionSession", "VTDecompressionProperties", "VTUtilities", "objc2-core-media", "objc2-core-video"] }

# Experimental Media Foundation/D3D11 decoder; Auto remains the software
# helper. The helper's restricted-token spawn (`src/video/helper/windows_spawn.rs`)
# and its shared memory use the security, job, pipe and memory APIs.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

# The console a Windows build was started from, for its flags' output
# (`attach_console`, `src/lib.rs`); already in the build through others.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

# The player's time zone for the plays list's dates (`localtime_r`,
# `src/play/replays.rs`); already in the build through others.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# The Windows/Linux SVG icon embeds its frozen PNG color field. Enable the
# decoder on these native paths, without adding it to the web's SVG worker.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
resvg = { workspace = true, features = ["raster-images"] }

[dev-dependencies]
ddi-icon.workspace = true
# This crate with its test-only parts (`sim`), for the integration tests.
ddi-desktop = { path = ".", default-features = false, features = ["sim"] }
# The DanOni skin's test draws the upstream art as it is.
resvg = { workspace = true, features = ["raster-images"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ddi-importer-protocol = { workspace = true, optional = true }
sha2 = { version = "0.11.1", optional = true }
url = { version = "2.5.8", optional = true }
