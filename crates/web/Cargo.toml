[package]
name = "ddi-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DitoDitoInfinito: the web shell (wasm only; run through the `ddi` crate)"

[dependencies]
ddi-actor.workspace = true
ddi-chart.workspace = true
ddi-engine.workspace = true
ddi-render.workspace = true
ddi-platform = { workspace = true, features = ["decode"] }
ddi-library.workspace = true
ddi-noteskin.workspace = true
ddi-lua.workspace = true
ddi-ui.workspace = true
# The play session, shared with desktop (step 7.1).
ddi-session.workspace = true
# What both shells do between the settings and the renderer.
ddi-shell.workspace = true
ddi-theme.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
gloo = { workspace = true, features = ["net", "storage", "timers"] }
serde = { workspace = true }
serde_json.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
wgpu = { workspace = true, features = ["std", "webgpu", "webgl", "wgsl"] }
web-sys = { workspace = true, features = [
    "AnalyserNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextLatencyCategory",
    "AudioContextOptions",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "CompositionEvent",
    "Crypto",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomException",
    "DomRect",
    "DomRectReadOnly",
    "DomStringList",
    "DomTokenList",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "FocusOptions",
    "FontFace",
    "FontFaceDescriptors",
    "FontFaceSet",
    "GainNode",
    "Gamepad",
    "GamepadButton",
    "HashChangeEvent",
    "History",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "ImageBitmap",
    "ImageBitmapOptions",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "MediaDevices",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "MutationObserver",
    "MutationObserverInit",
    "Navigator",
    "OfflineAudioContext",
    "Performance",
    "PointerEvent",
    "PremultiplyAlpha",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "RequestCache",
    "RequestInit",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeQuality",
    "Screen",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Storage",
    "StorageManager",
    "TextDecoder",
    "TextDecoderOptions",
    "TextMetrics",
    "Url",
    "VisibilityState",
    "VisualViewport",
    "WebGl2RenderingContext",
    "WheelEvent",
    "Window",
    "Worker",
    "console",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Force getrandom 0.2 "js" feature for transitive wasm32-unknown-unknown deps.
getrandom_02 = { workspace = true, features = ["js"] }

[dev-dependencies]
wasm-bindgen-test.workspace = true
