[package]
name = "ddi-noteskin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DitoDitoInfinito: StepMania noteskins (lookup, metrics, sprite sheets, actors)"

[dependencies]
serde.workspace = true
ddi-actor.workspace = true
ddi-chart.workspace = true
ddi-lua.workspace = true
resvg = { workspace = true, optional = true }

[features]
# `raster`: SVG images drawn into pixels (desktop, the web's SVG worker;
# the app's own wasm goes without it).
raster = ["dep:resvg"]

[dev-dependencies]
ddi-lua.workspace = true
serde_json.workspace = true
