[package]
name = "ddi-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DitoDitoInfinito: screens, input routing, focus, text fields over ddi-actor (UiEvent in, UiRequest out)"

[dependencies]
ddi-actor.workspace = true
ddi-chart.workspace = true
ddi-engine.workspace = true
ddi-library.workspace = true
ddi-noteskin.workspace = true
ddi-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
# Layout frames (P8), optional.
taffy = { workspace = true, optional = true }

[features]
default = []
# Flexbox and grid frames through taffy (`layout`).
layout = ["dep:taffy"]

[dev-dependencies]
# Unicode's NFKD for the search in tests (the shells bring their own).
ddi-library = { workspace = true, features = ["nfkd"] }
