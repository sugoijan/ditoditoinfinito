# The software video decoder: a cut-down FFmpeg compiled to wasm with
# wasi-sdk (docs/research/video-backgrounds.md, section 6). Read by
# `video/build.sh` (one `key = "value"` per line, the configure flags one per
# line; keep that shape) and by `xtask gen-credits`.
#
# The module is LGPL-2.1-or-later (no `--enable-gpl`, no `--enable-nonfree`);
# it is built, never committed, and served as a separate file.

name = "FFmpeg"
version = "9.0.2"
tag = "n9.0.2"
license = "LGPL-2.1-or-later"
homepage = "https://ffmpeg.org/"
source_url = "https://github.com/FFmpeg/FFmpeg/tree/n9.0.2"

# Release tarball, signed with the FFmpeg release key
# FCF9 86EA 15E6 E293 A564 4F10 B432 2F04 D676 58D8 (checked 2026-10-09).
tarball_url = "https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz"
tarball_sha256 = "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"

# zlib, linked in for what StepMania's build gets from it (compressed MP4
# headers, PNG and other zlib-based codecs). Zlib licence.
zlib_version = "1.3.2"
zlib_url = "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz"
zlib_sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"

# Binaryen's wasm-opt, run on the linked module (clang would run whichever
# wasm-opt is on PATH; the build passes --no-wasm-opt and runs this one, so
# every host gives the same module).
binaryen_version = "version_133"
binaryen_url = "https://github.com/WebAssembly/binaryen/releases/download/version_133/"
binaryen_sha256_arm64_macos = "ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8"
binaryen_sha256_x86_64_macos = "13a9b90be775c6389ce3d1f879cb8627bea56708ba8c122983941d53a8199b95"
binaryen_sha256_x86_64_linux = "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489"
binaryen_sha256_arm64_linux = "89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8"

# Toolchain: wasi-sdk release tarballs, per host.
wasi_sdk_version = "34.0"
wasi_sdk_url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/"
wasi_sdk_sha256_arm64_macos = "9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9"
wasi_sdk_sha256_x86_64_macos = "87d27fa8adc68dee59bfbf2e22a6d34ef717c34d6bf1d8af2a56fc929d9ce0eb"
wasi_sdk_sha256_x86_64_linux = "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
wasi_sdk_sha256_arm64_linux = "f7e243dff54d60bcc576e94d6166b69f410f2500ae4a9ceef34315be10e77971"

# `configure` flags after the toolchain ones (`--cc`, `--ar`, the zlib paths
# are added by the build script). What StepMania 5.1 builds
# (CMake/SetupFfmpeg.cmake: every built-in decoder, demuxer and parser, with
# zlib; no devices, no filters), less the audio and subtitle decoders, since
# a movie's sound is ignored; single-threaded; swscale for the pixel formats
# the shim does not copy itself.
configure = [
  "--target-os=none",
  "--arch=wasm32",
  "--enable-cross-compile",
  "--disable-everything",
  "--disable-programs",
  "--disable-doc",
  "--disable-network",
  "--disable-pthreads",
  "--disable-w32threads",
  "--disable-os2threads",
  "--disable-runtime-cpudetect",
  "--disable-autodetect",
  "--disable-debug",
  "--disable-avdevice",
  "--disable-avfilter",
  "--disable-swresample",
  "--enable-avcodec",
  "--enable-avformat",
  "--enable-swscale",
  "--enable-demuxers",
  "--enable-parsers",
  "--enable-protocol=file",
  "--enable-zlib",
  "--enable-small",
  "--extra-cflags=-msimd128 -Oz",
]

# Every video decoder FFmpeg has built in, one `--enable-decoder=` for all
# of them. Derived for 9.0.2 as the decoders `configure --list-decoders`
# names that `ffmpeg -decoders` lists as video (some under other names:
# `fourxm` is 4xm, `eightbps` 8bps, `zero12v` 012v), without the hardware
# and external-library ones configure drops anyway. Recheck on an FFmpeg
# upgrade. No AV1: FFmpeg decodes it only through hardware or libdav1d, and
# StepMania links neither.
