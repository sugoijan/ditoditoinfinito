[package]
name = "ddi-video-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "DitoDitoInfinito: the sandboxed video decoder process (FFmpeg linked statically; built by desktop/build.rs, never linked into the game)"

[[bin]]
name = "ddi-video-helper"
path = "src/main.rs"

[dependencies]
ddi-video-protocol.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# The Linux sandbox: a seccomp-bpf allowlist (`src/sandbox/linux.rs`) and
# a Landlock ruleset that grants no path.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5.0"
landlock = "0.4.7"

# The Windows side of the restricted token (`src/sandbox/windows.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }

[build-dependencies]
cc = "1.9.0"
