[workspace]
resolver = "3"
exclude = ["tools/danoni-dump/desktop-probe", "tools/danoni-dump/pack-verify"]
members = ["crates/*", "tools/danoni-importer", "tools/danoni-dump/rust", "video/protocol", "video/helper", "xtask"]
# `app` is the game: built for wasm by Trunk (site/index.html) it starts the
# web shell, built natively (a bare `cargo run`) the desktop shell.
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["すごいジャン <me@sugoijan.dev>"]
repository = "https://github.com/sugoijan/ditoditoinfinito"

[workspace.dependencies]
# local crates
ddi-danoni-export = { path = "tools/danoni-dump/rust", default-features = false }
ddi-importer-protocol = { path = "crates/importer-protocol" }
ddi-video-protocol = { path = "video/protocol" }
ddi-chart = { path = "crates/chart" }
ddi-engine = { path = "crates/engine" }
ddi-render = { path = "crates/render" }
ddi-platform = { path = "crates/platform" }
ddi-library = { path = "crates/library" }
ddi-actor = { path = "crates/actor" }
ddi-ui = { path = "crates/ui" }
ddi-theme = { path = "crates/theme" }
ddi-noteskin = { path = "crates/noteskin" }
ddi-lua = { path = "crates/lua" }
ddi-web = { path = "crates/web" }
ddi-desktop = { path = "crates/desktop", default-features = false }
ddi-session = { path = "crates/session" }
ddi-shell = { path = "crates/shell" }

# lunita, our hardened fork of piccolo (docs/plans/piccolo-fork.md).
lunita = "0.1"

# app / web
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo = { version = "0.12", features = ["futures"] }
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-test = "0.3"
getrandom_02 = { package = "getrandom", version = "0.2" }

# rendering
wgpu = { version = "30", default-features = false }
glyphon = "0.12"
bytemuck = { version = "1", features = ["derive"] }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ttf-parser = "0.25.1"
thiserror = "2"
miniz_oxide = "0.9"
encoding_rs = "0.8.42"
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
symphonia = { version = "0.6.1", default-features = false }

# xtask
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Native release builds (`cargo run --profile desktop`): `release` is
# tuned for the wasm bundle's size; the desktop wants speed, and
# unwinding so a decoder that panics on a broken file fails that file
# only (`catch_unwind` in the image loader and the audio decoder).
[profile.desktop]
inherits = "release"
opt-level = 3
panic = "unwind"

[profile.dev]
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

# The SDK has many integration-test binaries; keep first-party code cheap to
# compile while dependencies (especially audio codecs) retain their optimization.
[profile.dev.package.ddi-danoni-export]
opt-level = 0

# The video decoder helper (`video/helper`), built by desktop/build.rs in
# an independent target directory whatever the game's profile: fast (it
# decodes), no LTO (a small crate over static C libraries), aborting on
# panics (the game treats a dead helper as a crashed decoder).
[profile.helper]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
debug = 0
strip = "symbols"

# Native importer executables, built by desktop/build.rs in an independent
# target directory. Keep unwinding and bounded compiler memory regardless of
# the app's release/desktop profile. The upstream Ruffle workspace stays separate.
[profile.importer]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
panic = "unwind"
debug = 0

# Optimizing the large SDK exceeds the build watchdog's 2 GiB per-process
# limit on Linux. Keep its control/export code cheap to compile; codec and
# rendering dependencies retain the importer's optimization above.
[profile.importer.package.ddi-danoni-export]
opt-level = 0
