[package]
name = "ddi-skin-studio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SkinCraft native noteskin editor with vector, raster and live game preview"

[features]
skincraft = ["dep:vectorcraft-ui-egui", "dep:vectorcraft-engine", "dep:vectorcraft-doc", "dep:vectorcraft-svg", "dep:vectorcraft-format", "eframe/x11", "eframe/wayland", "dep:rfd", "dep:photocraft-automation", "dep:rmcp", "dep:schemars", "dep:tokio", "dep:base64"]

[[bin]]
name = "skincraft"
path = "src/main.rs"
required-features = ["skincraft"]

[workspace]
resolver = "3"

[dependencies]
rfd = { version = "0.17.2", optional = true }
photocraft-automation = { path = "../../../photocraft/crates/automation", optional = true }
rmcp = { version = "3.5.1", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
schemars = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time", "fs"] }
base64 = { version = "0.22", optional = true }
vectorcraft-ui-egui = { path = "../../../vectorcraft/crates/ui-egui", optional = true }
vectorcraft-engine = { path = "../../../vectorcraft/crates/engine", optional = true, default-features = false }
vectorcraft-doc = { path = "../../../vectorcraft/crates/doc", optional = true }
vectorcraft-svg = { path = "../../../vectorcraft/crates/svg", optional = true }
vectorcraft-format = { path = "../../../vectorcraft/crates/format", optional = true }
ddi-chart = { path = "../../chart" }
ddi-engine = { path = "../../engine" }
ddi-render = { path = "../../render" }
ddi-noteskin = { path = "../../noteskin" }
ddi-desktop = { path = "../../desktop", default-features = false }
photocraft-ui-egui = { path = "../../../photocraft/crates/ui-egui" }
photocraft-format = { path = "../../../photocraft/crates/format" }
photocraft-doc = { path = "../../../photocraft/crates/doc" }
photocraft-compose = { path = "../../../photocraft/crates/compose" }
photocraft-engine = { path = "../../../photocraft/crates/engine" }
photocraft-cms = { path = "../../../photocraft/crates/cms" }
photocraft-color = { path = "../../../photocraft/crates/color" }
photocraft-io = { path = "../../../photocraft/crates/io" }
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

# VectorCraft's PDF facade must use its matching shared backend when embedded.
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
