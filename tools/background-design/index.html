<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Background study · Dito Dito Infinito</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="study.css">
  <script defer src="../../site/boot-art-data.js"></script>
  <script defer src="analysis.js"></script>
  <script defer src="timing.js"></script>
  <script defer src="visuals.js"></script>
  <script defer src="study.js"></script>
</head>
<body>
<header>
  <div><span class="eyebrow">DITO DITO INFINITO / DESIGN STUDY</span><h1>Generative backgrounds</h1></div>
  <div class="actions">
    <button id="export">Export choices</button>
    <label class="file-button">Import choices<input id="import" type="file" accept="application/json,.json"></label>
    <button id="reset">Reset</button>
  </div>
</header>
<main>
  <section class="preview" aria-label="Background preview">
    <div class="toolbar">
      <label>Song <select id="song"></select></label>
      <label class="file-button">Open files…<input id="files" type="file" multiple accept="audio/*,.ogg,.opus,.mp3,.wav,.flac,.sm,.ssc,image/*"></label>
      <span class="spacer"></span>
      <label>View <select id="mode"><option value="single">One at a time</option><option value="grid">All four</option></select></label>
      <label id="candidate-label">Candidate <select id="candidate"></select></label>
    </div>
    <div id="stage" class="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
      <canvas id="overlay" role="img" aria-label="The background drawn"></canvas>
      <div id="loading" class="loading" hidden></div>
    </div>
    <div class="transport">
      <button id="play" aria-pressed="false">Play</button>
      <input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="Position">
      <output id="time">0:00.0</output>
      <output id="beat" title="Beat · measure, from the simfile">beat –</output>
      <label><input id="loop" type="checkbox" checked> Loop</label>
    </div>
    <div class="options">
      <label>Palette <select id="palette"></select></label>
      <label><input id="over" type="checkbox"> Over the song's picture</label>
      <label title="Options → Display → Background brightness (40% by default)">Picture brightness <input id="brightness" type="range" min="0.1" max="1" step="0.05" value="0.4"></label>
      <label><input id="field" type="checkbox" checked> Show the field</label>
      <label>Field filter <input id="filter" type="range" min="0" max="1" step="0.05" value="0.4"></label>
      <label><input id="reduced" type="checkbox"> Reduced motion (held still)</label>
      <label>Resolution <select id="resolution"><option value="1">Full</option><option value="0.5">Half</option></select></label>
    </div>
    <section class="traces" aria-label="What the music gives">
      <div class="traces-heading"><h2>What the music gives</h2><span class="muted">the last 8 s and the next 2; beats and measures from the simfile</span></div>
      <canvas id="traces" role="img" aria-label="The music's analysis over time"></canvas>
    </section>
    <p id="status" class="note" role="status">Choices save in this browser. Export them to keep or share.</p>
  </section>
  <aside aria-label="Controls">
    <details open><summary>Choosing</summary>
      <div class="control-group" id="approval"></div>
    </details>
    <div id="panels"></div>
  </aside>
</main>
</body>
</html>
