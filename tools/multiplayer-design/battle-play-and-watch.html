<style>
#ddi-battle-play .game{--bg:#161318;--panel:#252129;--raised:#35303b;--ink:#f2eee9;--dim:#b3aab8;--line:#49414e;--pink:#ff6ea0;--mint:#9addbd;--coral:#ff8f86;--amber:#e9c58b;--blue:#8fbce8;color-scheme:dark;background:var(--bg);color:var(--ink);font:14px/1.4 'Iosevka Term',ui-monospace,SFMono-Regular,Consolas,monospace;padding:24px;min-height:980px;position:relative;display:flex;flex-direction:column;gap:24px;box-sizing:border-box;}
#ddi-battle-play .game *{box-sizing:border-box;}
#ddi-battle-play .game :is(h2,h3,p){margin:0;}
#ddi-battle-play .game h2{font-size:20px;font-weight:500;}
#ddi-battle-play .game h3{font-size:15px;font-weight:500;}
#ddi-battle-play .game .small{font-size:12px;}
#ddi-battle-play .game .muted{color:var(--dim);}
#ddi-battle-play .game .accent{color:var(--pink);}
#ddi-battle-play .game .eyebrow{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
#ddi-battle-play .game svg{width:17px;height:17px;flex-shrink:0;}
#ddi-battle-play .game button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid transparent;border-radius:5px;min-height:38px;padding:8px 12px;}
#ddi-battle-play .game button:hover:not(:disabled){background:var(--raised);}
#ddi-battle-play .game button:disabled{opacity:.45;}
#ddi-battle-play .game button.quiet{background:transparent;}
#ddi-battle-play .game button.primary{outline:2px solid var(--pink);outline-offset:3px;background:var(--raised);}
#ddi-battle-play .game button[aria-pressed=true]{border-color:var(--pink);background:var(--raised);}
#ddi-battle-play .game .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
#ddi-battle-play .game .header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-right:90px;align-items:start;}
#ddi-battle-play .game .header>div{display:grid;gap:3px;}
#ddi-battle-play .game .song-header{text-align:right;}
#ddi-battle-play .game .arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,288px) minmax(0,1fr);gap:28px;flex:1;align-items:start;}
#ddi-battle-play .game .people{grid-column:1;grid-row:1;width:min(100%,190px);justify-self:end;padding-top:18px;}
#ddi-battle-play .game .population{display:flex;align-items:baseline;gap:7px;margin-bottom:20px;}
#ddi-battle-play .game .population strong{font-size:30px;font-weight:500;}
#ddi-battle-play .game .roster{display:grid;gap:7px;}
#ddi-battle-play .game .person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:8px 9px;text-align:left;min-width:0;}
#ddi-battle-play .game button.person{width:100%;background:transparent;}
#ddi-battle-play .game .person.self{background:var(--panel);border-radius:5px;}
#ddi-battle-play .game .person.out{color:var(--dim);}
#ddi-battle-play .game .person .name{overflow-wrap:anywhere;}
#ddi-battle-play .game .person .name small{font-size:11px;color:var(--dim);margin-left:5px;}
#ddi-battle-play .game .person .context{grid-column:1/-1;color:var(--dim);font-size:11px;}
#ddi-battle-play .game .mini-life{height:3px;background:var(--raised);grid-column:1/-1;}
#ddi-battle-play .game .mini-life span{display:block;height:100%;background:var(--mint);}
#ddi-battle-play .game .person.out .mini-life span{width:0!important;}
#ddi-battle-play .game .roster-foot{margin-top:18px;font-size:12px;color:var(--dim);}
#ddi-battle-play .game .field-wrap{grid-column:2;grid-row:1;min-width:0;position:relative;}
#ddi-battle-play .game .identity{height:34px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--dim);}
#ddi-battle-play .game .identity.watching{color:var(--ink);background:var(--panel);border-radius:4px;}
#ddi-battle-play .game .life{height:8px;border-radius:8px;background:var(--raised);display:flex;justify-content:center;overflow:hidden;margin-top:12px;}
#ddi-battle-play .game .life span{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),#3d937b 35%,#3d937b 65%,var(--mint));}
#ddi-battle-play .game .life.critical span{background:var(--coral);}
#ddi-battle-play .game .score{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;font-variant-numeric:tabular-nums;}
#ddi-battle-play .game .score strong{font-size:21px;font-weight:500;}
#ddi-battle-play .game .field{height:510px;position:relative;margin-top:12px;background:linear-gradient(90deg,transparent 24.7%,#ffffff06 25%,transparent 25.3%,transparent 49.7%,#ffffff06 50%,transparent 50.3%,transparent 74.7%,#ffffff06 75%,transparent 75.3%);}
#ddi-battle-play .game .note{position:absolute;left:calc(var(--lane)*25%);width:25%;display:flex;align-items:center;justify-content:center;height:44px;color:var(--pink);pointer-events:none;}
#ddi-battle-play .game .note svg{width:42px;height:42px;stroke-width:2.3;}
#ddi-battle-play .game .note.blue{color:var(--blue);}
#ddi-battle-play .game .note.mine{color:var(--amber);}
#ddi-battle-play .game .note.mine svg{width:30px;height:30px;}
#ddi-battle-play .game .note.receptor{color:var(--dim);}
#ddi-battle-play .game .judgment{position:absolute;top:215px;left:0;right:0;text-align:center;pointer-events:none;}
#ddi-battle-play .game .judgment strong{font-size:25px;font-weight:800;letter-spacing:-1px;display:block;text-shadow:0 2px 8px var(--bg);}
#ddi-battle-play .game .judgment .combo{font-size:44px;font-weight:500;line-height:1.2;text-shadow:1px 0 var(--pink),-1px 0 var(--pink),0 1px var(--pink),0 -1px var(--pink);}
#ddi-battle-play .game .watermark{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:14px;letter-spacing:1px;color:#ffffff20;}
#ddi-battle-play .game .weapons{grid-column:3;grid-row:1;min-width:0;position:relative;height:642px;width:min(100%,165px);}
#ddi-battle-play .game .incoming{position:absolute;top:108px;left:0;right:0;display:grid;gap:9px;padding-left:12px;border-left:2px solid var(--amber);}
#ddi-battle-play .game .incoming strong{font-size:32px;font-weight:500;line-height:1;}
#ddi-battle-play .game .incoming .strength{display:flex;align-items:baseline;gap:8px;}
#ddi-battle-play .game .incoming .weakened{color:var(--mint);font-size:12px;}
#ddi-battle-play .game .incoming.calm{border-left-color:var(--line);color:var(--dim);}
#ddi-battle-play .game .power{position:absolute;left:0;right:0;bottom:12px;display:grid;gap:8px;padding-left:12px;}
#ddi-battle-play .game .power-label{display:flex;justify-content:space-between;gap:6px;font-size:12px;}
#ddi-battle-play .game .power-track{height:6px;background:var(--raised);}
#ddi-battle-play .game .power-track span{display:block;height:100%;background:var(--pink);}
#ddi-battle-play .game .power-track.full span{background:var(--ink);}
#ddi-battle-play .game .reverse .incoming{top:430px;}
#ddi-battle-play .game .reverse .power{top:80px;bottom:auto;}
#ddi-battle-play .game .footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;border-top:1px solid var(--line);padding-top:16px;min-height:60px;}
#ddi-battle-play .game .frozen .field{opacity:.18;}
#ddi-battle-play .game .outcome{position:absolute;left:-12px;right:-12px;top:230px;text-align:center;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 12px;display:grid;gap:16px;}
#ddi-battle-play .game .outcome strong{font-size:42px;font-weight:500;}
#ddi-battle-play .game .outcome .row{justify-content:center;}
#ddi-battle-play .game .winner-mark{text-align:center;color:var(--mint);padding:10px 0;}
#ddi-battle-play .game .unavailable{height:510px;display:grid;align-content:center;text-align:center;gap:12px;}
#ddi-battle-play .game .overlay{position:absolute;inset:0;background:#09070be8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5;}
#ddi-battle-play .game .dialog{width:min(100%,470px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:20px;}
#ddi-battle-play .game .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
#ddi-battle-play .game .facts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;}
#ddi-battle-play .game .facts span:nth-child(odd){color:var(--dim);}
#ddi-battle-play .game .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
@media(max-width:760px){#ddi-battle-play .game{min-height:1600px;padding:20px;}#ddi-battle-play .game .arena{grid-template-columns:1fr;gap:20px;}#ddi-battle-play .game .field-wrap{grid-column:1;grid-row:2;width:min(100%,288px);justify-self:center;}#ddi-battle-play .game .weapons{grid-column:1;grid-row:1;position:static;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(100%,480px);height:auto;min-height:150px;justify-self:center;}#ddi-battle-play .game .incoming,#ddi-battle-play .game .power,#ddi-battle-play .game .reverse .incoming,#ddi-battle-play .game .reverse .power{position:static;align-content:start;}#ddi-battle-play .game .reverse .weapons{grid-row:3;}#ddi-battle-play .game .people{grid-column:1;grid-row:4;width:100%;justify-self:stretch;padding-top:0;}#ddi-battle-play .game .roster{grid-template-columns:repeat(2,minmax(0,1fr));}#ddi-battle-play .game .population{margin-bottom:12px;}#ddi-battle-play .game .header{padding-right:70px;}#ddi-battle-play .game .song-header{text-align:left;}#ddi-battle-play .game.has-overlay .arena,#ddi-battle-play .game.has-overlay .footer{display:none;}#ddi-battle-play .game .overlay{position:static;padding:0;background:var(--bg);}}
@media(max-width:420px){#ddi-battle-play .game{padding:16px;min-height:1600px;}#ddi-battle-play .game .header{grid-template-columns:1fr;padding-right:80px;}#ddi-battle-play .game .dialog{padding:18px;}#ddi-battle-play .game .outcome{left:0;right:0;}#ddi-battle-play .game .incoming strong{font-size:28px;}}
@media(pointer:coarse){#ddi-battle-play .game button{min-height:44px;}}
#ddi-battle-play .game .roster-label{display:flex;justify-content:space-between;padding:0 9px 8px;font-size:11px;color:var(--dim);}

/* Gameplay study: normal field with small remote fields in its side space. */
#ddi-battle-play .game{font-family:DDIStudy,ui-monospace,monospace;min-height:760px;padding:0;display:block;background:radial-gradient(ellipse at 50% 30%,#1c2029 0%,#101016 65%);--field-width:clamp(256px,28.125%,288px);}
#ddi-battle-play .game .header{position:absolute;inset:18px 20px auto;display:grid;grid-template-columns:1fr var(--field-width) 1fr;padding-right:0;gap:10px;z-index:1;pointer-events:none;}
#ddi-battle-play .game .header .song-header{text-align:right;padding-right:85px;}
#ddi-battle-play .game .population-inline{display:block;margin-top:5px;color:var(--ink);}
#ddi-battle-play .game .arena{position:relative;display:block;height:760px;}
#ddi-battle-play .game .field-wrap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:var(--field-width);height:690px;padding:0 4px;background:#05091080;}
#ddi-battle-play .game .identity{position:absolute;top:657px;left:0;right:0;height:27px;font-size:12px;background:transparent;}
#ddi-battle-play .game .identity:not(.watching){display:none;}
#ddi-battle-play .game .identity.watching{background:#161318de;}
#ddi-battle-play .game .life{margin-top:22px;height:8px;}
#ddi-battle-play .game .life span{background:linear-gradient(110deg,#35d289,#166644 35%,#207f5a 65%,#4cdb9b);}
#ddi-battle-play .game .life.critical span{background:var(--coral);}
#ddi-battle-play .game .score{justify-content:center;margin-top:10px;}
#ddi-battle-play .game .score strong{font-family:DDIStudy;font-size:25px;font-weight:600;}
#ddi-battle-play .game .score .small{display:none;}
#ddi-battle-play .game .field{height:570px;margin-top:14px;background:none;}
#ddi-battle-play .game .note{height:60px;transform:translateY(-50%);z-index:2;}
#ddi-battle-play .game .skin-glyph{display:block;position:relative;width:150%;aspect-ratio:1;flex-shrink:0;transform:rotate(var(--turn));background:linear-gradient(130deg,#fd973c 10%,#f2489a 45%,#bc5cfa 70%,#40b9ff 90%);mask-image:var(--arrow-mask);mask-size:contain;mask-repeat:no-repeat;mask-position:center;}
#ddi-battle-play .game .skin-vertical{mask-image:var(--vertical-mask);}
#ddi-battle-play .game .blue .skin-glyph{background:linear-gradient(130deg,#458fff 5%,#59d3ef 40%,#50ebb2 70%,#c1fe84);}
#ddi-battle-play .game .flat .skin-glyph{background:#93a6ff;}
#ddi-battle-play .game .skin-receptor{background:#8c98a3!important;filter:drop-shadow(0 0 2px #000);}
#ddi-battle-play .game .mine .skin-glyph{mask:none;background:none!important;}
#ddi-battle-play .game .mine-art{width:100%;height:auto;display:block;}
#ddi-battle-play .game .hold-body{position:absolute;width:7px;background:linear-gradient(90deg,#29769e80,#7da8e6,#29769e80);border-radius:5px;transform:translateX(-50%);z-index:1;}
#ddi-battle-play .game .judgment{top:38%;z-index:3;}
#ddi-battle-play .game .judgment strong{font-family:DDIJudgment,DDIStudy,monospace;font-size:30px;font-weight:800;color:#a6f2ff;}
#ddi-battle-play .game .judgment .combo{display:block;margin-top:24px;font-family:DDIStudy;font-size:59px;font-weight:600;text-shadow:2px 0 #34205e,-2px 0 #34205e,0 2px #34205e,0 -2px #34205e,3px 0 #bca2ff,-3px 0 #bca2ff,0 3px #bca2ff,0 -3px #bca2ff;}
#ddi-battle-play .game .weapons{position:static;width:auto;height:auto;}
#ddi-battle-play .game .incoming{left:calc(50% + var(--field-width)/2 + 10px);right:auto;top:100px;width:78px;padding-left:8px;gap:7px;border-left-width:1px;}
#ddi-battle-play .game .incoming .eyebrow{font-size:11px;letter-spacing:0;text-transform:none;}
#ddi-battle-play .game .incoming strong{font-size:25px;}
#ddi-battle-play .game .incoming .strength{gap:4px;flex-wrap:wrap;}
#ddi-battle-play .game .incoming .small,#ddi-battle-play .game .incoming .weakened{font-size:11px;}
#ddi-battle-play .game .power{left:calc(50% - var(--field-width)/2 - 90px);right:auto;top:470px;bottom:auto;width:80px;padding-left:0;}
#ddi-battle-play .game .power-label{font-size:11px;flex-wrap:wrap;}
#ddi-battle-play .game .power .small{font-size:11px;}
#ddi-battle-play .game .reverse .incoming{top:500px;}
#ddi-battle-play .game .reverse .power{top:110px;bottom:auto;}
#ddi-battle-play .game .opponent-wing{position:absolute;top:120px;width:calc(50% - var(--field-width)/2 - 118px);max-width:260px;}
#ddi-battle-play .game .wing-left{left:16px;}
#ddi-battle-play .game .wing-right{right:16px;}
#ddi-battle-play .game .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;}
#ddi-battle-play .game .miniature{display:block;min-width:0;padding:0;background:transparent;border:0;border-radius:0;text-align:left;color:var(--ink);}
#ddi-battle-play .game button.miniature{padding:0;background:transparent;border:1px solid transparent;}
#ddi-battle-play .game button.miniature[aria-pressed=true]{border-color:var(--pink);}
#ddi-battle-play .game .mini-name{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font-size:12px;min-height:24px;overflow-wrap:anywhere;}
#ddi-battle-play .game .mini-name small{font-size:11px;color:var(--dim);}
#ddi-battle-play .game .mini-screen{position:relative;display:block;height:220px;background:#060b12a8;padding:8px 5px 0;overflow:hidden;}
#ddi-battle-play .game .mini-life{display:flex;justify-content:center;height:3px;background:var(--raised);}
#ddi-battle-play .game .mini-life span{display:block;height:100%;background:linear-gradient(90deg,#35d289,#166644,#35d289);}
#ddi-battle-play .game .mini-score{display:block;font-size:11px;text-align:center;margin-top:5px;color:var(--dim);}
#ddi-battle-play .game .mini-field{display:block;position:relative;height:177px;margin-top:3px;}
#ddi-battle-play .game .mini-field .note{height:24px;}
#ddi-battle-play .game .mini-field .hold-body{width:3px;}
#ddi-battle-play .game .mini-field .judgment{top:38%;}
#ddi-battle-play .game .mini-field .judgment strong{font-size:11px;letter-spacing:-.4px;}
#ddi-battle-play .game .mini-field .judgment .combo{font-size:22px;margin-top:9px;text-shadow:1px 0 #8763c8,-1px 0 #8763c8,0 1px #8763c8,0 -1px #8763c8;}
#ddi-battle-play .game .mini-message{display:grid;place-items:center;height:90%;font-size:12px;color:var(--dim);}
#ddi-battle-play .game .miniature.out .mini-name{color:var(--dim);}
#ddi-battle-play .game .miniature.out .mini-screen{background:#060b1240;}
#ddi-battle-play .game .dense .mini-screen{height:160px;}
#ddi-battle-play .game .dense .mini-field{height:118px;}
#ddi-battle-play .game .dense .mini-grid{gap:12px;}
#ddi-battle-play .game .dense .mini-field .judgment .combo{margin-top:4px;font-size:18px;}
#ddi-battle-play .game .mini-summary{display:block;margin-top:12px;color:var(--dim);font-size:11px;}
#ddi-battle-play .game .footer{position:absolute;bottom:12px;left:20px;right:20px;border:0;margin:0;padding:0;min-height:40px;}
#ddi-battle-play .game .watermark{display:none;}
#ddi-battle-play .game .winner-mark{position:absolute;bottom:12px;left:0;right:0;}
#ddi-battle-play .game .outcome{top:235px;}
#ddi-battle-play .game .unavailable{height:625px;}
@media(max-width:850px){#ddi-battle-play .game{min-height:1510px;padding:16px;}#ddi-battle-play .game .header{position:static;display:flex;justify-content:space-between;margin-bottom:24px;min-height:55px;padding-right:80px;}#ddi-battle-play .game .header .song-header{padding:0;}#ddi-battle-play .game .arena{height:auto;display:grid;grid-template-columns:1fr;gap:24px;}#ddi-battle-play .game .field-wrap{position:relative;top:auto;left:auto;transform:none;width:min(288px,100%);grid-column:1;grid-row:2;justify-self:center;}#ddi-battle-play .game .weapons{position:static;width:100%;grid-column:1;grid-row:1;display:flex;justify-content:center;gap:32px;min-height:125px;}#ddi-battle-play .game .incoming,#ddi-battle-play .game .power,#ddi-battle-play .game .reverse .incoming,#ddi-battle-play .game .reverse .power{position:static;width:120px;min-height:110px;}#ddi-battle-play .game .opponent-wing{position:static;max-width:none;width:100%;grid-column:1;}#ddi-battle-play .game .wing-left{grid-row:3;}#ddi-battle-play .game .wing-right{grid-row:4;}#ddi-battle-play .game .mini-grid{grid-template-columns:repeat(4,minmax(0,1fr));}#ddi-battle-play .game .dense .mini-grid{grid-template-columns:repeat(3,minmax(0,1fr));}#ddi-battle-play .game .footer{position:static;margin-top:20px;}#ddi-battle-play .game.has-overlay .arena,#ddi-battle-play .game.has-overlay .footer{display:none;}}
@media(max-width:480px){#ddi-battle-play .game{min-height:2160px;}#ddi-battle-play .game .mini-grid,#ddi-battle-play .game .dense .mini-grid{grid-template-columns:repeat(2,minmax(0,1fr));}#ddi-battle-play .game .dense .mini-screen{height:155px;}#ddi-battle-play .game .header{align-items:start;flex-wrap:wrap;gap:8px;}#ddi-battle-play .game .mini-grid{gap:14px;}}

#ddi-battle-play .game .header{display:block;}
#ddi-battle-play .game .remaining{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;}
#ddi-battle-play .game .battle-power{position:absolute;left:4px;right:4px;top:12px;height:3px;background:#24212b;z-index:4;}
#ddi-battle-play .game .battle-power>span,#ddi-battle-play .game .mini-power>span{height:100%;display:block;background:#d098eb;}
#ddi-battle-play .game .battle-power.full>span,#ddi-battle-play .game .mini-power.full>span{background:#ece0f7;}
#ddi-battle-play .game .mini-power{position:absolute;top:3px;left:5px;right:5px;height:2px;background:#24212b;}
#ddi-battle-play .game .mini-power.inactive{opacity:.35;}
#ddi-battle-play .game .score{height:35px;min-height:35px;}
#ddi-battle-play .game .mini-score{height:15px;min-height:15px;}
#ddi-battle-play .game .score-hidden{visibility:hidden;}
#ddi-battle-play .game .incoming-cue{position:absolute;top:113px;left:calc(50% + var(--field-width)/2 + 10px);display:flex;gap:7px;align-items:center;color:var(--amber);}
#ddi-battle-play .game .incoming-cue svg{width:17px;height:17px;}
#ddi-battle-play .game .mine-pips{display:grid;grid-template-columns:repeat(4,3px);gap:3px;}
#ddi-battle-play .game .mine-pips>span{width:3px;height:3px;border-radius:50%;background:currentColor;}
#ddi-battle-play .game .incoming-cue.active{opacity:.7;}
#ddi-battle-play .game .incoming-cue.recovering{color:var(--dim);}
#ddi-battle-play .game .reverse .incoming-cue{top:590px;}
#ddi-battle-play .game .field-wrap{isolation:isolate;background:none;}
#ddi-battle-play .game .field-wrap::before{content:'';position:absolute;inset:0;background:#05091085;z-index:1;pointer-events:none;}
#ddi-battle-play .game .hand-behind{position:absolute;left:50%;top:130px;transform:translateX(-50%);width:390px;max-width:none;height:auto;opacity:.55;z-index:0;pointer-events:none;}
#ddi-battle-play .game .field-wrap>.life,#ddi-battle-play .game .field-wrap>.score,#ddi-battle-play .game .field-wrap>.field{position:relative;z-index:3;}
#ddi-battle-play .game .field-wrap>.identity,#ddi-battle-play .game .field-wrap>.outcome,#ddi-battle-play .game .field-wrap>.winner-mark{z-index:5;}
#ddi-battle-play .game .field-wrap>.unavailable{position:relative;z-index:3;}
@media(max-width:850px){#ddi-battle-play .game .header{min-height:25px;margin-bottom:8px;}#ddi-battle-play .game .arena{gap:20px;}#ddi-battle-play .game .weapons{display:none;}#ddi-battle-play .game .incoming-cue,#ddi-battle-play .game .reverse .incoming-cue{position:absolute;top:49px;left:calc(50% + 120px);z-index:4;}#ddi-battle-play .game .arena>.field-wrap{grid-row:1;}#ddi-battle-play .game .wing-left{grid-row:2;}#ddi-battle-play .game .wing-right{grid-row:3;}#ddi-battle-play .game .hand-behind{width:340px;}#ddi-battle-play .game .mine-pips{grid-template-columns:repeat(2,3px);gap:2px;}}
@media(max-width:420px){#ddi-battle-play .game .incoming-cue,#ddi-battle-play .game .reverse .incoming-cue{left:calc(50% + 96px);gap:5px;}#ddi-battle-play .game .hand-behind{width:310px;}}
#ddi-battle-play .game .attack-effects{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;}
#ddi-battle-play .game .overlay{z-index:8;}
#ddi-battle-play .game .shock-symbol{width:30px;height:30px;object-fit:contain;}
#ddi-battle-play .game .incoming-cue{gap:2px;}
#ddi-battle-play .game .miniature{position:relative;}
#ddi-battle-play .game .miniature.attack-recipient::after{content:'';position:absolute;inset:23px 0 0;pointer-events:none;border:1px solid #c7b1f0;box-shadow:inset 0 0 15px #b49be922,0 0 5px #b49be92b;border-radius:2px;}
#ddi-battle-play .game .field-wrap.attack-recipient::after{content:'';position:absolute;inset:0;pointer-events:none;border:1px solid #c7b1f0;z-index:5;}
#ddi-battle-play .game .miniature.attack-received::after{background:#c4b9ff14;border-color:#e5ddff;}
#ddi-battle-play .game .field-wrap.attack-received::after{border-color:#e5ddff;box-shadow:inset 3px 0 6px #c4b9ff22,inset -3px 0 6px #c4b9ff22;}
#ddi-battle-play .game.impact-playing .attack-received::after{animation:ddi-impact 650ms ease-out both;}
@keyframes ddi-impact{0%{opacity:.35}20%{opacity:1}100%{opacity:.25}}
@media(prefers-reduced-motion:reduce){#ddi-battle-play .game.impact-playing .attack-received::after{animation:none;}}
</style>

<section hidden data-variant="Incoming lightning" aria-label="Incoming lightning"><div class="game" data-view="incoming-bolt" aria-label="Attack warning delivered to your field"></div></section>

<section hidden data-variant="Score visible" aria-label="Optional score display"><div class="game" data-view="score" aria-label="Compare the optional accuracy display"></div></section>
<section hidden data-variant="Eliminated" aria-label="Elimination transition"><div class="game" data-view="eliminated" aria-label="Local elimination and next stage"></div></section>

<section hidden data-variant="Winner finishes" aria-label="Confirmed winner finishes the song"><div class="game" data-view="winner" aria-label="Victory with continuing notes"></div></section>
<section hidden data-variant="Large party" aria-label="Large party battle"><div class="game" data-view="large" aria-label="Battle HUD for 128 participants"></div></section>
</div>

else if(action==='players'&&v.watch)s.overlay='players';
else if(action==='page-next')s.page++;
else if(action==='page-prev')s.page=Math.max(0,s.page-1);
render(node);save(node);}
for(const node of nodes){const s=states[node.dataset.view];render(node);if(globalThis.ResizeObserver){new ResizeObserver(()=>drawEffects(node)).observe(node);} node.addEventListener('click',event=>{const el=event.target.closest('button');if(el?.dataset?.action&&!el.disabled)handle(node,el.dataset.action);});node.addEventListener('keydown',event=>{if(event.key==='Escape'&&s.overlay){s.overlay='';render(node);save(node);}});
if(globalThis.Tweak){const tweak=new Tweak({container:node,onChange:()=>{if(s.followedOut&&s.phase==='watching'){const old=view(node).shown;s.eliminatedIds=[...new Set([...s.eliminatedIds,old.id])];s.followedOut=false;const next=players(s).find(p=>p.life>0);if(next&&s.autoFollow){s.following=next.id;s.switchNotice=old.name+' eliminated · Watching '+next.name;}else{s.switchNotice=old.name+' eliminated · Choose a player';}}if(s.phase!=='watching')s.eliminatedIds=[];if(reducedEffects(s))node.classList.toggle('impact-playing',false);const before=replayEdges.get(node)||false;replayEdges.set(node,s.playSequence);if(s.playSequence&&!before)runAttack(node);else{if(!s.playSequence)stopAttack(node);render(node);}save(node);}});
tweak.addSelect(s,'phase',{label:'Player state',options:[{label:'Playing',value:'playing'},{label:'Eliminated',value:'eliminated'},{label:'Watching',value:'watching'},{label:'Confirmed winner',value:'winner'}]});
tweak.addSelect(s,'incoming',{label:'Attack state',options:[{label:'No attack',value:'clear'},{label:'Committed warning',value:'incoming'},{label:'Mines visible',value:'active'},{label:'Protected recovery',value:'recovery'}]});
tweak.addToggle(s,'showScore',{label:'Show accuracy / score'});
tweak.addToggle(s,'hand',{label:'Hand behind note band'});
tweak.addSlider(s,'power',{label:'Local power',min:0,max:100,step:1,unit:'%'});
tweak.addToggle(s,'weakened',{label:'Accuracy weakens 8 mines to 6'});
tweak.addToggle(s,'reverse',{label:'Your Reverse scroll'});
if(!['attack','incoming-bolt','charged'].includes(node.dataset.view)){
tweak.addToggle(s,'previews',{label:'Opponent preview feeds available'});
tweak.addToggle(s,'stream',{label:'Spectator field available'});
tweak.addSelect(s,'watchRole',{label:'Watching as',options:[{label:'Eliminated player',value:'eliminated'},{label:'Room observer',value:'observer'}]});
tweak.addToggle(s,'followedOut',{label:'Eliminate followed player'});
}else{
tweak.addToggle(s,'playSequence',{label:'Play automatic attack sequence'});
tweak.addToggle(s,'reducedEffects',{label:'Reduced motion'});
}
}
}
window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState;if(data?.privateContent?.version===4)for(const node of nodes){stopAttack(node);restore(states[node.dataset.view],data.privateContent.views?.[node.dataset.view]);replayEdges.set(node,false);render(node);}});
})();
</script>
