<style>
#ddi-battle-endings .game{--bg:#161318;--panel:#252129;--raised:#35303b;--ink:#f2eee9;--dim:#b3aab8;--line:#49414e;--pink:#ff6ea0;--mint:#9addbd;--coral:#ff8f86;--amber:#e9c58b;--blue:#8fbce8;color-scheme:dark;background:var(--bg);color:var(--ink);font:14px/1.4 'Iosevka Term',ui-monospace,SFMono-Regular,Consolas,monospace;padding:24px;min-height:980px;position:relative;display:flex;flex-direction:column;gap:24px;box-sizing:border-box;}
#ddi-battle-endings .game *{box-sizing:border-box;}
#ddi-battle-endings .game :is(h2,h3,p){margin:0;}
#ddi-battle-endings .game h2{font-size:20px;font-weight:500;}
#ddi-battle-endings .game h3{font-size:15px;font-weight:500;}
#ddi-battle-endings .game .small{font-size:12px;}
#ddi-battle-endings .game .muted{color:var(--dim);}
#ddi-battle-endings .game .accent{color:var(--pink);}
#ddi-battle-endings .game .eyebrow{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
#ddi-battle-endings .game svg{width:17px;height:17px;flex-shrink:0;}
#ddi-battle-endings .game button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid transparent;border-radius:5px;min-height:38px;padding:8px 12px;}
#ddi-battle-endings .game button:hover:not(:disabled){background:var(--raised);}
#ddi-battle-endings .game button:disabled{opacity:.45;}
#ddi-battle-endings .game button.quiet{background:transparent;}
#ddi-battle-endings .game button.primary{outline:2px solid var(--pink);outline-offset:3px;background:var(--raised);}
#ddi-battle-endings .game button[aria-pressed=true]{border-color:var(--pink);background:var(--raised);}
#ddi-battle-endings .game .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
#ddi-battle-endings .game .header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-right:90px;align-items:start;}
#ddi-battle-endings .game .header>div{display:grid;gap:3px;}
#ddi-battle-endings .game .song-header{text-align:right;}
#ddi-battle-endings .game .arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,288px) minmax(0,1fr);gap:28px;flex:1;align-items:start;}
#ddi-battle-endings .game .people{grid-column:1;grid-row:1;width:min(100%,190px);justify-self:end;padding-top:18px;}
#ddi-battle-endings .game .population{display:flex;align-items:baseline;gap:7px;margin-bottom:20px;}
#ddi-battle-endings .game .population strong{font-size:30px;font-weight:500;}
#ddi-battle-endings .game .roster{display:grid;gap:7px;}
#ddi-battle-endings .game .person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:8px 9px;text-align:left;min-width:0;}
#ddi-battle-endings .game button.person{width:100%;background:transparent;}
#ddi-battle-endings .game .person.self{background:var(--panel);border-radius:5px;}
#ddi-battle-endings .game .person.out{color:var(--dim);}
#ddi-battle-endings .game .person .name{overflow-wrap:anywhere;}
#ddi-battle-endings .game .person .name small{font-size:11px;color:var(--dim);margin-left:5px;}
#ddi-battle-endings .game .person .context{grid-column:1/-1;color:var(--dim);font-size:11px;}
#ddi-battle-endings .game .mini-life{height:3px;background:var(--raised);grid-column:1/-1;}
#ddi-battle-endings .game .mini-life span{display:block;height:100%;background:var(--mint);}
#ddi-battle-endings .game .person.out .mini-life span{width:0!important;}
#ddi-battle-endings .game .roster-foot{margin-top:18px;font-size:12px;color:var(--dim);}
#ddi-battle-endings .game .field-wrap{grid-column:2;grid-row:1;min-width:0;position:relative;}
#ddi-battle-endings .game .identity{height:34px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--dim);}
#ddi-battle-endings .game .identity.watching{color:var(--ink);background:var(--panel);border-radius:4px;}
#ddi-battle-endings .game .life{height:8px;border-radius:8px;background:var(--raised);display:flex;justify-content:center;overflow:hidden;margin-top:12px;}
#ddi-battle-endings .game .life span{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),#3d937b 35%,#3d937b 65%,var(--mint));}
#ddi-battle-endings .game .life.critical span{background:var(--coral);}
#ddi-battle-endings .game .score{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;font-variant-numeric:tabular-nums;}
#ddi-battle-endings .game .score strong{font-size:21px;font-weight:500;}
#ddi-battle-endings .game .field{height:510px;position:relative;margin-top:12px;background:linear-gradient(90deg,transparent 24.7%,#ffffff06 25%,transparent 25.3%,transparent 49.7%,#ffffff06 50%,transparent 50.3%,transparent 74.7%,#ffffff06 75%,transparent 75.3%);}
#ddi-battle-endings .game .note{position:absolute;left:calc(var(--lane)*25%);width:25%;display:flex;align-items:center;justify-content:center;height:44px;color:var(--pink);pointer-events:none;}
#ddi-battle-endings .game .note svg{width:42px;height:42px;stroke-width:2.3;}
#ddi-battle-endings .game .note.blue{color:var(--blue);}
#ddi-battle-endings .game .note.mine{color:var(--amber);}
#ddi-battle-endings .game .note.mine svg{width:30px;height:30px;}
#ddi-battle-endings .game .note.receptor{color:var(--dim);}
#ddi-battle-endings .game .judgment{position:absolute;top:215px;left:0;right:0;text-align:center;pointer-events:none;}
#ddi-battle-endings .game .judgment strong{font-size:25px;font-weight:800;letter-spacing:-1px;display:block;text-shadow:0 2px 8px var(--bg);}
#ddi-battle-endings .game .judgment .combo{font-size:44px;font-weight:500;line-height:1.2;text-shadow:1px 0 var(--pink),-1px 0 var(--pink),0 1px var(--pink),0 -1px var(--pink);}
#ddi-battle-endings .game .watermark{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:14px;letter-spacing:1px;color:#ffffff20;}
#ddi-battle-endings .game .weapons{grid-column:3;grid-row:1;min-width:0;position:relative;height:642px;width:min(100%,165px);}
#ddi-battle-endings .game .incoming{position:absolute;top:108px;left:0;right:0;display:grid;gap:9px;padding-left:12px;border-left:2px solid var(--amber);}
#ddi-battle-endings .game .incoming strong{font-size:32px;font-weight:500;line-height:1;}
#ddi-battle-endings .game .incoming .strength{display:flex;align-items:baseline;gap:8px;}
#ddi-battle-endings .game .incoming .weakened{color:var(--mint);font-size:12px;}
#ddi-battle-endings .game .incoming.calm{border-left-color:var(--line);color:var(--dim);}
#ddi-battle-endings .game .power{position:absolute;left:0;right:0;bottom:12px;display:grid;gap:8px;padding-left:12px;}
#ddi-battle-endings .game .power-label{display:flex;justify-content:space-between;gap:6px;font-size:12px;}
#ddi-battle-endings .game .power-track{height:6px;background:var(--raised);}
#ddi-battle-endings .game .power-track span{display:block;height:100%;background:var(--pink);}
#ddi-battle-endings .game .power-track.full span{background:var(--ink);}
#ddi-battle-endings .game .reverse .incoming{top:430px;}
#ddi-battle-endings .game .reverse .power{top:80px;bottom:auto;}
#ddi-battle-endings .game .footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;border-top:1px solid var(--line);padding-top:16px;min-height:60px;}
#ddi-battle-endings .game .frozen .field{opacity:.18;}
#ddi-battle-endings .game .outcome{position:absolute;left:-12px;right:-12px;top:230px;text-align:center;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 12px;display:grid;gap:16px;}
#ddi-battle-endings .game .outcome strong{font-size:42px;font-weight:500;}
#ddi-battle-endings .game .outcome .row{justify-content:center;}
#ddi-battle-endings .game .winner-mark{text-align:center;color:var(--mint);padding:10px 0;}
#ddi-battle-endings .game .unavailable{height:510px;display:grid;align-content:center;text-align:center;gap:12px;}
#ddi-battle-endings .game .overlay{position:absolute;inset:0;background:#09070be8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5;}
#ddi-battle-endings .game .dialog{width:min(100%,470px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:20px;}
#ddi-battle-endings .game .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
#ddi-battle-endings .game .facts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;}
#ddi-battle-endings .game .facts span:nth-child(odd){color:var(--dim);}
#ddi-battle-endings .game .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
@media(max-width:760px){#ddi-battle-endings .game{min-height:1600px;padding:20px;}#ddi-battle-endings .game .arena{grid-template-columns:1fr;gap:20px;}#ddi-battle-endings .game .field-wrap{grid-column:1;grid-row:2;width:min(100%,288px);justify-self:center;}#ddi-battle-endings .game .weapons{grid-column:1;grid-row:1;position:static;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(100%,480px);height:auto;min-height:150px;justify-self:center;}#ddi-battle-endings .game .incoming,#ddi-battle-endings .game .power,#ddi-battle-endings .game .reverse .incoming,#ddi-battle-endings .game .reverse .power{position:static;align-content:start;}#ddi-battle-endings .game .reverse .weapons{grid-row:3;}#ddi-battle-endings .game .people{grid-column:1;grid-row:4;width:100%;justify-self:stretch;padding-top:0;}#ddi-battle-endings .game .roster{grid-template-columns:repeat(2,minmax(0,1fr));}#ddi-battle-endings .game .population{margin-bottom:12px;}#ddi-battle-endings .game .header{padding-right:70px;}#ddi-battle-endings .game .song-header{text-align:left;}#ddi-battle-endings .game.has-overlay .arena,#ddi-battle-endings .game.has-overlay .footer{display:none;}#ddi-battle-endings .game .overlay{position:static;padding:0;background:var(--bg);}}
@media(max-width:420px){#ddi-battle-endings .game{padding:16px;min-height:1600px;}#ddi-battle-endings .game .header{grid-template-columns:1fr;padding-right:80px;}#ddi-battle-endings .game .dialog{padding:18px;}#ddi-battle-endings .game .outcome{left:0;right:0;}#ddi-battle-endings .game .incoming strong{font-size:28px;}}
@media(pointer:coarse){#ddi-battle-endings .game button{min-height:44px;}}
#ddi-battle-endings .game .roster-label{display:flex;justify-content:space-between;padding:0 9px 8px;font-size:11px;color:var(--dim);}

/* Gameplay study: normal field with small remote fields in its side space. */
#ddi-battle-endings .game{font-family:DDIStudy,ui-monospace,monospace;min-height:760px;padding:0;display:block;background:radial-gradient(ellipse at 50% 30%,#1c2029 0%,#101016 65%);--field-width:clamp(256px,28.125%,288px);}
#ddi-battle-endings .game .header{position:absolute;inset:18px 20px auto;display:grid;grid-template-columns:1fr var(--field-width) 1fr;padding-right:0;gap:10px;z-index:1;pointer-events:none;}
#ddi-battle-endings .game .header .song-header{text-align:right;padding-right:85px;}
#ddi-battle-endings .game .population-inline{display:block;margin-top:5px;color:var(--ink);}
#ddi-battle-endings .game .arena{position:relative;display:block;height:760px;}
#ddi-battle-endings .game .field-wrap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:var(--field-width);height:690px;padding:0 4px;background:#05091080;}
#ddi-battle-endings .game .identity{position:absolute;top:657px;left:0;right:0;height:27px;font-size:12px;background:transparent;}
#ddi-battle-endings .game .identity:not(.watching){display:none;}
#ddi-battle-endings .game .identity.watching{background:#161318de;}
#ddi-battle-endings .game .life{margin-top:22px;height:8px;}
#ddi-battle-endings .game .life span{background:linear-gradient(110deg,#35d289,#166644 35%,#207f5a 65%,#4cdb9b);}
#ddi-battle-endings .game .life.critical span{background:var(--coral);}
#ddi-battle-endings .game .score{justify-content:center;margin-top:10px;}
#ddi-battle-endings .game .score strong{font-family:DDIStudy;font-size:25px;font-weight:600;}
#ddi-battle-endings .game .score .small{display:none;}
#ddi-battle-endings .game .field{height:570px;margin-top:14px;background:none;}
#ddi-battle-endings .game .note{height:60px;transform:translateY(-50%);z-index:2;}
#ddi-battle-endings .game .skin-glyph{display:block;position:relative;width:150%;aspect-ratio:1;flex-shrink:0;transform:rotate(var(--turn));background:linear-gradient(130deg,#fd973c 10%,#f2489a 45%,#bc5cfa 70%,#40b9ff 90%);mask-image:var(--arrow-mask);mask-size:contain;mask-repeat:no-repeat;mask-position:center;}
#ddi-battle-endings .game .skin-vertical{mask-image:var(--vertical-mask);}
#ddi-battle-endings .game .blue .skin-glyph{background:linear-gradient(130deg,#458fff 5%,#59d3ef 40%,#50ebb2 70%,#c1fe84);}
#ddi-battle-endings .game .flat .skin-glyph{background:#93a6ff;}
#ddi-battle-endings .game .skin-receptor{background:#8c98a3!important;filter:drop-shadow(0 0 2px #000);}
#ddi-battle-endings .game .mine .skin-glyph{mask:none;background:none!important;}
#ddi-battle-endings .game .mine-art{width:100%;height:auto;display:block;}
#ddi-battle-endings .game .hold-body{position:absolute;width:7px;background:linear-gradient(90deg,#29769e80,#7da8e6,#29769e80);border-radius:5px;transform:translateX(-50%);z-index:1;}
#ddi-battle-endings .game .judgment{top:38%;z-index:3;}
#ddi-battle-endings .game .judgment strong{font-family:DDIJudgment,DDIStudy,monospace;font-size:30px;font-weight:800;color:#a6f2ff;}
#ddi-battle-endings .game .judgment .combo{display:block;margin-top:24px;font-family:DDIStudy;font-size:59px;font-weight:600;text-shadow:2px 0 #34205e,-2px 0 #34205e,0 2px #34205e,0 -2px #34205e,3px 0 #bca2ff,-3px 0 #bca2ff,0 3px #bca2ff,0 -3px #bca2ff;}
#ddi-battle-endings .game .weapons{position:static;width:auto;height:auto;}
#ddi-battle-endings .game .incoming{left:calc(50% + var(--field-width)/2 + 10px);right:auto;top:100px;width:78px;padding-left:8px;gap:7px;border-left-width:1px;}
#ddi-battle-endings .game .incoming .eyebrow{font-size:11px;letter-spacing:0;text-transform:none;}
#ddi-battle-endings .game .incoming strong{font-size:25px;}
#ddi-battle-endings .game .incoming .strength{gap:4px;flex-wrap:wrap;}
#ddi-battle-endings .game .incoming .small,#ddi-battle-endings .game .incoming .weakened{font-size:11px;}
#ddi-battle-endings .game .power{left:calc(50% - var(--field-width)/2 - 90px);right:auto;top:470px;bottom:auto;width:80px;padding-left:0;}
#ddi-battle-endings .game .power-label{font-size:11px;flex-wrap:wrap;}
#ddi-battle-endings .game .power .small{font-size:11px;}
#ddi-battle-endings .game .reverse .incoming{top:500px;}
#ddi-battle-endings .game .reverse .power{top:110px;bottom:auto;}
#ddi-battle-endings .game .opponent-wing{position:absolute;top:120px;width:calc(50% - var(--field-width)/2 - 118px);max-width:260px;}
#ddi-battle-endings .game .wing-left{left:16px;}
#ddi-battle-endings .game .wing-right{right:16px;}
#ddi-battle-endings .game .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;}
#ddi-battle-endings .game .miniature{display:block;min-width:0;padding:0;background:transparent;border:0;border-radius:0;text-align:left;color:var(--ink);}
#ddi-battle-endings .game button.miniature{padding:0;background:transparent;border:1px solid transparent;}
#ddi-battle-endings .game button.miniature[aria-pressed=true]{border-color:var(--pink);}
#ddi-battle-endings .game .mini-name{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font-size:12px;min-height:24px;overflow-wrap:anywhere;}
#ddi-battle-endings .game .mini-name small{font-size:11px;color:var(--dim);}
#ddi-battle-endings .game .mini-screen{position:relative;display:block;height:220px;background:#060b12a8;padding:8px 5px 0;overflow:hidden;}
#ddi-battle-endings .game .mini-life{display:flex;justify-content:center;height:3px;background:var(--raised);}
#ddi-battle-endings .game .mini-life span{display:block;height:100%;background:linear-gradient(90deg,#35d289,#166644,#35d289);}
#ddi-battle-endings .game .mini-score{display:block;font-size:11px;text-align:center;margin-top:5px;color:var(--dim);}
#ddi-battle-endings .game .mini-field{display:block;position:relative;height:177px;margin-top:3px;}
#ddi-battle-endings .game .mini-field .note{height:24px;}
#ddi-battle-endings .game .mini-field .hold-body{width:3px;}
#ddi-battle-endings .game .mini-field .judgment{top:38%;}
#ddi-battle-endings .game .mini-field .judgment strong{font-size:11px;letter-spacing:-.4px;}
#ddi-battle-endings .game .mini-field .judgment .combo{font-size:22px;margin-top:9px;text-shadow:1px 0 #8763c8,-1px 0 #8763c8,0 1px #8763c8,0 -1px #8763c8;}
#ddi-battle-endings .game .mini-message{display:grid;place-items:center;height:90%;font-size:12px;color:var(--dim);}
#ddi-battle-endings .game .miniature.out .mini-name{color:var(--dim);}
#ddi-battle-endings .game .miniature.out .mini-screen{background:#060b1240;}
#ddi-battle-endings .game .dense .mini-screen{height:160px;}
#ddi-battle-endings .game .dense .mini-field{height:118px;}
#ddi-battle-endings .game .dense .mini-grid{gap:12px;}
#ddi-battle-endings .game .dense .mini-field .judgment .combo{margin-top:4px;font-size:18px;}
#ddi-battle-endings .game .mini-summary{display:block;margin-top:12px;color:var(--dim);font-size:11px;}
#ddi-battle-endings .game .footer{position:absolute;bottom:12px;left:20px;right:20px;border:0;margin:0;padding:0;min-height:40px;}
#ddi-battle-endings .game .watermark{display:none;}
#ddi-battle-endings .game .winner-mark{position:absolute;bottom:12px;left:0;right:0;}
#ddi-battle-endings .game .outcome{top:235px;}
#ddi-battle-endings .game .unavailable{height:625px;}
@media(max-width:850px){#ddi-battle-endings .game{min-height:1510px;padding:16px;}#ddi-battle-endings .game .header{position:static;display:flex;justify-content:space-between;margin-bottom:24px;min-height:55px;padding-right:80px;}#ddi-battle-endings .game .header .song-header{padding:0;}#ddi-battle-endings .game .arena{height:auto;display:grid;grid-template-columns:1fr;gap:24px;}#ddi-battle-endings .game .field-wrap{position:relative;top:auto;left:auto;transform:none;width:min(288px,100%);grid-column:1;grid-row:2;justify-self:center;}#ddi-battle-endings .game .weapons{position:static;width:100%;grid-column:1;grid-row:1;display:flex;justify-content:center;gap:32px;min-height:125px;}#ddi-battle-endings .game .incoming,#ddi-battle-endings .game .power,#ddi-battle-endings .game .reverse .incoming,#ddi-battle-endings .game .reverse .power{position:static;width:120px;min-height:110px;}#ddi-battle-endings .game .opponent-wing{position:static;max-width:none;width:100%;grid-column:1;}#ddi-battle-endings .game .wing-left{grid-row:3;}#ddi-battle-endings .game .wing-right{grid-row:4;}#ddi-battle-endings .game .mini-grid{grid-template-columns:repeat(4,minmax(0,1fr));}#ddi-battle-endings .game .dense .mini-grid{grid-template-columns:repeat(3,minmax(0,1fr));}#ddi-battle-endings .game .footer{position:static;margin-top:20px;}#ddi-battle-endings .game.has-overlay .arena,#ddi-battle-endings .game.has-overlay .footer{display:none;}}
@media(max-width:480px){#ddi-battle-endings .game{min-height:2160px;}#ddi-battle-endings .game .mini-grid,#ddi-battle-endings .game .dense .mini-grid{grid-template-columns:repeat(2,minmax(0,1fr));}#ddi-battle-endings .game .dense .mini-screen{height:155px;}#ddi-battle-endings .game .header{align-items:start;flex-wrap:wrap;gap:8px;}#ddi-battle-endings .game .mini-grid{gap:14px;}}

#ddi-battle-endings .game .header{display:block;}
#ddi-battle-endings .game .remaining{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;}
#ddi-battle-endings .game .battle-power{position:absolute;left:4px;right:4px;top:12px;height:3px;background:#24212b;z-index:4;}
#ddi-battle-endings .game .battle-power>span,#ddi-battle-endings .game .mini-power>span{height:100%;display:block;background:#d098eb;}
#ddi-battle-endings .game .battle-power.full>span,#ddi-battle-endings .game .mini-power.full>span{background:#ece0f7;}
#ddi-battle-endings .game .mini-power{position:absolute;top:3px;left:5px;right:5px;height:2px;background:#24212b;}
#ddi-battle-endings .game .mini-power.inactive{opacity:.35;}
#ddi-battle-endings .game .score{height:35px;min-height:35px;}

<script>
(()=>{
const root=document.getElementById('ddi-battle-endings');
const nodes=[...root.querySelectorAll('[data-view]')], states={}, timers=new Map();
const people=[{id:'mira',name:'Mira'},{id:'sol',name:'Sol'},{id:'kai',name:'Kai'},{id:'quartz',name:'Quartz',cpu:true},{id:'arc',name:'Arc',cpu:true},{id:'orbit',name:'Orbit',cpu:true},{id:'lumen',name:'Lumen',cpu:true},{id:'echo',name:'Echo',cpu:true}];
const songs=[{title:'Paper Satellites',artist:'Soft Signal',meter:9,a:'#5a667e',b:'#b27891'}, {title:'Signal Bloom',artist:'Glass Current',meter:10,a:'#356756',b:'#8871a0'}, {title:'Night Current',artist:'Parallel Lines',meter:11,a:'#344c79',b:'#a65b7c'}, {title:'Violet Line',artist:'Low Orbit',meter:10,a:'#785986',b:'#47848a'}];
const previous=[[12,9,12],[9,12,7],[7,7,9],[5,4,5],[4,5,3],[3,2,4],[2,3,1],[1,1,2]];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(text,action,cls='',disabled=false,label='')=>`<button type="button" class="cursor-interaction ${cls}" data-action="${action}" ${disabled?'disabled':''} ${label?`aria-label="${label}"`:''}>${text}</button>`;
const ordinal=n=>n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';
const local=s=>s.role==='Host'?'mira':s.role==='Waiting player'?'nia':'kai';
function defaults(key){return {route:key==='pending'||key==='winner'?'play':key==='stage'?'stage':key==='room'?'room':'match',settlement:key==='pending'?'Pending':key==='draw'?'Draw':'Victory',songEnded:!['pending','winner'].includes(key),stage:key==='stage'?'3':'4',evalStage:key==='stage'?3:4,soloMistakes:false,startedIds:[],role:key==='room'?'Host':'Participant',matchTie:false,seatAvailable:true,ready:false,othersReady:true,selected:0,overlay:'',detailId:'kai',detailStage:4,startPhase:'idle',seconds:0,newMatch:false,notice:''};}
function scores(s){const last=s.matchTie?[4,9,12,7,5,3,2,1]:s.settlement==='Draw'?[7,10.5,10.5,4,5,1,2,3]:[7,9,12,4,5,1,2,3];const list=people.map((p,i)=>({...p,points:[...previous[i],last[i]]}));for(const p of list)p.total=p.points.slice(0,Number(s.stage)).reduce((a,b)=>a+b,0);list.sort((a,b)=>b.total-a.total);for(const p of list)p.rank=1+list.filter(x=>x.total>p.total).length;return list;}
function stageRank(s,id,stage=Number(s.stage)){const list=scores({...s,stage:'4'}),p=list.find(x=>x.id===id);return p?1+list.filter(x=>x.points[stage-1]>p.points[stage-1]).length:0;}
function restore(s,old){if(!old||typeof old!=='object')return;for(const k of ['songEnded','matchTie','seatAvailable','ready','othersReady','soloMistakes'])if(typeof old[k]==='boolean')s[k]=old[k];for(const [k,values] of Object.entries({route:['play','stage','match','room'],settlement:['Pending','Victory','Draw'],stage:['3','4'],role:['Host','Participant','Waiting player']}))if(values.includes(old[k]))s[k]=old[k];if(Number.isInteger(old.selected)&&old.selected>=0&&old.selected<4)s.selected=old.selected;s.startPhase='idle';s.seconds=0;s.overlay='';s.newMatch=false;if(old.newMatch)s.route='room';if(Number.isInteger(old.evalStage)&&old.evalStage>=1&&old.evalStage<=4)s.evalStage=old.evalStage;}
function save(node){const s=states[node.dataset.view];window.openai?.setWidgetState?.({modelContent:{view:node.dataset.view,screen:s.route,settlement:s.settlement,role:s.role,sharedMatchLead:s.matchTie,readyForNext:s.ready},privateContent:{version:1,views:states}})?.catch(()=>{});}
for(const node of nodes){states[node.dataset.view]=defaults(node.dataset.view);if(window.openai?.widgetState?.privateContent?.version===1)restore(states[node.dataset.view],window.openai.widgetState.privateContent.views?.[node.dataset.view]);}
function context(node){const s=states[node.dataset.view],id=local(s),all=scores(s);return {s,id,all,me:all.find(p=>p.id===id),host:s.role==='Host',waiting:id==='nia',admitted:id!=='nia'||s.stage==='4'&&s.seatAvailable};}

function appearance(p,v){const i=Math.max(0,v.list.findIndex(x=>x.id===p.id));return {reverse:p.id==='kai'?v.s.reverse:p.id==='sol'||p.id==='arc',speed:p.id==='mira'?.82:p.id==='sol'?1.28:1,flat:p.id==='arc',combo:p.id==='kai'?168:p.id==='mira'?212:p.id==='sol'?136:82+i*7,judgment:p.id==='sol'?'Perfect':p.id==='quartz'?'Great':'Marvelous',accuracy:p.id==='kai'?'98.42':p.id==='mira'?'99.14':p.id==='sol'?'97.80':'96.31'};}
function glyph(lane,receptor=false,mine=false){return `<span class="skin-glyph ${receptor?'skin-receptor':''} ${lane===1||lane===2?'skin-vertical':'skin-arrow'}" style="--turn:${[270,180,0,90][lane]}deg">${mine?'<img class="mine-art" src="'+skinAssets.mine+'" alt="">':''}</span>`;}
function drawNotes(v,p,mini=false){const a=appearance(p,v),at=(beats)=>a.reverse?89-beats*16*a.speed:5+beats*16*a.speed;let html='';for(let lane=0;lane<4;lane++)html+=`<span class="note receptor" style="--lane:${lane};top:${at(0)}%">${glyph(lane,true)}</span>`;
const chart=[[0,.55],[2,1.1],[1,1.65],[3,2.4],[0,3.05],[2,3.6],[1,4.15],[3,4.8]];
for(const [index,[lane,beats]] of chart.entries()){const y=at(beats);if(y<0||y>94)continue;html+=`<span class="note ${index%2?'blue':''} ${a.flat?'flat':''}" style="--lane:${lane};top:${y}%">${glyph(lane)}</span>`;}
const holdA=at(2.4),holdB=at(3.8);if(Math.min(holdA,holdB)>=0&&Math.max(holdA,holdB)<=94)html+=`<span class="hold-body" style="left:87.5%;top:${Math.min(holdA,holdB)+2}%;height:${Math.abs(holdA-holdB)}%"></span>`;
const hasMines=p.life>0&&!v.s.fresh&&!v.win&&(p.id==='kai'?v.s.incoming==='active':p.id==='mira');
if(hasMines)for(const [lane,beats] of [[2,2.1],[0,2.65],[1,3.5]]){const y=at(beats);if(y>=0&&y<=94)html+=`<span class="note mine" style="--lane:${lane};top:${y}%">${glyph(lane,false,true)}</span>`;}
if(p.life>0&&!v.s.fresh)html+=`<span class="judgment"><strong>${a.judgment}</strong><span class="combo">${a.combo}</span></span>`;
return html;
}
function miniature(v,p){const a=appearance(p,v),live=p.life>0,available=v.s.previews&&live,selected=v.watch&&p.id===v.shown.id,tag=v.watch&&live?'button':'div',attributes=tag==='button'?`type="button" data-action="follow-${p.id}" aria-pressed="${selected}"`:'';
return `<${tag} ${attributes} data-player="${p.id}" class="miniature ${attackScene(v)?.target===p.id&&attackScene(v).committed?'attack-recipient':''} ${attackScene(v)?.target===p.id&&v.s.attackPhase==='received'?'attack-received':''} ${tag==='button'?'cursor-interaction':''} ${live?'':'out'}" aria-label="${p.name}${p.cpu?', CPU':''}, ${live?(available?'gameplay preview, '+(a.reverse?'Reverse':'upscroll')+', life '+p.life:'preview unavailable'):'eliminated'}"><span class="mini-name">${p.name}<small>${p.cpu?'CPU':p.id==='kai'&&v.s.watchRole!=='observer'?'You':''}</small></span><span class="mini-screen ${a.reverse?'reverse':''}">${powerBar(p,true,!live||v.win)}<span class="mini-life" role="meter" aria-label="${p.name} life" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.life}"><span style="width:${p.life*(.2+.8*p.life/100)}%"></span></span>${available?`<span class="mini-score ${v.s.showScore?'':'score-hidden'}" aria-hidden="${!v.s.showScore}">${v.s.showScore?a.accuracy+'%':''}</span><span class="mini-field" aria-hidden="true">${drawNotes(v,p,true)}</span>`:`<span class="mini-message">${live?'No feed':'Out'}</span>`}</span></${tag}>`;
}
function powerBar(p,mini=false,inactive=false){const amount=inactive?0:p.power;return `<span class="${mini?'mini-power':'battle-power'} ${amount>=100?'full':''} ${inactive?'inactive':''}" role="progressbar" data-power-owner="${p.id}" aria-label="${p.name} attack power" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${amount}" data-tooltip="${inactive?'Attack power inactive':p.name+' · power '+Math.round(amount)+'%'}"><span style="width:${amount}%"></span></span>`;}
function attackScene(){return null;}
function play(node){const v=context(node),s=v.s,pending=s.settlement==='Pending',draw=s.settlement==='Draw',fresh=s.newMatch;const list=(fresh?roomPeople(v):people).map(p=>({...p,life:fresh?(s.startedIds.includes(p.id)?100:0):p.id==='kai'?(draw||s.soloMistakes&&!pending?0:18):0,power:fresh?0:p.id==='kai'?78:0}));const shownId=fresh?(list.find(p=>p.id===v.id&&p.life>0)?.id||list.find(p=>p.life>0)?.id||'kai'):'kai';const pv={s:{fresh,reverse:false,incoming:pending&&!fresh?'active':'clear',previews:true,showScore:false,watchRole:'eliminated'},list,win:!pending&&!fresh,watch:false,shown:list.find(p=>p.id===shownId)};
const minis=(xs)=>xs.map(p=>`<div>${fresh&&!p.life?miniature(pv,p).replace('eliminated','sitting out stage 1').replace('>Out<','>Sitting out<'):miniature(pv,p)}${pending&&!fresh&&p.id==='sol'?`<span class="pending-note">${icon('zap')} Pending</span>`:''}</div>`).join('');
return `<header class="header"><span class="remaining">${icon('users')}${fresh?s.startedIds.length:draw?'0':'1'} / 8</span></header><main class="arena"><aside class="opponent-wing wing-left"><div class="mini-grid">${minis(list.filter(p=>p.id!==shownId).slice(0,4))}</div></aside><section class="field-wrap ${draw?'frozen':''}" aria-label="${v.id===shownId?'Your field':'Watching '+pv.shown.name}">${v.id!==shownId?`<div class="identity watching">${icon('eye')} Watching ${pv.shown.name}</div>`:''}${pending||fresh?powerBar(pv.shown):''}<div class="life ${pending&&!fresh?'critical':''}" role="meter" aria-label="Kai life" aria-valuenow="${pv.shown.life}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pv.shown.life*(.2+.8*pv.shown.life/100)}%"></span></div><div class="score score-hidden"></div><div class="field" role="img" aria-label="Illustrative four lane field${pending?' with unresolved attack mines':''}">${drawNotes(pv,pv.shown)}</div>${draw?`<div class="game-outcome"><span>Stage drawn</span><strong>Kai · Sol</strong><span class="muted">1st · +10.5 each</span>${button('Results','evaluation','primary')}</div>`:''}</section><aside class="opponent-wing wing-right"><div class="mini-grid">${minis(list.filter(p=>p.id!==shownId).slice(4))}</div></aside>${pending&&!fresh?`<div class="incoming-cue active" aria-label="Committed attack still active; victory not confirmed" data-tooltip="Sol's committed attack remains active"><img class="shock-symbol" src="${skinAssets.mine}" alt=""><span class="mine-pips">${'<span></span>'.repeat(3)}</span></div>`:''}</main><div class="status-line" role="status">${fresh?'Stage 1 · Paper Satellites':pending?icon('hourglass')+' Resolving attack':draw?'Final contenders tied':icon('trophy')+' Kai · 1st · +12 <span class="muted">Finishing song</span>'}</div>`;
}
function head(title,sub='',right=''){return `<header class="end-head"><div class="end-title">${sub?`<span class="small muted">${sub}</span>`:''}<h2>${title}</h2></div>${right}</header>`;}
function readyFooter(v,room=false){const s=v.s,eligible=v.admitted,phase=s.startPhase;return `<footer class="end-foot"><div><div>${phase==='deadline'?`Starting in ${s.seconds}s`:phase==='countdown'?`Stage 1 · ${s.seconds}`:room?'Next match · 4 stages':'Next match'}</div><span class="muted">${!eligible?'Waiting for a seat':phase==='idle'?'Waiting for host':phase==='deadline'?'Unready players sit out stage 1':'Players locked'}</span></div><div class="row">${room?button('Last match','last','quiet'):button('Room','room','quiet')}${eligible?button(s.ready?icon('check')+' Ready':'Ready','ready',s.ready?'':'primary',phase==='countdown'):''}${v.host&&room?button(phase==='idle'?'Start match':'Cancel start',phase==='idle'?'start':'cancel','',phase==='idle'&&!v.s.othersReady&&!v.s.ready):''}</div></footer>`;}
function table(v){return `<div class="results-wrap"><table class="results-table" aria-label="Match ranks and points earned in each stage"><thead><tr><th scope="col">#</th><th scope="col">Player</th>${songs.map((song,i)=>`<th scope="col"><span data-tooltip="${song.title}">S${i+1}</span></th>`).join('')}<th scope="col">Total</th></tr></thead><tbody>${v.all.map(p=>`<tr class="${p.id===v.id?'local-row':''} ${p.rank===1?'row-winner':''}"><td>${p.rank}</td><th scope="row"><span class="who">${button(p.name,'detail-'+p.id,'quiet')}<small>${p.cpu?'CPU':p.id===v.id?'You':''}</small></span></th>${p.points.map((point,i)=>`<td>${button(point,'point-'+p.id+'-'+(i+1),'',false,`${p.name}, stage ${i+1}, ${point} points`)}</td>`).join('')}<td class="total">${p.total}</td></tr>`).join('')}</tbody></table></div>`;}
function match(node){const v=context(node),winners=v.all.filter(p=>p.rank===1);return `<div class="end-shell">${head('Match results','After Hours · 4 stages')}<section class="result-hero"><div><div class="winner-title">${icon('trophy')}<span>${winners.length>1?'Joint winners':'Match winner'}</span></div><div class="winner-name">${winners.map(p=>p.name).join(' · ')}</div></div><div class="personal-outcome">${v.me?`<strong>${ordinal(v.me.rank)}</strong><span>${v.me.total} pts <span class="muted">· You</span></span>`:`<span class="muted">Watched this match</span>`}</div></section>${table(v)}<div class="row end-notice">${sFinalCaption(v.s)}</div>${readyFooter(v)}</div>`;}
function sFinalCaption(s){return s.settlement==='Draw'?'Final stage · Kai & Sol tied 1st · 10.5 pts each':s.matchTie?'Equal match totals share the rank':'Final stage · Kai won · +12 pts';}
function lifePlot(full){return `<svg class="plot" viewBox="0 0 420 135" role="img" aria-label="${full?'Battle life ends at 18 at victory; remaining song is a solo finish':'Life reaches zero at elimination; shaded remainder is unplayed'}"><rect x="300" y="5" width="120" height="110" fill="var(--panel)"/><line x1="0" x2="420" y1="115" y2="115" stroke="var(--line)"/><polyline points="0,15 35,15 65,28 110,25 140,45 175,44 210,65 240,73 275,90 300,${full?96:115}" fill="none" stroke="var(--mint)" stroke-width="2"/><line x1="300" x2="300" y1="5" y2="115" stroke="var(--pink)" stroke-width="1"/></svg>`;}
function evaluation(node){const v=context(node),s=v.s,n=s.evalStage,final=s.stage==='4',id=v.me?v.id:'kai',person=v.all.find(p=>p.id===id),rank=stageRank(s,id,n),points=person.points[n-1],full=n===4&&id==='kai'&&s.settlement==='Victory';const counts=full?[670,132,24,8,6]:[480,92,18,6,4];return `<div class="end-shell">${head('Stage result',`After Hours · Stage ${n} / 4`,button(final?'Match results':'Room',final?'match':'room','quiet'))}<section class="result-hero"><div class="end-title"><h3>${songs[n-1].title}</h3><span class="muted small">Single · Hard ${songs[n-1].meter} · DDR A</span></div><div class="personal-outcome"><strong>${ordinal(rank)}</strong><span class="gain">+${points}</span><span class="muted">${person.total} match pts</span></div></section><main class="evaluation-grid"><section class="evaluation-column"><div class="stage-heading"><strong>${person.name}</strong><span class="small muted">${full?'Song completed · Stage won':n===4&&s.settlement==='Draw'&&['kai','sol'].includes(id)?'Final knockout · Shared 1st':'Eliminated · 1:42 / 2:31'}</span></div><div class="judge-list">${['Marvelous','Perfect','Great','Good','Miss'].map((label,i)=>`<div class="judge-row"><span>${label}</span><span class="judge-track"><span style="width:${counts[i]/counts[0]*100}%"></span></span><span>${counts[i]}</span></div>`).join('')}</div><span class="small muted">${full?'840 / 840':'600 / 840'} notes judged${full?'':' · Unplayed notes excluded'}</span><div class="facts"><span>Max combo</span><span>168</span><span>Mean offset</span><span>+4 ms</span><span>Deviation</span><span>18 ms</span></div></section><section class="evaluation-column"><div class="chart-section"><h3>Battle life</h3>${lifePlot(full)}<div class="plot-labels"><span>0:00</span><span>${full?'1:48 · Victory':'1:42 · Eliminated'}</span><span>2:31</span></div><span class="small muted">${full?'Shaded: solo finish · Battle points locked':'Shaded: unplayed'}</span></div><div class="chart-section"><h3>Battle</h3><div class="facts"><span>Attacks sent / received</span><span>4 / 5</span><span>Mines weakened</span><span>12</span><span>Attack mines hit / avoided</span><span>3 / 25</span><span>Authored mines hit</span><span>0</span></div></div></section></main>${final?`<footer class="end-foot"><span class="muted">Stage points confirmed</span>${button('Match results','match','primary')}</footer>`:`<footer class="end-foot"><div>Next · Violet Line<span class="muted"> · Stage 4 / 4</span></div><div class="row">${button('Room','room','quiet')}${v.admitted?button(s.ready?icon('check')+' Ready':'Ready','ready',s.ready?'':'primary'):'<span class="small muted">Waiting for next match</span>'}</div></footer>`}</div>`;}
function room(node){const v=context(node),s=v.s,nextStage=s.stage==='3',song=songs[s.selected],roster=nextStage?people:roomPeople(v);return `<div class="end-shell">${head('After Hours',nextStage?'Intermission · Stage 4 / 4':'Room · Next match',`<div class="row">${button(icon('sliders-horizontal'),'rules','quiet',false,'Rules')}${button(icon('ellipsis'),'more','quiet',false,'More')}</div>`)}<main class="room-grid"><section class="room-people" aria-label="Participants"><div class="small muted">${roster.length} / 8</div>${roster.map(p=>`<div class="person-line"><span class="who">${p.name}<small>${p.id==='mira'?'Host':p.cpu?'CPU':p.id==='nia'?'Joined':''}${p.id===v.id?' · You':''}</small></span><span class="ready-mark" aria-label="${isReady(v,p)?'Ready':'Not ready'}">${isReady(v,p)?icon('check'):icon('minus')}</span></div>`).join('')}${nextStage||!s.seatAvailable?'<div class="wait-heading">Next match</div><div class="person-line"><span>Nia</span><span class="small muted">Waiting</span></div>':''}</section><section class="room-song"><div class="art" style="--a:${song.a};--b:${song.b}" aria-hidden="true"><span class="art-word">${song.title.toUpperCase()}</span></div><h3 class="song-title">${song.title}</h3><span class="small muted">${song.artist}</span><span class="small muted">142 BPM · 2:31</span><div class="chart-steps"><span>Easy 4</span><span>Medium 7</span><strong>Hard ${song.meter}</strong></div><span class="small muted">${icon('check')} Songs available</span></section><section class="song-wheel" aria-label="Match songs">${songs.map((x,i)=>`<button type="button" class="cursor-interaction song-row ${s.selected===i?'selected':''}" aria-pressed="${s.selected===i}" data-action="song-${i}" style="--drift:${Math.min(18,Math.abs(i-s.selected)*8)}px;--a:${x.a};--b:${x.b}"><span class="thumb">${i+1}</span><span><span class="title">${x.title}</span><small>${nextStage&&i<3?'Completed':x.artist}</small></span><span class="meter">${x.meter}</span></button>`).join('')}</section></main><div class="end-notice" role="status">${s.notice||(!nextStage&&v.waiting&&v.admitted?'You joined the next match':!nextStage?'':'Everyone returns for stage 4')}</div>${nextStage?`<footer class="end-foot"><div>Violet Line · Stage 4 / 4</div><div class="row">${button('Stage result','evaluation','quiet')}${v.admitted?button(s.ready?icon('check')+' Ready':'Ready','ready',s.ready?'':'primary'):'<span class="small muted">Waiting for next match</span>'}</div></footer>`:readyFooter(v,true)}</div>`;}
function modal(node){const v=context(node),s=v.s;if(!s.overlay)return '';let title='',body='';if(s.overlay==='detail'){const p=v.all.find(p=>p.id===s.detailId)||v.all[0];title=p.name;body=`<div class="personal-outcome"><strong>${ordinal(p.rank)}</strong><span>${p.total} pts</span></div><div class="facts">${songs.map((song,i)=>`<span>${song.title}</span><span>${ordinal(stageRank(s,p.id,i+1))} · +${p.points[i]}</span>`).join('')}</div>`;}else if(s.overlay==='point'){const p=v.all.find(p=>p.id===s.detailId)||v.all[0],n=s.detailStage;title=songs[n-1].title;body=`<span>${p.name} · Stage ${n}</span><div class="personal-outcome"><strong>${ordinal(stageRank(s,p.id,n))}</strong><span class="gain">+${p.points[n-1]}</span></div>${n===4&&s.settlement==='Draw'&&['kai','sol'].includes(p.id)?'<p class="small muted">Shared first · (12 + 9) / 2 = 10.5</p>':''}${p.id===v.id?button('Performance','performance','primary'):''}`;}else if(s.overlay==='rules'){title='Rules';body='<div class="facts"><span>Battle</span><span>Mines · Weakening</span><span>Stages</span><span>4</span><span>Stage points</span><span>12, 9, 7, 5, 4, 3, 2, 1</span><span>Tied places</span><span>Average occupied awards</span><span>Return each stage</span><span>On</span><span>Mid-match joining</span><span>Off</span><span>Next match</span><span>Host starts</span></div>';}else if(s.overlay==='more'){title='Room';body=`<div class="row">${button('Last match','last')}${button('Sit out','sitout')}</div>`;}else{title='Song library';body='<span class="muted">Song selection is covered in the room study.</span>';}
return `<div class="overlay"><section class="dialog detail-dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog-head"><h2>${title}</h2>${button(icon('x'),'close','quiet',false,'Close')}</div>${body}</section></div>`;}
function render(node){const s=states[node.dataset.view];let route=s.route;if(route==='play'&&s.songEnded&&s.settlement!=='Pending'&&!s.newMatch)route='stage';node.innerHTML=(route==='play'?play(node):route==='stage'?evaluation(node):route==='match'?match(node):room(node))+modal(node);node.classList.toggle('has-overlay',!!s.overlay);for(const child of [...node.children])if(!child.classList.contains('overlay'))child.inert=!!s.overlay;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function stop(node){clearInterval(timers.get(node.dataset.view));timers.delete(node.dataset.view);}
function tick(node){const v=context(node),s=v.s;if(s.startPhase==='deadline'&&roomPeople(v).every(p=>isReady(v,p))){s.startPhase='countdown';s.seconds=3;s.startedIds=roomPeople(v).filter(p=>isReady(v,p)).map(p=>p.id);}else if(--s.seconds<=0){if(s.startPhase==='deadline'&&!roomPeople(v).some(p=>!p.cpu&&isReady(v,p))){stop(node);s.startPhase='idle';s.seconds=0;s.notice='Waiting for a ready player';render(node);return;}if(s.startPhase==='deadline'){s.startPhase='countdown';s.seconds=3;s.startedIds=roomPeople(v).filter(p=>isReady(v,p)).map(p=>p.id);}else{stop(node);s.startPhase='idle';s.route='play';s.newMatch=true;s.settlement='Pending';s.songEnded=false;s.ready=false;s.notice='';}}render(node);}
function act(node,a){const s=states[node.dataset.view],v=context(node);if(a==='ready'&&v.admitted&&s.startPhase!=='countdown')s.ready=!s.ready;else if(a==='room'){s.route='room';s.overlay='';if(s.stage==='3')s.selected=3;}else if(a==='match'||a==='last'){s.stage='4';s.route='match';s.overlay='';}else if(a==='evaluation')s.route='stage';else if(a==='start'&&v.host){s.startPhase=roomPeople(v).every(p=>isReady(v,p))?'countdown':'deadline';s.seconds=s.startPhase==='countdown'?3:15;s.startedIds=s.startPhase==='countdown'?roomPeople(v).filter(p=>isReady(v,p)).map(p=>p.id):[];stop(node);timers.set(node.dataset.view,setInterval(()=>tick(node),1000));}else if(a==='cancel'&&v.host){stop(node);s.startPhase='idle';s.seconds=0;}else if(a==='sitout'){s.ready=false;s.overlay='';s.notice='Sitting out the next stage';}else if(a==='close')s.overlay='';else if(a==='performance'){s.evalStage=s.detailStage;s.route='stage';s.overlay='';}else if(a.startsWith('detail-')){s.detailId=a.slice(7);s.overlay='detail';}else if(a.startsWith('point-')){const parts=a.split('-');s.detailId=parts[1];s.detailStage=Number(parts[2]);s.overlay='point';}else if(a.startsWith('song-'))s.selected=Number(a.slice(5));else if(['rules','more','library'].includes(a))s.overlay=a;render(node);save(node);if(s.overlay){if(a!=='close')node.returnAction=a;node.querySelector('[data-action="close"]')?.focus();}else if(a==='close'&&node.returnAction)node.querySelector('[data-action="'+node.returnAction+'"]')?.focus();}
for(const node of nodes){render(node);node.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target&&!target.disabled)act(node,target.dataset.action);});node.addEventListener('keydown',event=>{if(event.key==='Tab'&&states[node.dataset.view].overlay){const targets=[...node.querySelectorAll('.dialog button:not(:disabled)')];const first=targets[0],last=targets.at(-1);if(event.shiftKey&&document.activeElement===first){last?.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first?.focus();event.preventDefault();}}if(event.key==='Escape'&&states[node.dataset.view].overlay){act(node,'close');event.preventDefault();}});if(globalThis.Tweak){const s=states[node.dataset.view],t=new Tweak({container:node,onChange:()=>{stop(node);s.startPhase='idle';s.newMatch=false;if(s.settlement==='Draw')s.matchTie=false;render(node);save(node);}});t.addSelect(s,'role',{label:'View as',options:['Participant','Host','Waiting player']});if(['pending','winner'].includes(node.dataset.view)){t.addSelect(s,'settlement',{label:'Final attack outcome',options:['Pending','Victory','Draw']});t.addToggle(s,'songEnded',{label:'Song has ended'});t.addToggle(s,'soloMistakes',{label:'Life depleted after confirmed victory'});}else if(node.dataset.view!=='stage'){t.addToggle(s,'matchTie',{label:'Equal match totals'});t.addToggle(s,'seatAvailable',{label:'CPU seat available for Nia'});t.addToggle(s,'othersReady',{label:'Other humans ready'});}}}
window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved?.version!==1)return;for(const node of nodes){stop(node);restore(states[node.dataset.view],saved.views?.[node.dataset.view]);render(node);}});
})();
</script>
