<style>
#ddi-battle-entry .game{--bg:#161318;--panel:#252129;--raised:#35303b;--ink:#f2eee9;--dim:#b3aab8;--line:#49414e;--pink:#ff6ea0;--mint:#9addbd;--coral:#ff8f86;--amber:#e9c58b;--blue:#8fbce8;color-scheme:dark;background:var(--bg);color:var(--ink);font:14px/1.4 'Iosevka Term',ui-monospace,SFMono-Regular,Consolas,monospace;padding:24px;min-height:980px;position:relative;display:flex;flex-direction:column;gap:24px;box-sizing:border-box;}
#ddi-battle-entry .game *{box-sizing:border-box;}
#ddi-battle-entry .game :is(h2,h3,p){margin:0;}
#ddi-battle-entry .game h2{font-size:20px;font-weight:500;}
#ddi-battle-entry .game h3{font-size:15px;font-weight:500;}
#ddi-battle-entry .game .small{font-size:12px;}
#ddi-battle-entry .game .muted{color:var(--dim);}
#ddi-battle-entry .game .accent{color:var(--pink);}
#ddi-battle-entry .game .eyebrow{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
#ddi-battle-entry .game svg{width:17px;height:17px;flex-shrink:0;}
#ddi-battle-entry .game button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid transparent;border-radius:5px;min-height:38px;padding:8px 12px;}
#ddi-battle-entry .game button:hover:not(:disabled){background:var(--raised);}
#ddi-battle-entry .game button:disabled{opacity:.45;}
#ddi-battle-entry .game button.quiet{background:transparent;}
#ddi-battle-entry .game button.primary{outline:2px solid var(--pink);outline-offset:3px;background:var(--raised);}
#ddi-battle-entry .game button[aria-pressed=true]{border-color:var(--pink);background:var(--raised);}
#ddi-battle-entry .game .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
#ddi-battle-entry .game .header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-right:90px;align-items:start;}
#ddi-battle-entry .game .header>div{display:grid;gap:3px;}
#ddi-battle-entry .game .song-header{text-align:right;}
#ddi-battle-entry .game .arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,288px) minmax(0,1fr);gap:28px;flex:1;align-items:start;}
#ddi-battle-entry .game .people{grid-column:1;grid-row:1;width:min(100%,190px);justify-self:end;padding-top:18px;}
#ddi-battle-entry .game .population{display:flex;align-items:baseline;gap:7px;margin-bottom:20px;}
#ddi-battle-entry .game .population strong{font-size:30px;font-weight:500;}
#ddi-battle-entry .game .roster{display:grid;gap:7px;}
#ddi-battle-entry .game .person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:8px 9px;text-align:left;min-width:0;}
#ddi-battle-entry .game button.person{width:100%;background:transparent;}
#ddi-battle-entry .game .person.self{background:var(--panel);border-radius:5px;}
#ddi-battle-entry .game .person.out{color:var(--dim);}
#ddi-battle-entry .game .person .name{overflow-wrap:anywhere;}
#ddi-battle-entry .game .person .name small{font-size:11px;color:var(--dim);margin-left:5px;}
#ddi-battle-entry .game .person .context{grid-column:1/-1;color:var(--dim);font-size:11px;}
#ddi-battle-entry .game .mini-life{height:3px;background:var(--raised);grid-column:1/-1;}
#ddi-battle-entry .game .mini-life span{display:block;height:100%;background:var(--mint);}
#ddi-battle-entry .game .person.out .mini-life span{width:0!important;}
#ddi-battle-entry .game .roster-foot{margin-top:18px;font-size:12px;color:var(--dim);}
#ddi-battle-entry .game .field-wrap{grid-column:2;grid-row:1;min-width:0;position:relative;}
#ddi-battle-entry .game .identity{height:34px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--dim);}
#ddi-battle-entry .game .identity.watching{color:var(--ink);background:var(--panel);border-radius:4px;}
#ddi-battle-entry .game .life{height:8px;border-radius:8px;background:var(--raised);display:flex;justify-content:center;overflow:hidden;margin-top:12px;}
#ddi-battle-entry .game .life span{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),#3d937b 35%,#3d937b 65%,var(--mint));}
#ddi-battle-entry .game .life.critical span{background:var(--coral);}
#ddi-battle-entry .game .score{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;font-variant-numeric:tabular-nums;}
#ddi-battle-entry .game .score strong{font-size:21px;font-weight:500;}
#ddi-battle-entry .game .field{height:510px;position:relative;margin-top:12px;background:linear-gradient(90deg,transparent 24.7%,#ffffff06 25%,transparent 25.3%,transparent 49.7%,#ffffff06 50%,transparent 50.3%,transparent 74.7%,#ffffff06 75%,transparent 75.3%);}
#ddi-battle-entry .game .note{position:absolute;left:calc(var(--lane)*25%);width:25%;display:flex;align-items:center;justify-content:center;height:44px;color:var(--pink);pointer-events:none;}
#ddi-battle-entry .game .note svg{width:42px;height:42px;stroke-width:2.3;}
#ddi-battle-entry .game .note.blue{color:var(--blue);}
#ddi-battle-entry .game .note.mine{color:var(--amber);}
#ddi-battle-entry .game .note.mine svg{width:30px;height:30px;}
#ddi-battle-entry .game .note.receptor{color:var(--dim);}
#ddi-battle-entry .game .judgment{position:absolute;top:215px;left:0;right:0;text-align:center;pointer-events:none;}
#ddi-battle-entry .game .judgment strong{font-size:25px;font-weight:800;letter-spacing:-1px;display:block;text-shadow:0 2px 8px var(--bg);}
#ddi-battle-entry .game .judgment .combo{font-size:44px;font-weight:500;line-height:1.2;text-shadow:1px 0 var(--pink),-1px 0 var(--pink),0 1px var(--pink),0 -1px var(--pink);}
#ddi-battle-entry .game .watermark{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:14px;letter-spacing:1px;color:#ffffff20;}
#ddi-battle-entry .game .weapons{grid-column:3;grid-row:1;min-width:0;position:relative;height:642px;width:min(100%,165px);}
#ddi-battle-entry .game .incoming{position:absolute;top:108px;left:0;right:0;display:grid;gap:9px;padding-left:12px;border-left:2px solid var(--amber);}
#ddi-battle-entry .game .incoming strong{font-size:32px;font-weight:500;line-height:1;}
#ddi-battle-entry .game .incoming .strength{display:flex;align-items:baseline;gap:8px;}
#ddi-battle-entry .game .incoming .weakened{color:var(--mint);font-size:12px;}
#ddi-battle-entry .game .incoming.calm{border-left-color:var(--line);color:var(--dim);}
#ddi-battle-entry .game .power{position:absolute;left:0;right:0;bottom:12px;display:grid;gap:8px;padding-left:12px;}
#ddi-battle-entry .game .power-label{display:flex;justify-content:space-between;gap:6px;font-size:12px;}
#ddi-battle-entry .game .power-track{height:6px;background:var(--raised);}
#ddi-battle-entry .game .power-track span{display:block;height:100%;background:var(--pink);}
#ddi-battle-entry .game .power-track.full span{background:var(--ink);}
#ddi-battle-entry .game .reverse .incoming{top:430px;}
#ddi-battle-entry .game .reverse .power{top:80px;bottom:auto;}
#ddi-battle-entry .game .footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;border-top:1px solid var(--line);padding-top:16px;min-height:60px;}
#ddi-battle-entry .game .frozen .field{opacity:.18;}
#ddi-battle-entry .game .outcome{position:absolute;left:-12px;right:-12px;top:230px;text-align:center;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 12px;display:grid;gap:16px;}
#ddi-battle-entry .game .outcome strong{font-size:42px;font-weight:500;}
#ddi-battle-entry .game .outcome .row{justify-content:center;}
#ddi-battle-entry .game .winner-mark{text-align:center;color:var(--mint);padding:10px 0;}
#ddi-battle-entry .game .unavailable{height:510px;display:grid;align-content:center;text-align:center;gap:12px;}
#ddi-battle-entry .game .overlay{position:absolute;inset:0;background:#09070be8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5;}
#ddi-battle-entry .game .dialog{width:min(100%,470px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:20px;}
#ddi-battle-entry .game .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
#ddi-battle-entry .game .facts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;}
#ddi-battle-entry .game .facts span:nth-child(odd){color:var(--dim);}
#ddi-battle-entry .game .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
@media(max-width:760px){#ddi-battle-entry .game{min-height:1600px;padding:20px;}#ddi-battle-entry .game .arena{grid-template-columns:1fr;gap:20px;}#ddi-battle-entry .game .field-wrap{grid-column:1;grid-row:2;width:min(100%,288px);justify-self:center;}#ddi-battle-entry .game .weapons{grid-column:1;grid-row:1;position:static;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(100%,480px);height:auto;min-height:150px;justify-self:center;}#ddi-battle-entry .game .incoming,#ddi-battle-entry .game .power,#ddi-battle-entry .game .reverse .incoming,#ddi-battle-entry .game .reverse .power{position:static;align-content:start;}#ddi-battle-entry .game .reverse .weapons{grid-row:3;}#ddi-battle-entry .game .people{grid-column:1;grid-row:4;width:100%;justify-self:stretch;padding-top:0;}#ddi-battle-entry .game .roster{grid-template-columns:repeat(2,minmax(0,1fr));}#ddi-battle-entry .game .population{margin-bottom:12px;}#ddi-battle-entry .game .header{padding-right:70px;}#ddi-battle-entry .game .song-header{text-align:left;}#ddi-battle-entry .game.has-overlay .arena,#ddi-battle-entry .game.has-overlay .footer{display:none;}#ddi-battle-entry .game .overlay{position:static;padding:0;background:var(--bg);}}
@media(max-width:420px){#ddi-battle-entry .game{padding:16px;min-height:1600px;}#ddi-battle-entry .game .header{grid-template-columns:1fr;padding-right:80px;}#ddi-battle-entry .game .dialog{padding:18px;}#ddi-battle-entry .game .outcome{left:0;right:0;}#ddi-battle-entry .game .incoming strong{font-size:28px;}}
@media(pointer:coarse){#ddi-battle-entry .game button{min-height:44px;}}
#ddi-battle-entry .game .roster-label{display:flex;justify-content:space-between;padding:0 9px 8px;font-size:11px;color:var(--dim);}

/* Gameplay study: normal field with small remote fields in its side space. */
#ddi-battle-entry .game{font-family:DDIStudy,ui-monospace,monospace;min-height:760px;padding:0;display:block;background:radial-gradient(ellipse at 50% 30%,#1c2029 0%,#101016 65%);--field-width:clamp(256px,28.125%,288px);}
#ddi-battle-entry .game .header{position:absolute;inset:18px 20px auto;display:grid;grid-template-columns:1fr var(--field-width) 1fr;padding-right:0;gap:10px;z-index:1;pointer-events:none;}
#ddi-battle-entry .game .header .song-header{text-align:right;padding-right:85px;}
#ddi-battle-entry .game .population-inline{display:block;margin-top:5px;color:var(--ink);}
#ddi-battle-entry .game .arena{position:relative;display:block;height:760px;}
#ddi-battle-entry .game .field-wrap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:var(--field-width);height:690px;padding:0 4px;background:#05091080;}
#ddi-battle-entry .game .identity{position:absolute;top:657px;left:0;right:0;height:27px;font-size:12px;background:transparent;}
#ddi-battle-entry .game .identity:not(.watching){display:none;}
#ddi-battle-entry .game .identity.watching{background:#161318de;}
#ddi-battle-entry .game .life{margin-top:22px;height:8px;}
#ddi-battle-entry .game .life span{background:linear-gradient(110deg,#35d289,#166644 35%,#207f5a 65%,#4cdb9b);}
#ddi-battle-entry .game .life.critical span{background:var(--coral);}
#ddi-battle-entry .game .score{justify-content:center;margin-top:10px;}
#ddi-battle-entry .game .score strong{font-family:DDIStudy;font-size:25px;font-weight:600;}
#ddi-battle-entry .game .score .small{display:none;}
#ddi-battle-entry .game .field{height:570px;margin-top:14px;background:none;}
#ddi-battle-entry .game .note{height:60px;transform:translateY(-50%);z-index:2;}
#ddi-battle-entry .game .skin-glyph{display:block;position:relative;width:150%;aspect-ratio:1;flex-shrink:0;transform:rotate(var(--turn));background:linear-gradient(130deg,#fd973c 10%,#f2489a 45%,#bc5cfa 70%,#40b9ff 90%);mask-image:var(--arrow-mask);mask-size:contain;mask-repeat:no-repeat;mask-position:center;}
#ddi-battle-entry .game .skin-vertical{mask-image:var(--vertical-mask);}
#ddi-battle-entry .game .blue .skin-glyph{background:linear-gradient(130deg,#458fff 5%,#59d3ef 40%,#50ebb2 70%,#c1fe84);}
#ddi-battle-entry .game .flat .skin-glyph{background:#93a6ff;}
#ddi-battle-entry .game .skin-receptor{background:#8c98a3!important;filter:drop-shadow(0 0 2px #000);}
#ddi-battle-entry .game .mine .skin-glyph{mask:none;background:none!important;}
#ddi-battle-entry .game .mine-art{width:100%;height:auto;display:block;}
#ddi-battle-entry .game .hold-body{position:absolute;width:7px;background:linear-gradient(90deg,#29769e80,#7da8e6,#29769e80);border-radius:5px;transform:translateX(-50%);z-index:1;}
#ddi-battle-entry .game .judgment{top:38%;z-index:3;}
#ddi-battle-entry .game .judgment strong{font-family:DDIJudgment,DDIStudy,monospace;font-size:30px;font-weight:800;color:#a6f2ff;}
#ddi-battle-entry .game .judgment .combo{display:block;margin-top:24px;font-family:DDIStudy;font-size:59px;font-weight:600;text-shadow:2px 0 #34205e,-2px 0 #34205e,0 2px #34205e,0 -2px #34205e,3px 0 #bca2ff,-3px 0 #bca2ff,0 3px #bca2ff,0 -3px #bca2ff;}
#ddi-battle-entry .game .weapons{position:static;width:auto;height:auto;}
#ddi-battle-entry .game .incoming{left:calc(50% + var(--field-width)/2 + 10px);right:auto;top:100px;width:78px;padding-left:8px;gap:7px;border-left-width:1px;}
#ddi-battle-entry .game .incoming .eyebrow{font-size:11px;letter-spacing:0;text-transform:none;}
#ddi-battle-entry .game .incoming strong{font-size:25px;}
#ddi-battle-entry .game .incoming .strength{gap:4px;flex-wrap:wrap;}
#ddi-battle-entry .game .incoming .small,#ddi-battle-entry .game .incoming .weakened{font-size:11px;}
#ddi-battle-entry .game .power{left:calc(50% - var(--field-width)/2 - 90px);right:auto;top:470px;bottom:auto;width:80px;padding-left:0;}
#ddi-battle-entry .game .power-label{font-size:11px;flex-wrap:wrap;}
#ddi-battle-entry .game .power .small{font-size:11px;}
#ddi-battle-entry .game .reverse .incoming{top:500px;}
#ddi-battle-entry .game .reverse .power{top:110px;bottom:auto;}
#ddi-battle-entry .game .opponent-wing{position:absolute;top:120px;width:calc(50% - var(--field-width)/2 - 118px);max-width:260px;}
#ddi-battle-entry .game .wing-left{left:16px;}
#ddi-battle-entry .game .wing-right{right:16px;}
#ddi-battle-entry .game .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;}
#ddi-battle-entry .game .miniature{display:block;min-width:0;padding:0;background:transparent;border:0;border-radius:0;text-align:left;color:var(--ink);}
#ddi-battle-entry .game button.miniature{padding:0;background:transparent;border:1px solid transparent;}
#ddi-battle-entry .game button.miniature[aria-pressed=true]{border-color:var(--pink);}
#ddi-battle-entry .game .mini-name{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font-size:12px;min-height:24px;overflow-wrap:anywhere;}
#ddi-battle-entry .game .mini-name small{font-size:11px;color:var(--dim);}
#ddi-battle-entry .game .mini-screen{position:relative;display:block;height:220px;background:#060b12a8;padding:8px 5px 0;overflow:hidden;}
#ddi-battle-entry .game .mini-life{display:flex;justify-content:center;height:3px;background:var(--raised);}
#ddi-battle-entry .game .mini-life span{display:block;height:100%;background:linear-gradient(90deg,#35d289,#166644,#35d289);}
#ddi-battle-entry .game .mini-score{display:block;font-size:11px;text-align:center;margin-top:5px;color:var(--dim);}
#ddi-battle-entry .game .mini-field{display:block;position:relative;height:177px;margin-top:3px;}
#ddi-battle-entry .game .mini-field .note{height:24px;}
#ddi-battle-entry .game .mini-field .hold-body{width:3px;}
#ddi-battle-entry .game .mini-field .judgment{top:38%;}
#ddi-battle-entry .game .mini-field .judgment strong{font-size:11px;letter-spacing:-.4px;}
#ddi-battle-entry .game .mini-field .judgment .combo{font-size:22px;margin-top:9px;text-shadow:1px 0 #8763c8,-1px 0 #8763c8,0 1px #8763c8,0 -1px #8763c8;}
#ddi-battle-entry .game .mini-message{display:grid;place-items:center;height:90%;font-size:12px;color:var(--dim);}
#ddi-battle-entry .game .miniature.out .mini-name{color:var(--dim);}
#ddi-battle-entry .game .miniature.out .mini-screen{background:#060b1240;}
#ddi-battle-entry .game .dense .mini-screen{height:160px;}
#ddi-battle-entry .game .dense .mini-field{height:118px;}
#ddi-battle-entry .game .dense .mini-grid{gap:12px;}
#ddi-battle-entry .game .dense .mini-field .judgment .combo{margin-top:4px;font-size:18px;}
#ddi-battle-entry .game .mini-summary{display:block;margin-top:12px;color:var(--dim);font-size:11px;}
#ddi-battle-entry .game .footer{position:absolute;bottom:12px;left:20px;right:20px;border:0;margin:0;padding:0;min-height:40px;}
#ddi-battle-entry .game .watermark{display:none;}
#ddi-battle-entry .game .winner-mark{position:absolute;bottom:12px;left:0;right:0;}
#ddi-battle-entry .game .outcome{top:235px;}
#ddi-battle-entry .game .unavailable{height:625px;}
@media(max-width:850px){#ddi-battle-entry .game{min-height:1510px;padding:16px;}#ddi-battle-entry .game .header{position:static;display:flex;justify-content:space-between;margin-bottom:24px;min-height:55px;padding-right:80px;}#ddi-battle-entry .game .header .song-header{padding:0;}#ddi-battle-entry .game .arena{height:auto;display:grid;grid-template-columns:1fr;gap:24px;}#ddi-battle-entry .game .field-wrap{position:relative;top:auto;left:auto;transform:none;width:min(288px,100%);grid-column:1;grid-row:2;justify-self:center;}#ddi-battle-entry .game .weapons{position:static;width:100%;grid-column:1;grid-row:1;display:flex;justify-content:center;gap:32px;min-height:125px;}#ddi-battle-entry .game .incoming,#ddi-battle-entry .game .power,#ddi-battle-entry .game .reverse .incoming,#ddi-battle-entry .game .reverse .power{position:static;width:120px;min-height:110px;}#ddi-battle-entry .game .opponent-wing{position:static;max-width:none;width:100%;grid-column:1;}#ddi-battle-entry .game .wing-left{grid-row:3;}#ddi-battle-entry .game .wing-right{grid-row:4;}#ddi-battle-entry .game .mini-grid{grid-template-columns:repeat(4,minmax(0,1fr));}#ddi-battle-entry .game .dense .mini-grid{grid-template-columns:repeat(3,minmax(0,1fr));}#ddi-battle-entry .game .footer{position:static;margin-top:20px;}#ddi-battle-entry .game.has-overlay .arena,#ddi-battle-entry .game.has-overlay .footer{display:none;}}
@media(max-width:480px){#ddi-battle-entry .game{min-height:2160px;}#ddi-battle-entry .game .mini-grid,#ddi-battle-entry .game .dense .mini-grid{grid-template-columns:repeat(2,minmax(0,1fr));}#ddi-battle-entry .game .dense .mini-screen{height:155px;}#ddi-battle-entry .game .header{align-items:start;flex-wrap:wrap;gap:8px;}#ddi-battle-entry .game .mini-grid{gap:14px;}}

#ddi-battle-entry .game .header{display:block;}
#ddi-battle-entry .game .remaining{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;}
#ddi-battle-entry .game .battle-power{position:absolute;left:4px;right:4px;top:12px;height:3px;background:#24212b;z-index:4;}
#ddi-battle-entry .game .battle-power>span,#ddi-battle-entry .game .mini-power>span{height:100%;display:block;background:#d098eb;}
#ddi-battle-entry .game .battle-power.full>span,#ddi-battle-entry .game .mini-power.full>span{background:#ece0f7;}
#ddi-battle-entry .game .mini-power{position:absolute;top:3px;left:5px;right:5px;height:2px;background:#24212b;}
#ddi-battle-entry .game .mini-power.inactive{opacity:.35;}
#ddi-battle-entry .game .score{height:35px;min-height:35px;}
#ddi-battle-entry .game .mini-score{height:15px;min-height:15px;}
#ddi-battle-entry .game .score-hidden{visibility:hidden;}
#ddi-battle-entry .game .incoming-cue{position:absolute;top:113px;left:calc(50% + var(--field-width)/2 + 10px);display:flex;gap:7px;align-items:center;color:var(--amber);}

const songs=[{id:'paper',title:'Paper Satellites',artist:'Soft Signal',meter:9,medium:5,a:'#5a667e',b:'#b27891'},{id:'signal',title:'Signal Bloom',artist:'Glass Current',meter:10,medium:6,a:'#356756',b:'#8871a0'},{id:'night',title:'Night Current',artist:'Parallel Lines',meter:11,medium:7,a:'#344c79',b:'#a65b7c'},{id:'violet',title:'Violet Line',artist:'Low Orbit',meter:10,medium:6,a:'#785986',b:'#47848a'},{id:'glass',title:'Glass Orchard',artist:'Twin Echo',meter:8,medium:5,a:'#68734c',b:'#60818c'},{id:'neon',title:'Neon Steps',artist:'Pulse Index',meter:12,medium:8,a:'#79619c',b:'#9f6556'}];
const rooms=[{id:'after',name:'After Hours',host:'Mira',humans:3,cpus:2,phase:'Preparing',preset:'Standard Battle',admission:'now',song:0},{id:'night',name:'Night Shift',host:'Sol',humans:4,cpus:4,phase:'Stage 2 / 4',preset:'Standard Battle',admission:'wait',song:1},{id:'circuit',name:'Open Circuit',host:'Jules',humans:2,cpus:3,phase:'Stage 2 / 4',preset:'Custom Battle',admission:'late',song:1},{id:'full',name:'Full House',host:'Rin',humans:8,cpus:0,phase:'Stage 3 / 4',preset:'Standard Battle',admission:'full',song:2}];
const botNames=['Quartz','Arc','Orbit','Lumen','Echo','Flux','Nova'];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='',disabled=false,aria='')=>`<button type="button" class="cursor-interaction ${cls}" data-action="${action}" ${disabled?'disabled':''} ${aria?`aria-label="${aria}"`:''}>${label}</button>`;
function defaults(k){return {route:k==='browse'?'browse':k==='find'?'find':['auto','local'].includes(k)?'room':'home',mode:k==='auto'?'auto':k==='local'?'local':'hosted',signedIn:k==='auto',service:k!=='offline',focus:'',stage:1,practice:null,roomId:'after',query:'',filter:'All rooms',directory:'Populated',availability:'Unchanged',overlay:'',intent:'',invitePreview:false,auth:'Idle',authReply:'No response',sessionEvent:'No update',phase:k==='auto'?'gathering':'lobby',share:'Ready',ready:false,otherReady:true,waiting:false,cpuCount:3,profile:'Gentle',queue:[0,1,2,3],levels:['Medium','Medium','Medium','Medium'],selected:0,candidate:0,roster:[],count:3,search:'searching',notice:'',roomName:'Kai’s room',visibility:'Public',invite:'',committed:false};}
function restore(s,o){if(!o||typeof o!=='object')return;for(const k of ['signedIn','service','ready','otherReady','waiting','committed','invitePreview'])if(typeof o[k]==='boolean')s[k]=o[k];const options={route:['home','preview','browse','find','search','room','play'],mode:['hosted','auto','local','owner'],roomId:rooms.map(r=>r.id),filter:['All rooms','Preparing','Late entry'],directory:['Populated','Empty'],availability:['Unchanged','Match started','Room full','Room closed'],phase:['lobby','gathering','preparing','waiting-human','playing'],share:['Ready','Loading','Failed'],profile:['Gentle','Regular','Challenging'],search:['searching','running-offer','failed'],visibility:['Public','Invite only']};for(const[k,values]of Object.entries(options))if(values.includes(o[k]))s[k]=o[k];if([1,2,3,4].includes(o.stage))s.stage=o.stage;if(o.practice&&typeof o.practice==='object'){const p=o.practice;if(Number.isInteger(p.cpuCount)&&p.cpuCount>=1&&p.cpuCount<=7&&['Gentle','Regular','Challenging'].includes(p.profile)&&Array.isArray(p.queue)&&p.queue.length>=1&&p.queue.length<=4&&p.queue.every(n=>Number.isInteger(n)&&n>=0&&n<songs.length)&&Array.isArray(p.levels)&&p.levels.length===4&&p.levels.every(x=>['Easy','Medium','Hard'].includes(x)))s.practice={cpuCount:p.cpuCount,profile:p.profile,queue:p.queue.slice(),levels:p.levels.slice(),selected:0};}if(Number.isInteger(o.cpuCount)&&o.cpuCount>=1&&o.cpuCount<=7)s.cpuCount=o.cpuCount;if(Array.isArray(o.queue)&&o.queue.length>=1&&o.queue.length<=4&&o.queue.every(n=>Number.isInteger(n)&&n>=0&&n<songs.length))s.queue=o.queue.slice();if(Array.isArray(o.levels)&&o.levels.length===4&&o.levels.every(x=>['Easy','Medium','Hard'].includes(x)))s.levels=o.levels.slice();s.selected=Math.min(Math.max(Number(o.selected)||0,0),s.queue.length-1);for(const k of ['query','roomName','invite'])if(typeof o[k]==='string')s[k]=o[k].slice(0,100);s.overlay='';s.intent='';s.auth='Idle';s.authReply='No response';s.sessionEvent='No update';if(o.committed&&Array.isArray(o.roster)&&o.roster.length>=2&&o.roster.length<=8&&o.roster.every(p=>p&&/^(you|sol|cpu[0-6])$/.test(p.id))&&new Set(o.roster.map(p=>p.id)).size===o.roster.length){s.roster=o.roster.map(p=>p.id==='you'?{id:'you',name:s.mode==='local'?'You':'Kai'}:p.id==='sol'?{id:'sol',name:'Sol'}:{id:p.id,name:botNames[Number(p.id.slice(3))],cpu:true});s.committed=true;}else{s.committed=false;s.roster=[];}if(s.route==='play')s.route='room';if(o.phase==='countdown'||s.phase==='playing'&&!s.committed){s.route='room';s.phase=s.mode==='auto'?'preparing':'lobby';s.ready=false;s.waiting=false;s.committed=false;s.roster=[];}}
for(const node of nodes){states[node.dataset.view]=defaults(node.dataset.view);const saved=window.openai?.widgetState?.privateContent;if(saved?.version===1)restore(states[node.dataset.view],saved.views?.[node.dataset.view]);}
function save(node){const s=states[node.dataset.view];window.openai?.setWidgetState?.({modelContent:{view:node.dataset.view,screen:s.route,mode:s.mode,phase:s.phase,waiting:s.waiting,signedIn:s.signedIn,practiceCpus:s.cpuCount,cpuProfile:s.profile,songs:s.queue.map(i=>songs[i].title)},privateContent:{version:1,views:states}})?.catch(()=>{});}
const get=node=>states[node.dataset.view];
function currentRoom(s){const base=rooms.find(r=>r.id===s.roomId)||rooms[0];return {...base,admission:s.availability==='Room full'?'full':s.availability==='Room closed'?'closed':s.availability==='Match started'?'wait':base.admission,phase:s.availability==='Match started'?'Stage 1 / 4':base.phase};}
function title(s){return s.mode==='local'?'CPU practice':s.mode==='auto'?'Battle · 014':s.mode==='owner'?s.roomName:currentRoom(s).name;}
function me(s){return s.mode==='local'?'You':'Kai';}
function owned(s){return ['local','owner'].includes(s.mode);}
function meter(song,level){return level==='Easy'?Math.max(2,song.medium-2):level==='Medium'?song.medium:song.meter;}
function head(s,label,back='home'){return `<header class="entry-head">${back==='main'?'':button(icon('arrow-left'),back,'quiet',false,'Back')}<h2>${esc(label)}</h2>${s.mode!=='local'?`<span class="account">${s.route==='room'||s.committed?icon('user')+' Kai':button(s.signedIn?icon('user')+' Kai':'Sign in','account','quiet')}</span>`:''}</header>`;}
function art(song){return `<div class="art" style="--a:${song.a};--b:${song.b}" aria-hidden="true"><span class="art-word">${song.title.toUpperCase()}</span></div>`;}
function service(s){return `<span class="service-status ${s.service?'':'down'}">${icon(s.service?'globe':'wifi-off')}${s.service?'Online':'Online unavailable'}</span>`;}
function home(node){const s=get(node),descriptions={find:['Find a match','Automatic rooms · CPU fill'],browse:['Browse rooms','Public rooms · Hosted matches'],local:['Practice with CPUs','Your songs · Local play']},entry=descriptions[s.focus]||['Battle','Automatic rooms, hosted matches, or local practice'];return `<div class="end-shell">${head(s,'Multiplayer','main')}<main class="home-layout"><nav class="home-menu" aria-label="Multiplayer choices">${[['find','Find match'],['browse','Browse rooms'],['local','Practice with CPUs']].map(([id,label])=>`<button type="button" data-action="${id}" class="home-choice cursor-interaction" aria-pressed="${s.focus===id}" ${!s.service&&id!=='local'?'disabled':''}><span>${label}</span>${icon('chevron-right')}</button>`).join('')}<div class="home-secondary">${button('Create room','create','quiet',!s.service)}${button('Join by link','invite','quiet',!s.service)}</div></nav><section class="home-preview"><h3>${entry[0]}</h3><p>${entry[1]}</p><div class="mode-detail-row">${icon('zap')} Mines · Accuracy weakening</div>${service(s)}</section></main><footer class="end-foot"><span class="muted">Battle</span><span class="muted">Local practice works without sign-in</span></footer></div>`;}
function filtered(s){return s.directory==='Empty'?[]:rooms.filter(r=>r.name.toLowerCase().includes(s.query.toLowerCase())&&(s.filter==='All rooms'||s.filter==='Preparing'&&r.phase==='Preparing'||s.filter==='Late entry'&&r.admission==='late'));}
function seatCounts(r){return `<span class="seat-counts" aria-label="${r.humans} humans, ${r.cpus} CPUs, 8 playing seats"><span>${icon('users')}${r.humans}</span><span>${icon('cpu')}${r.cpus}</span><span class="muted">/ 8</span></span>`;}
function roomPreview(s,r){const song=songs[r.song],joinLabel={now:'Join room',wait:'Join and wait',late:'Join for stage 3',full:'Room full',closed:'Room closed'}[r.admission];return `<section class="room-preview" aria-label="Selected room details"><div class="preview-title"><h3>${r.name}</h3><span class="small muted">${r.host}</span></div>${art(song)}<div class="end-title"><h3>${song.title}</h3><span class="small muted">Single · Hard ${song.meter} · ${r.phase}</span></div><div class="facts"><span>Battle</span><span>${r.admission==='late'?'Custom':'Standard'}</span><span>Stages</span><span>4</span><span>Attacks / defense</span><span>Mines / Weakening</span></div><div class="admission"><strong>${r.admission==='now'?'Next match preparing':r.admission==='late'?'Entry · Stage 3':r.admission==='wait'?'Entry · Next match':joinLabel}</strong><p>${r.admission==='late'?'Earlier stages earn no points.':r.admission==='wait'?'Watch while this match finishes.':r.admission==='full'?'No playing or watching places available.':r.admission==='closed'?'This room is no longer available.':'Songs are shared after joining.'}</p></div><div class="row">${button(joinLabel,'join','primary',['full','closed'].includes(r.admission))}${button('Rules','rules','quiet')}</div></section>`;}
function browse(node){const s=get(node),list=filtered(s);if(!list.some(r=>r.id===s.roomId)&&list.length)s.roomId=list[0].id;return `<div class="end-shell">${head(s,'Public rooms')}<main class="browse-layout"><section class="browser-list"><div class="browser-tools"><input data-input="query" value="${esc(s.query)}" placeholder="Search rooms" aria-label="Search public rooms"><select data-input="filter" aria-label="Room phase filter">${['All rooms','Preparing','Late entry'].map(x=>`<option ${x===s.filter?'selected':''}>${x}</option>`).join('')}</select>${button(icon('refresh-cw'),'refresh','quiet',false,'Refresh rooms')}</div>${!s.service?`<div class="empty-list"><h3>Online unavailable</h3>${button('Practice with CPUs','local')}</div>`:!list.length?`<div class="empty-list"><h3>${s.query||s.filter!=='All rooms'?'No matching rooms':'No public rooms'}</h3><div class="row">${s.query||s.filter!=='All rooms'?button('Clear filters','clear-filter'):button('Find match','find')}${button('Practice with CPUs','local','quiet')}</div></div>`:list.map(r=>`<button type="button" class="room-option cursor-interaction" data-action="room-${r.id}" aria-pressed="${r.id===s.roomId}"><span class="room-option-top"><strong>${r.name}</strong>${seatCounts(r)}</span><span class="room-option-meta"><span>${r.preset}</span><span>${r.phase}</span></span><span class="small muted">${r.admission==='now'?'Preparing next match':r.admission==='wait'?'Watch · Next match':r.admission==='late'?'Join at stage 3':'Room full'}</span></button>`).join('')}</section>${s.service&&list.length?roomPreview(s,currentRoom(s)):''}</main><footer class="end-foot"><span class="muted" role="status">${s.notice}</span>${service(s)}</footer></div>`;}
function songRow(song,i,s,library=false){return `<button type="button" data-action="${library?'candidate':'slot'}-${library?songs.indexOf(song):i}" class="song-row cursor-interaction ${library?s.candidate===songs.indexOf(song)?'selected':'':s.selected===i?'selected':''}" aria-pressed="${library?s.candidate===songs.indexOf(song):s.selected===i}" style="--drift:${library?0:Math.min(18,Math.abs(i-s.selected)*8)}px;--a:${song.a};--b:${song.b}"><span class="thumb">${library?'':i+1}</span><span><span class="title">${song.title}</span><small>${song.artist}</small></span><span class="meter">${meter(song,s.levels[i]||'Medium')}</span></button>`;}
function find(node){const s=get(node);return `<div class="end-shell">${head(s,'Find match')}<main class="browse-layout"><section class="mode-details"><div class="end-title"><h3>Standard Battle</h3><span class="muted">Opening set</span></div>${art(songs[s.queue[s.selected]])}<div class="mode-detail-row">${icon('music-2')} 4 stages · Single · Medium 5–7</div><div class="mode-detail-row">${icon('users')} Up to 8 players</div><div class="mode-detail-row">${icon('cpu')} Empty seats filled with CPUs · Gentle</div><div class="mode-detail-row">${icon('zap')} Mines · Accuracy weakening</div><div class="row">${button('Rules','rules','quiet')}</div></section><section class="song-wheel" aria-label="Automatic song rotation">${[0,1,2,3].map((i)=>songRow(songs[i],i,s)).join('')}</section></main><footer class="end-foot">${service(s)}<div class="row">${button('Find match','search','primary',!s.service)}${!s.service?button('Practice with CPUs','local'):''}</div></footer></div>`;}
function search(node){const s=get(node),running=s.search==='running-offer',failed=s.search==='failed'||!s.service;return `<div class="end-shell">${head(s,'Find match','cancel-search')}<section class="route-card"><div class="row">${icon(failed?'wifi-off':running?'eye':'search')}<h3>${failed?'No session available':running?'A match is in progress':'Finding a room'}</h3></div><p>${failed?'Try again or start a local match.':running?'Stage 2 of 4 · Play from the next match.':'Standard Battle · Opening set'}</p>${!failed?'<div class="queue-status">Up to 8 players · CPU fill</div>':''}<div class="row">${failed?button('Retry','search','primary',!s.service)+button('Practice with CPUs','local'):running?button('Join and wait','wait-auto','primary')+button('Keep looking','keep-looking'):''}${button('Cancel','cancel-search','quiet')}</div></section></div>`;}
function roster(s){if(s.committed)return s.roster;if(s.mode==='local'||s.mode==='owner')return [{id:'you',name:me(s)},...botNames.slice(0,s.cpuCount).map((name,i)=>({id:'cpu'+i,name,cpu:true}))];if(s.mode==='auto')return [{id:'you',name:'Kai'},{id:'sol',name:'Sol'},...Array.from({length:6},(_,i)=>({id:'fill'+i,name:'CPU fill',cpu:true,provisional:true}))];const r=currentRoom(s),names=['Mira','Sol','Jules','Rin','Ash','Cleo','Rae','Finn'];return [...names.slice(0,r.humans).map((name,i)=>({id:'human'+i,name,host:i===0})),...botNames.slice(0,r.cpus).map((name,i)=>({id:'cpu'+i,name,cpu:true})),...(!s.waiting?[{id:'you',name:'Kai'}]:[])];}
function readyStatus(s,p){if(p.provisional)return 'At start';if(p.cpu)return 'Ready';if(p.id==='you')return s.ready?(s.share==='Ready'?'Ready':'Loading'):'Not ready';return s.mode==='auto'&&s.otherReady?'Ready':'Not ready';}
function phaseText(s){return s.phase==='gathering'?'Gathering players':s.phase==='preparing'?'Preparing · Stage 1 / 4':s.phase==='waiting-human'?'Waiting for a ready player':s.phase==='playing'?'Stage '+s.stage+' / '+s.queue.length+' · Playing':s.waiting?currentRoom(s).phase:s.mode==='local'?'Local · No sign-in required':'Preparing next match';}
function room(node){const s=get(node),song=songs[s.queue[s.selected]],list=roster(s),isOwner=owned(s)&&!s.committed;return `<div class="end-shell">${head(s,title(s),'leave-room')}<div class="row"><span class="small muted">${phaseText(s)}</span>${s.mode==='auto'?'<span class="small muted">Server hosted</span>':''}</div><main class="room-grid"><section class="room-people" aria-label="Participants"><div class="cpu-summary"><span class="small muted">${list.length} / 8</span>${isOwner?button(icon('cpu')+' '+s.cpuCount,'cpus','quiet',false,'Configure CPU opponents'):''}</div>${list.map(p=>`<div class="person-line ${p.provisional?'cpu-placeholder':''}"><span class="who">${p.name}<small>${p.provisional?'':p.cpu?'CPU':p.id==='you'?(s.mode==='owner'?'Host · You':'You'):p.host?'Host':''}</small></span><span class="small muted" aria-label="${readyStatus(s,p)}">${p.provisional?'At start':s.phase==='playing'?'':readyStatus(s,p)==='Ready'?icon('check'):readyStatus(s,p)==='Loading'?icon('download'):icon('minus')}</span></div>`).join('')}${s.waiting?`<div class="room-waiting"><span>Kai</span><span class="small muted">${s.mode==='auto'?'Next match':currentRoom(s).admission==='late'?'Stage 3':'Next match'}</span></div>`:''}${isOwner?`<span class="small muted">${s.profile} CPUs</span>`:''}</section><section class="room-song">${art(song)}<h3 class="song-title">${song.title}</h3><span class="small muted">${song.artist}</span><span class="small muted">142 BPM · 2:31</span><div class="chart-steps">${['Easy','Medium','Hard'].map(level=>isOwner?`<button type="button" class="quiet cursor-interaction" data-action="level-${level}" aria-pressed="${s.levels[s.selected]===level}">${level} ${meter(song,level)}</button>`:`<span>${s.levels[s.selected]===level?`<strong>${level} ${meter(song,level)}</strong>`:level+' '+meter(song,level)}</span>`).join('')}</div>${isOwner?button('Choose song','library','quiet'):''}<span class="small muted">${s.mode==='local'?icon('folder')+' Local library':s.share==='Ready'?icon('check')+' Songs available':s.share==='Loading'?icon('download')+' Loading songs':icon('circle-alert')+' Song download failed'}</span>${s.share==='Failed'&&s.mode!=='local'?button('Retry download','retry-share'):''}</section><section class="song-wheel" aria-label="Match playlist">${s.queue.map((index,i)=>songRow(songs[index],i,s)).join('')}</section></main><div class="room-instruction" role="status">${s.notice|| (s.mode==='auto'&&s.phase==='preparing'?'Starting in 15s · Unready players wait for the next match':s.mode==='auto'&&s.phase==='gathering'?'Open seats become CPUs when the roster locks':s.mode==='local'?'':s.waiting&&currentRoom(s).admission==='late'?'Earlier stages earn no points':'')}</div><footer class="end-foot"><div class="row">${button('Rules','rules','quiet')}${isOwner?button(s.queue.length+' stages','stages','quiet'):''}</div><div class="row">${s.phase==='playing'?button(s.waiting?'Watch':'Back to play','watch','primary'):s.waiting?'':s.mode==='local'?button('Start match','start-local','primary'):button(s.ready?(s.share==='Ready'?icon('check')+' Ready':'Ready when loaded'):'Ready','ready',s.ready?'':'primary')}${s.mode==='owner'&&!s.committed?button('Start match','start-local','',!s.ready||s.share!=='Ready'):''}</div></footer></div>`;}

function appearance(p,v){const i=Math.max(0,v.list.findIndex(x=>x.id===p.id));return {reverse:p.id==='kai'?v.s.reverse:p.id==='sol'||p.id==='arc',speed:p.id==='mira'?.82:p.id==='sol'?1.28:1,flat:p.id==='arc',combo:p.id==='kai'?168:p.id==='mira'?212:p.id==='sol'?136:82+i*7,judgment:p.id==='sol'?'Perfect':p.id==='quartz'?'Great':'Marvelous',accuracy:p.id==='kai'?'98.42':p.id==='mira'?'99.14':p.id==='sol'?'97.80':'96.31'};}
function glyph(lane,receptor=false,mine=false){return `<span class="skin-glyph ${receptor?'skin-receptor':''} ${lane===1||lane===2?'skin-vertical':'skin-arrow'}" style="--turn:${[270,180,0,90][lane]}deg">${mine?'<img class="mine-art" src="'+skinAssets.mine+'" alt="">':''}</span>`;}
function drawNotes(v,p,mini=false){const a=appearance(p,v),at=(beats)=>a.reverse?89-beats*16*a.speed:5+beats*16*a.speed;let html='';for(let lane=0;lane<4;lane++)html+=`<span class="note receptor" style="--lane:${lane};top:${at(0)}%">${glyph(lane,true)}</span>`;
const chart=[[0,.55],[2,1.1],[1,1.65],[3,2.4],[0,3.05],[2,3.6],[1,4.15],[3,4.8]];
for(const [index,[lane,beats]] of chart.entries()){const y=at(beats);if(y<0||y>94)continue;html+=`<span class="note ${index%2?'blue':''} ${a.flat?'flat':''}" style="--lane:${lane};top:${y}%">${glyph(lane)}</span>`;}
const holdA=at(2.4),holdB=at(3.8);if(Math.min(holdA,holdB)>=0&&Math.max(holdA,holdB)<=94)html+=`<span class="hold-body" style="left:87.5%;top:${Math.min(holdA,holdB)+2}%;height:${Math.abs(holdA-holdB)}%"></span>`;
const hasMines=p.life>0&&!v.s.fresh&&!v.win&&(p.id==='kai'?v.s.incoming==='active':p.id==='mira');
if(hasMines)for(const [lane,beats] of [[2,2.1],[0,2.65],[1,3.5]]){const y=at(beats);if(y>=0&&y<=94)html+=`<span class="note mine" style="--lane:${lane};top:${y}%">${glyph(lane,false,true)}</span>`;}
if(p.life>0&&!v.s.fresh)html+=`<span class="judgment"><strong>${a.judgment}</strong><span class="combo">${a.combo}</span></span>`;
return html;
}
function miniature(v,p){const a=appearance(p,v),live=p.life>0,available=v.s.previews&&live,selected=v.watch&&p.id===v.shown.id,tag=v.watch&&live?'button':'div',attributes=tag==='button'?`type="button" data-action="follow-${p.id}" aria-pressed="${selected}"`:'';
return `<${tag} ${attributes} data-player="${p.id}" class="miniature ${attackScene(v)?.target===p.id&&attackScene(v).committed?'attack-recipient':''} ${attackScene(v)?.target===p.id&&v.s.attackPhase==='received'?'attack-received':''} ${tag==='button'?'cursor-interaction':''} ${live?'':'out'}" aria-label="${p.name}${p.cpu?', CPU':''}, ${live?(available?'gameplay preview, '+(a.reverse?'Reverse':'upscroll')+', life '+p.life:'preview unavailable'):'eliminated'}"><span class="mini-name">${p.name}<small>${p.cpu?'CPU':p.id==='kai'&&v.s.watchRole!=='observer'?'You':''}</small></span><span class="mini-screen ${a.reverse?'reverse':''}">${powerBar(p,true,!live||v.win)}<span class="mini-life" role="meter" aria-label="${p.name} life" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.life}"><span style="width:${p.life*(.2+.8*p.life/100)}%"></span></span>${available?`<span class="mini-score ${v.s.showScore?'':'score-hidden'}" aria-hidden="${!v.s.showScore}">${v.s.showScore?a.accuracy+'%':''}</span><span class="mini-field" aria-hidden="true">${drawNotes(v,p,true)}</span>`:`<span class="mini-message">${live?'No feed':'Out'}</span>`}</span></${tag}>`;
}
function powerBar(p,mini=false,inactive=false){const amount=inactive?0:p.power;return `<span class="${mini?'mini-power':'battle-power'} ${amount>=100?'full':''} ${inactive?'inactive':''}" role="progressbar" data-power-owner="${p.id}" aria-label="${p.name} attack power" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${amount}" data-tooltip="${inactive?'Attack power inactive':p.name+' · power '+Math.round(amount)+'%'}"><span style="width:${amount}%"></span></span>`;}

function play(node){const s=get(node),players=roster(s).map((p,i)=>({...p,life:100,power:0})),shown=players.find(p=>p.id==='you')||players[0],watch=s.waiting;const v={s:{fresh:true,reverse:false,incoming:'clear',previews:true,showScore:false,watchRole:watch?'observer':'eliminated'},list:players,shown,watch:false,win:false};const others=players.filter(p=>p.id!==shown.id);return `<header class="header"><span class="remaining">${icon('users')}${players.length} / ${players.length}</span></header><main class="arena"><aside class="opponent-wing wing-left"><div class="mini-grid">${others.slice(0,4).map(p=>miniature(v,p)).join('')}</div></aside><section class="field-wrap" aria-label="${watch?'Watching '+shown.name:'Your field'}">${watch?`<div class="identity watching">${icon('eye')} Watching ${shown.name}</div>`:''}${powerBar(shown)}<div class="life" role="meter" aria-label="${shown.name} life" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"><span style="width:100%"></span></div><div class="score score-hidden"></div><div class="field" role="img" aria-label="Illustrative stage opening">${drawNotes(v,shown)}</div></section><aside class="opponent-wing wing-right"><div class="mini-grid">${others.slice(4).map(p=>miniature(v,p)).join('')}</div></aside></main><footer class="start-caption"><span>${watch?'Watching · Next match':s.mode==='local'?'Local match':'Stage 1'} · ${songs[s.queue[s.stage-1]].title}</span>${button('Room','end-preview','quiet')}</footer>`;}
function modal(node){const s=get(node);if(!s.overlay)return '';let title='',body='';if(s.overlay==='auth'){title=s.auth==='Waiting'?'Waiting for Twitch':'Sign in';body=`<p class="small muted">${s.auth==='Waiting'?'Return here after signing in.':s.auth==='Canceled'?'Sign-in canceled. Your selection is saved.':s.intent==='search'?'Find an automatic match as your Twitch identity.':s.intent==='create'?'Create your room as your Twitch identity.':`Join ${currentRoom(s).name} as your Twitch identity.`}</p>${s.auth!=='Waiting'?button('Sign in with Twitch','sign-in','auth-button'):''}<div class="row">${button('Cancel','close','quiet')}</div>`;}
else if(s.overlay==='cpus'){title='CPU opponents';body=`<div class="entry-field"><span>Opponents</span><span class="stepper">${button(icon('minus'),'cpu-less','',s.cpuCount===1,'Fewer CPUs')}<output>${s.cpuCount}</output>${button(icon('plus'),'cpu-more','',s.cpuCount===7,'More CPUs')}</span></div><div class="entry-field"><span>Skill profile</span><div class="profile-options">${['Gentle','Regular','Challenging'].map(p=>`<button type="button" class="cursor-interaction" data-action="profile-${p}" aria-pressed="${s.profile===p}">${p}</button>`).join('')}</div></div><span class="small muted">Profiles include mine sensitivity.</span>`;}

else if(s.overlay==='library'){title='Choose song';body=`<section class="library-wheel" aria-label="Local song library">${songs.map((song,i)=>songRow(song,i,s,true)).join('')}</section>${button('Use song','use-song','primary')}`;}
else if(s.overlay==='rules'){title='Battle rules';body='<div class="facts"><span>Attacks</span><span>Mines</span><span>Defense</span><span>Accuracy weakening</span><span>Targeting</span><span>Spread</span><span>Match standings</span><span>Stage points</span><span>Return each stage</span><span>On</span><span>Entry during match</span><span>'+ (s.mode==='hosted'&&currentRoom(s).admission==='late'?'Next stage':'Off')+'</span></div>';}

else if(s.overlay==='account'){title='Kai';body=`<span class="small muted">Signed in with Twitch</span>${button('Sign out','sign-out')}`;}
else{title='Leave room?';body=`<span class="small muted">${s.mode==='local'?'Your practice setup stays available.':'Leave this place in the room.'}</span><div class="row">${button('Stay','close','primary')}${button('Leave','confirm-leave')}</div>`;}
return `<div class="overlay"><section class="dialog detail-dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog-head"><h3>${title}</h3>${button(icon('x'),'close','quiet',false,'Close')}</div>${body}</section></div>`;}
function render(node){const s=get(node);node.innerHTML=(s.phase==='countdown'?countdown(node):s.route==='home'?home(node):s.route==='preview'?`<div class="end-shell">${head(s,'Room invite')}<div class="browse-layout">${roomPreview(s,currentRoom(s))}</div><div class="end-notice" role="status">${s.notice}</div></div>`:s.route==='browse'?browse(node):s.route==='find'?find(node):s.route==='search'?search(node):s.route==='room'?room(node):play(node))+modal(node);node.classList.toggle('has-overlay',!!s.overlay);node.classList.toggle('library-open',s.overlay==='library');for(const child of [...node.children])if(!child.classList.contains('overlay'))child.inert=!!s.overlay;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function stop(node){clearInterval(timers.get(node.dataset.view));timers.delete(node.dataset.view);}
function start(node){const s=get(node);if(s.mode!=='local'&&(!s.service||!s.signedIn)){s.notice=s.service?'Sign-in required':'Online unavailable';return;}s.stage=1;if(s.mode==='auto'){const humans=[...(s.ready&&s.share==='Ready'?[{id:'you',name:'Kai'}]:[]),...(s.otherReady?[{id:'sol',name:'Sol'}]:[])];if(!humans.length){s.phase='waiting-human';s.notice='Ready a human player to start';return;}s.waiting=!humans.some(p=>p.id==='you');s.roster=[...humans,...botNames.slice(0,8-humans.length).map((name,i)=>({id:'cpu'+i,name,cpu:true}))];}else{s.roster=roster(s).filter(p=>!p.provisional);}s.committed=true;s.phase='countdown';s.count=3;s.overlay='';stop(node);timers.set(node.dataset.view,setInterval(()=>{if(--s.count<=0){stop(node);s.phase='playing';s.route=s.waiting?'room':'play';s.ready=false;}render(node);},1000));}

function completeIntent(node){const s=get(node),intent=s.intent;s.overlay='';s.intent='';if(!s.service){s.notice='Online unavailable';return;}if(intent==='search'){s.profile='Gentle';s.stage=1;s.mode='auto';s.route='search';s.search='searching';s.queue=[0,1,2,3];s.levels=['Medium','Medium','Medium','Medium'];s.selected=0;s.ready=false;}else if(intent==='join'){const r=currentRoom(s);s.route=s.invitePreview?'preview':'browse';if(['full','closed'].includes(r.admission)){s.notice=r.admission==='full'?'Room filled before you could join':'Room closed before you could join';return;}s.mode='hosted';s.waiting=r.admission!=='now';s.route='room';s.phase='lobby';s.ready=false;s.committed=false;s.queue=[0,1,2,3];s.levels=['Hard','Hard','Hard','Hard'];s.selected=r.song;}else if(intent==='create'){s.mode='owner';s.route='room';s.phase='lobby';s.ready=false;s.waiting=false;s.committed=false;}}
function simulate(node,event){const s=get(node);if(event==='Room found'&&s.route==='search'&&s.search==='searching'&&s.service){s.mode='auto';s.stage=1;s.route='room';s.phase='gathering';s.ready=false;s.waiting=false;s.committed=false;s.roster=[];s.selected=0;}else if(event==='Only running room'&&s.route==='search')s.search='running-offer';else if(event==='Search failed'&&s.route==='search')s.search='failed';else if(event==='Gathering ended'&&s.mode==='auto'&&s.phase==='gathering'){s.phase='preparing';if(s.ready&&s.share==='Ready'&&s.otherReady)start(node);}else if(event==='Readiness ended'&&s.mode==='auto'&&s.phase==='preparing')start(node);else if(event==='Countdown complete'&&s.phase==='countdown'){stop(node);s.count=0;s.phase='playing';s.route=s.waiting?'room':'play';s.ready=false;}s.sessionEvent='No update';}
function act(node,a){const s=get(node);if(['home','main'].includes(a)){stop(node);s.route='home';s.phase='lobby';s.mode='hosted';s.overlay='';s.intent='';}else if(a==='find'||a==='browse'){s.invitePreview=false;s.route=a;s.mode=a==='find'?'auto':'hosted';s.phase='lobby';s.overlay='';s.focus=a;s.notice='';if(a==='find'){s.queue=[0,1,2,3];s.levels=['Medium','Medium','Medium','Medium'];s.selected=0;}}else if(a==='local'){stop(node);openLocal(s);s.focus='local';}else if(a==='search')onlineIntent(node,'search');else if(a==='join')onlineIntent(node,'join');else if(a==='sign-in'){s.auth='Waiting';s.authReply='No response';}else if(a==='account'){if(s.signedIn)s.overlay='account';else{s.intent='';s.overlay='auth';s.auth='Idle';}}else if(a==='sign-out'){s.signedIn=false;s.overlay='';}else if(a==='cancel-search'){s.route='find';s.search='searching';s.intent='';s.overlay='';}else if(a==='keep-looking')s.search='searching';else if(a==='wait-auto'){s.stage=2;s.selected=1;s.mode='auto';s.waiting=true;s.committed=true;s.roster=[{id:'sol',name:'Sol'},...botNames.map((name,i)=>({id:'cpu'+i,name,cpu:true}))];s.phase='playing';s.route='room';s.ready=false;}else if(a==='ready'&&!s.waiting){s.ready=!s.ready;if(s.mode==='auto'&&s.phase==='waiting-human'&&s.ready){s.phase='preparing';s.notice='';}if(s.mode==='auto'&&s.phase==='preparing'&&s.ready&&s.share==='Ready'&&s.otherReady)start(node);}else if(a==='start-local'&&owned(s))start(node);else if(a==='cancel-start'){stop(node);s.committed=false;s.roster=[];s.phase=s.mode==='auto'?'preparing':'lobby';s.route='room';s.ready=false;}else if(a==='watch'){s.route='play';}else if(a==='end-preview'){s.route='room';}else if(a==='leave-room')s.overlay='leave';else if(a==='confirm-leave'){cachePractice(s);stop(node);s.mode='hosted';s.route='home';s.phase='lobby';s.overlay='';s.waiting=false;s.ready=false;s.committed=false;s.intent='';}else if(a==='close'){s.overlay='';s.intent='';s.auth='Idle';}else if(['cpus','stages','rules','create','invite'].includes(a))s.overlay=a;else if(a==='library'){s.candidate=s.queue[s.selected];s.overlay='library';}else if(a==='confirm-create')onlineIntent(node,'create');else if(a==='open-invite'){if(['after-hours','https://example.test/#/room/after-hours'].includes(s.invite.trim())){s.invitePreview=true;s.roomId='after';s.route='preview';s.overlay='';s.query='';s.filter='All rooms';}else{s.notice='Invite unavailable';}}else if(a==='cpu-less')s.cpuCount=Math.max(1,s.cpuCount-1);else if(a==='cpu-more')s.cpuCount=Math.min(7,s.cpuCount+1);else if(a.startsWith('profile-'))s.profile=a.slice(8);else if(a==='stage-less'){s.queue=s.queue.slice(0,Math.max(1,s.queue.length-1));s.selected=Math.min(s.selected,s.queue.length-1);}else if(a==='stage-more'&&s.queue.length<4)s.queue.push(s.queue.length);else if(a.startsWith('candidate-'))s.candidate=Number(a.slice(10));else if(a==='use-song'){s.queue[s.selected]=s.candidate;s.ready=false;s.overlay='';}else if(a.startsWith('slot-'))s.selected=Number(a.slice(5));else if(a.startsWith('level-')&&owned(s)){s.levels[s.selected]=a.slice(6);s.ready=false;}else if(a.startsWith('room-')){s.roomId=a.slice(5);s.notice='';}else if(a==='clear-filter'){s.query='';s.filter='All rooms';}else if(a==='refresh')s.notice='Room list refreshed';else if(a==='retry-share')s.share='Loading';render(node);save(node);if(s.overlay){node.returnAction=a;node.querySelector('[data-action="close"]')?.focus();}else if(a==='close'&&node.returnAction)node.querySelector('[data-action="'+node.returnAction+'"]')?.focus();}
for(const node of nodes){render(node);node.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(node,b.dataset.action);});node.addEventListener('input',e=>{const k=e.target.dataset.input;if(!['query','roomName','invite'].includes(k))return;const cursor=e.target.selectionStart;get(node)[k]=e.target.value.slice(0,100);render(node);const input=node.querySelector('[data-input="'+k+'"]');input?.focus();if(input&&Number.isInteger(cursor))input.setSelectionRange(cursor,cursor);save(node);});node.addEventListener('focusin',e=>{const a=e.target.dataset.action;if(get(node).route!=='home'||!['find','browse','local'].includes(a))return;get(node).focus=a;const preview=node.querySelector('.home-preview');if(preview){const copy={find:['Find a match','Automatic rooms · CPU fill'],browse:['Browse rooms','Public rooms · Hosted matches'],local:['Practice with CPUs','Your songs · Local play']}[a];preview.innerHTML='<h3>'+copy[0]+'</h3><p>'+copy[1]+'</p><div class="mode-detail-row">'+icon('zap')+' Mines · Accuracy weakening</div>'+service(get(node));for(const b of node.querySelectorAll('.home-choice'))b.setAttribute('aria-pressed',String(b.dataset.action===a));globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}});node.addEventListener('change',e=>{const k=e.target.dataset.input;if(!k)return;const s=get(node);if(['query','roomName','invite'].includes(k))s[k]=e.target.value.slice(0,100);else if(k==='filter'||k==='visibility')s[k]=e.target.value;render(node);save(node);});node.addEventListener('keydown',e=>{if(e.key==='Escape'&&get(node).overlay){act(node,'close');e.preventDefault();}if(e.key==='Tab'&&get(node).overlay){const list=[...node.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog select')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){last?.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first?.focus();e.preventDefault();}}});
if(globalThis.Tweak){const s=get(node);const t=new Tweak({container:node,onChange:()=>{if(s.authReply!=='No response'&&s.overlay==='auth'&&s.auth==='Waiting'){if(s.authReply==='Signed in'){s.signedIn=true;completeIntent(node);}else s.auth='Canceled';s.authReply='No response';}simulate(node,s.sessionEvent);if(s.mode==='auto'&&s.phase==='preparing'&&s.ready&&s.share==='Ready'&&s.otherReady)start(node);render(node);save(node);}});t.addToggle(s,'signedIn',{label:'Signed in with Twitch'});t.addToggle(s,'service',{label:'Online service available'});t.addSelect(s,'sessionEvent',{label:'Simulate automatic session',options:['No update','Room found','Only running room','Search failed','Gathering ended','Readiness ended','Countdown complete']});t.addSelect(s,'authReply',{label:'Simulate Twitch response',options:['No response','Signed in','Canceled']});t.addSelect(s,'availability',{label:'Selected room changed',options:['Unchanged','Match started','Room full','Room closed']});t.addSelect(s,'directory',{label:'Public directory',options:['Populated','Empty']});t.addSelect(s,'share',{label:'Required songs',options:['Ready','Loading','Failed']});t.addToggle(s,'otherReady',{label:'Other human ready'});}}
window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(data?.version!==1)return;for(const node of nodes){stop(node);restore(get(node),data.views?.[node.dataset.view]);render(node);}});
})();
</script>
