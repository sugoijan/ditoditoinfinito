<style>
#ddi-room-settings .game{--bg:#161318;--panel:#252129;--raised:#35303b;--ink:#f2eee9;--dim:#b3aab8;--line:#49414e;--pink:#ff6ea0;--mint:#9addbd;--coral:#ff8f86;--amber:#e9c58b;--blue:#8fbce8;color-scheme:dark;background:var(--bg);color:var(--ink);font:14px/1.4 'Iosevka Term',ui-monospace,SFMono-Regular,Consolas,monospace;padding:24px;min-height:980px;position:relative;display:flex;flex-direction:column;gap:24px;box-sizing:border-box;}
#ddi-room-settings .game *{box-sizing:border-box;}
#ddi-room-settings .game :is(h2,h3,p){margin:0;}
#ddi-room-settings .game h2{font-size:20px;font-weight:500;}
#ddi-room-settings .game h3{font-size:15px;font-weight:500;}
#ddi-room-settings .game .small{font-size:12px;}
#ddi-room-settings .game .muted{color:var(--dim);}
#ddi-room-settings .game .accent{color:var(--pink);}
#ddi-room-settings .game .eyebrow{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
#ddi-room-settings .game svg{width:17px;height:17px;flex-shrink:0;}
#ddi-room-settings .game button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid transparent;border-radius:5px;min-height:38px;padding:8px 12px;}
#ddi-room-settings .game button:hover:not(:disabled){background:var(--raised);}
#ddi-room-settings .game button:disabled{opacity:.45;}
#ddi-room-settings .game button.quiet{background:transparent;}
#ddi-room-settings .game button.primary{outline:2px solid var(--pink);outline-offset:3px;background:var(--raised);}
#ddi-room-settings .game button[aria-pressed=true]{border-color:var(--pink);background:var(--raised);}
#ddi-room-settings .game .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
#ddi-room-settings .game .header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-right:90px;align-items:start;}
#ddi-room-settings .game .header>div{display:grid;gap:3px;}
#ddi-room-settings .game .song-header{text-align:right;}
#ddi-room-settings .game .arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,288px) minmax(0,1fr);gap:28px;flex:1;align-items:start;}
#ddi-room-settings .game .people{grid-column:1;grid-row:1;width:min(100%,190px);justify-self:end;padding-top:18px;}
#ddi-room-settings .game .population{display:flex;align-items:baseline;gap:7px;margin-bottom:20px;}
#ddi-room-settings .game .population strong{font-size:30px;font-weight:500;}
#ddi-room-settings .game .roster{display:grid;gap:7px;}
#ddi-room-settings .game .person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:8px 9px;text-align:left;min-width:0;}
#ddi-room-settings .game button.person{width:100%;background:transparent;}
#ddi-room-settings .game .person.self{background:var(--panel);border-radius:5px;}
#ddi-room-settings .game .person.out{color:var(--dim);}
#ddi-room-settings .game .person .name{overflow-wrap:anywhere;}
#ddi-room-settings .game .person .name small{font-size:11px;color:var(--dim);margin-left:5px;}
#ddi-room-settings .game .person .context{grid-column:1/-1;color:var(--dim);font-size:11px;}
#ddi-room-settings .game .mini-life{height:3px;background:var(--raised);grid-column:1/-1;}
#ddi-room-settings .game .mini-life span{display:block;height:100%;background:var(--mint);}
#ddi-room-settings .game .person.out .mini-life span{width:0!important;}
#ddi-room-settings .game .roster-foot{margin-top:18px;font-size:12px;color:var(--dim);}
#ddi-room-settings .game .field-wrap{grid-column:2;grid-row:1;min-width:0;position:relative;}
#ddi-room-settings .game .identity{height:34px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--dim);}
#ddi-room-settings .game .identity.watching{color:var(--ink);background:var(--panel);border-radius:4px;}
#ddi-room-settings .game .life{height:8px;border-radius:8px;background:var(--raised);display:flex;justify-content:center;overflow:hidden;margin-top:12px;}
#ddi-room-settings .game .life span{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),#3d937b 35%,#3d937b 65%,var(--mint));}
#ddi-room-settings .game .life.critical span{background:var(--coral);}
#ddi-room-settings .game .score{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;font-variant-numeric:tabular-nums;}
#ddi-room-settings .game .score strong{font-size:21px;font-weight:500;}
#ddi-room-settings .game .field{height:510px;position:relative;margin-top:12px;background:linear-gradient(90deg,transparent 24.7%,#ffffff06 25%,transparent 25.3%,transparent 49.7%,#ffffff06 50%,transparent 50.3%,transparent 74.7%,#ffffff06 75%,transparent 75.3%);}
#ddi-room-settings .game .note{position:absolute;left:calc(var(--lane)*25%);width:25%;display:flex;align-items:center;justify-content:center;height:44px;color:var(--pink);pointer-events:none;}
#ddi-room-settings .game .note svg{width:42px;height:42px;stroke-width:2.3;}
#ddi-room-settings .game .note.blue{color:var(--blue);}
#ddi-room-settings .game .note.mine{color:var(--amber);}
#ddi-room-settings .game .note.mine svg{width:30px;height:30px;}
#ddi-room-settings .game .note.receptor{color:var(--dim);}
#ddi-room-settings .game .judgment{position:absolute;top:215px;left:0;right:0;text-align:center;pointer-events:none;}
#ddi-room-settings .game .judgment strong{font-size:25px;font-weight:800;letter-spacing:-1px;display:block;text-shadow:0 2px 8px var(--bg);}
#ddi-room-settings .game .judgment .combo{font-size:44px;font-weight:500;line-height:1.2;text-shadow:1px 0 var(--pink),-1px 0 var(--pink),0 1px var(--pink),0 -1px var(--pink);}
#ddi-room-settings .game .watermark{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:14px;letter-spacing:1px;color:#ffffff20;}
#ddi-room-settings .game .weapons{grid-column:3;grid-row:1;min-width:0;position:relative;height:642px;width:min(100%,165px);}
#ddi-room-settings .game .incoming{position:absolute;top:108px;left:0;right:0;display:grid;gap:9px;padding-left:12px;border-left:2px solid var(--amber);}
#ddi-room-settings .game .incoming strong{font-size:32px;font-weight:500;line-height:1;}
#ddi-room-settings .game .incoming .strength{display:flex;align-items:baseline;gap:8px;}
#ddi-room-settings .game .incoming .weakened{color:var(--mint);font-size:12px;}
#ddi-room-settings .game .incoming.calm{border-left-color:var(--line);color:var(--dim);}
#ddi-room-settings .game .power{position:absolute;left:0;right:0;bottom:12px;display:grid;gap:8px;padding-left:12px;}
#ddi-room-settings .game .power-label{display:flex;justify-content:space-between;gap:6px;font-size:12px;}
#ddi-room-settings .game .power-track{height:6px;background:var(--raised);}
#ddi-room-settings .game .power-track span{display:block;height:100%;background:var(--pink);}
#ddi-room-settings .game .power-track.full span{background:var(--ink);}
#ddi-room-settings .game .reverse .incoming{top:430px;}
#ddi-room-settings .game .reverse .power{top:80px;bottom:auto;}
#ddi-room-settings .game .footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;border-top:1px solid var(--line);padding-top:16px;min-height:60px;}
#ddi-room-settings .game .frozen .field{opacity:.18;}
#ddi-room-settings .game .outcome{position:absolute;left:-12px;right:-12px;top:230px;text-align:center;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 12px;display:grid;gap:16px;}
#ddi-room-settings .game .outcome strong{font-size:42px;font-weight:500;}
#ddi-room-settings .game .outcome .row{justify-content:center;}
#ddi-room-settings .game .winner-mark{text-align:center;color:var(--mint);padding:10px 0;}
#ddi-room-settings .game .unavailable{height:510px;display:grid;align-content:center;text-align:center;gap:12px;}
#ddi-room-settings .game .overlay{position:absolute;inset:0;background:#09070be8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5;}
#ddi-room-settings .game .dialog{width:min(100%,470px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:20px;}
#ddi-room-settings .game .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
#ddi-room-settings .game .facts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;}
#ddi-room-settings .game .facts span:nth-child(odd){color:var(--dim);}
#ddi-room-settings .game .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
@media(max-width:760px){#ddi-room-settings .game{min-height:1600px;padding:20px;}#ddi-room-settings .game .arena{grid-template-columns:1fr;gap:20px;}#ddi-room-settings .game .field-wrap{grid-column:1;grid-row:2;width:min(100%,288px);justify-self:center;}#ddi-room-settings .game .weapons{grid-column:1;grid-row:1;position:static;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(100%,480px);height:auto;min-height:150px;justify-self:center;}#ddi-room-settings .game .incoming,#ddi-room-settings .game .power,#ddi-room-settings .game .reverse .incoming,#ddi-room-settings .game .reverse .power{position:static;align-content:start;}#ddi-room-settings .game .reverse .weapons{grid-row:3;}#ddi-room-settings .game .people{grid-column:1;grid-row:4;width:100%;justify-self:stretch;padding-top:0;}#ddi-room-settings .game .roster{grid-template-columns:repeat(2,minmax(0,1fr));}#ddi-room-settings .game .population{margin-bottom:12px;}#ddi-room-settings .game .header{padding-right:70px;}#ddi-room-settings .game .song-header{text-align:left;}#ddi-room-settings .game.has-overlay .arena,#ddi-room-settings .game.has-overlay .footer{display:none;}#ddi-room-settings .game .overlay{position:static;padding:0;background:var(--bg);}}
@media(max-width:420px){#ddi-room-settings .game{padding:16px;min-height:1600px;}#ddi-room-settings .game .header{grid-template-columns:1fr;padding-right:80px;}#ddi-room-settings .game .dialog{padding:18px;}#ddi-room-settings .game .outcome{left:0;right:0;}#ddi-room-settings .game .incoming strong{font-size:28px;}}
@media(pointer:coarse){#ddi-room-settings .game button{min-height:44px;}}
#ddi-room-settings .game .roster-label{display:flex;justify-content:space-between;padding:0 9px 8px;font-size:11px;color:var(--dim);}

<script>
(()=>{
const root=document.getElementById('ddi-room-settings'),nodes=[...root.querySelectorAll('[data-view]')],states={};
const songs=[{title:'Paper Satellites',artist:'Soft Signal',meter:9,a:'#5a667e',b:'#b27891'},{title:'Signal Bloom',artist:'Glass Current',meter:10,a:'#356756',b:'#8871a0'},{title:'Night Current',artist:'Parallel Lines',meter:11,a:'#344c79',b:'#a65b7c'},{title:'Violet Line',artist:'Low Orbit',meter:10,a:'#785986',b:'#47848a'},{title:'Glass Orchard',artist:'Twin Echo',meter:8,a:'#68734c',b:'#60818c'},{title:'Neon Steps',artist:'Pulse Index',meter:12,a:'#79619c',b:'#9f6556'}];
const names=['Mira','Kai','Sol','Jules','Rin','Ash','Cleo','Rae'],bots=['Quartz','Arc','Orbit','Lumen','Echo','Flux','Nova'];
const base=()=>({defense:'Weakening',returns:true,late:false,stages:4,capacity:8,cpuMode:'Off',cpuCount:2,profile:'Regular',mines:'Typical'});
const copy=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(label,action,cls='',disabled=false,aria='')=>`<button type="button" class="cursor-interaction ${cls}" data-action="${action}" ${disabled?'disabled':''} ${aria?`aria-label="${aria}"`:''}>${label}</button>`;
const active=s=>['Playing','Intermission'].includes(s.phase);
const operator=s=>['Host','Co-host','Admin'].includes(s.role);
const host=s=>s.role==='Host';
const playingHumanReady=s=>s.otherReady||['Host','Player'].includes(s.role)&&s.ready;
function preset(r){return r.defense==='Weakening'&&r.returns&&!r.late?'Standard Battle':'Custom Battle';}
function cpuNumber(r,humans){return r.cpuMode==='Fill'?Math.max(0,r.capacity-humans):r.cpuMode==='Fixed'?r.cpuCount:0;}
function defaults(k){const current=base();if(k!=='create')current.cpuMode='Fill';const running=['locked','next'].includes(k);const s={route:k==='create'?'create':'room',phase:running?'Playing':k==='between'?'Between matches':'Before match',role:'Host',humans:k==='create'?1:3,frozenHumans:3,current,pending:null,previous:null,draft:null,scope:'current',overlay:'',name:'After Hours',visibility:k==='access'?'Invite only':'Public',admission:true,inviteVersion:1,accessDraft:null,rotateConfirm:false,ready:k==='rules'?true:false,otherReady:k==='rules'?true:false,queue:k==='create'?[-1,-1,-1,-1]:[0,1,2,3],selected:running?2:0,candidate:0,sharesReady:true,deadline:false,advance:'Host',advanceDraft:'Host',stage:running?1:0,notice:'',lastChanges:[],studyEvent:'No update',accessReturn:'',snapshot:null};if(running)s.snapshot=copy(current);if(k==='between'){s.previous=copy(current);s.current={...base(),cpuMode:'Fill',defense:'Play-through',stages:3,profile:'Gentle'};s.queue=[0,1,2];s.notice='New match settings applied';s.lastChanges=changes(s.previous,s.current);}
if(k==='rules'){s.overlay='rules';s.draft=copy(s.current);}if(k==='cpus'){s.overlay='cpus';s.draft=copy(s.current);}if(k==='access'){s.overlay='access';s.accessDraft={name:s.name,visibility:s.visibility,admission:s.admission,rotate:false};}if(k==='locked')s.overlay='rules';if(k==='next'){s.overlay='rules';s.scope='next';s.draft={...copy(current),defense:'Play-through',profile:'Gentle',stages:3};}return s;}
const labels={defense:'Defense',returns:'Return each stage',late:'Entry during match',stages:'Stages',capacity:'Playing seats',cpuMode:'CPU seats',cpuCount:'CPU count',profile:'CPU skill',mines:'Mine sensitivity'};
function value(k,v){return k==='returns'?(v?'On':'Off'):k==='late'?(v?'Next stage':'Off'):k==='cpuMode'&&v==='Fill'?'Fill open seats':String(v);}
function changes(a,b){return Object.keys(labels).filter(k=>a[k]!==b[k]&&(k!=='cpuCount'||a.cpuMode==='Fixed'||b.cpuMode==='Fixed')).map(k=>({key:k,label:labels[k],from:value(k,a[k]),to:value(k,b[k])}));}
function valid(r,s){if(!r.returns&&r.late)return 'Turn off mid-match entry when elimination carries across stages.';if(r.capacity<s.humans)return `${s.humans} players already have seats. Raise the limit or manage their seats first.`;if(r.cpuMode==='Fixed'&&s.humans+r.cpuCount>r.capacity)return `${s.humans} humans + ${r.cpuCount} CPUs exceed ${r.capacity} seats.`;return '';}
function safeRules(o,fallback){const r=copy(fallback);if(!o||typeof o!=='object')return r;for(const[k,opts]of Object.entries({defense:['Weakening','Play-through'],cpuMode:['Off','Fixed','Fill'],profile:['Gentle','Regular','Challenging'],mines:['Low','Typical','High']}))if(opts.includes(o[k]))r[k]=o[k];for(const k of ['returns','late'])if(typeof o[k]==='boolean')r[k]=o[k];for(const[k,min,max]of [['stages',1,8],['capacity',2,8],['cpuCount',1,7]])if(Number.isInteger(o[k])&&o[k]>=min&&o[k]<=max)r[k]=o[k];return r;}
function restore(s,o){if(!o||typeof o!=='object')return;for(const[k,opts]of Object.entries({route:['create','room'],phase:['Before match','Playing','Intermission','Between matches'],role:['Host','Co-host','Admin','Player','Waiting'],visibility:['Public','Invite only'],advance:['Host','Automatic']}))if(opts.includes(o[k]))s[k]=o[k];for(const k of ['admission','ready','otherReady','sharesReady','deadline'])if(typeof o[k]==='boolean')s[k]=o[k];if(Number.isInteger(o.humans)&&o.humans>=1&&o.humans<=8)s.humans=o.humans;if(typeof o.name==='string')s.name=o.name.slice(0,60);if(Number.isInteger(o.inviteVersion)&&o.inviteVersion>0&&o.inviteVersion<1000)s.inviteVersion=o.inviteVersion;if(Number.isInteger(o.frozenHumans)&&o.frozenHumans>=1&&o.frozenHumans<=8)s.frozenHumans=o.frozenHumans;s.current=safeRules(o.current,base());s.pending=o.pending?safeRules(o.pending,s.current):null;s.previous=o.previous?safeRules(o.previous,base()):null;s.snapshot=active(s)?copy(s.current):null;if(Array.isArray(o.queue)&&o.queue.length===s.current.stages&&o.queue.every(n=>Number.isInteger(n)&&n>=-1&&n<songs.length))s.queue=o.queue.slice();else s.queue=Array(s.current.stages).fill(-1);s.selected=Math.min(s.queue.length-1,Math.max(0,Number(o.selected)||0));s.stage=Math.min(s.queue.length-1,Math.max(0,Number(o.stage)||0));s.overlay='';s.draft=null;s.scope='current';s.notice='';s.studyEvent='No update';}
for(const node of nodes){const s=states[node.dataset.view]=defaults(node.dataset.view);const old=window.openai?.widgetState?.privateContent;if(old?.version===1)restore(s,old.views?.[node.dataset.view]);}
function save(node){const s=states[node.dataset.view];const views={};for(const[k,v]of Object.entries(states))views[k]={...v,draft:null,accessDraft:null,overlay:'',lastChanges:[],snapshot:null};window.openai?.setWidgetState?.({modelContent:{view:node.dataset.view,phase:s.phase,role:s.role,visibility:s.visibility,current:s.current,nextMatch:s.pending},privateContent:{version:1,views}})?.catch(()=>{});}
const get=node=>states[node.dataset.view];
function dirty(s){return !!s.draft&&changes(s.scope==='next'?(s.pending||s.current):s.current,s.draft).length>0;}
function openRules(s,type='rules',scope='current'){s.overlay=type;s.scope=scope;s.draft=operator(s)&&(!active(s)||scope==='next')?copy(scope==='next'?(s.pending||s.current):s.current):null;}
function control(s,key,options,r){return `<select data-field="${key}" aria-label="${labels[key]}">${options.map(v=>`<option value="${v}" ${r[key]===v?'selected':''}>${esc(value(key,v))}</option>`).join('')}</select>`;}
function field(s,key,options,r,ref){return `<label class="config-field ${r[key]!==ref[key]?'changed':''}"><span>${labels[key]}</span>${control(s,key,options,r)}</label>`;}
function check(s,key,r,ref,note=''){return `<label class="toggle-row ${r[key]!==ref[key]?'changed':''}"><span>${labels[key]}${note?`<small>${note}</small>`:''}</span><input type="checkbox" data-field="${key}" ${r[key]?'checked':''} aria-label="${labels[key]}"></label>`;}
function diffHtml(list){return list.length?`<div class="changes" aria-label="Changed settings">${list.map(c=>`<div class="change-row"><span>${c.label}</span><del>${esc(c.from)}</del>${icon('arrow-right')}<ins>${esc(c.to)}</ins></div>`).join('')}</div>`:'';}
function create(node){const s=get(node);return `<div class="end-shell"><header class="settings-head"><h2>Create room</h2><span class="small muted">${icon('user')} Mira</span></header><main class="create-form"><label class="config-field"><span>Room name</span><input data-input="name" value="${esc(s.name)}" maxlength="60" placeholder="Room name"></label><div class="config-field"><span>Visibility</span><div class="segments">${['Public','Invite only'].map(v=>`<button type="button" class="cursor-interaction" data-action="create-visibility-${v}" aria-pressed="${s.visibility===v}">${icon(v==='Public'?'globe':'lock')} ${v}</button>`).join('')}</div><small>${s.visibility==='Public'?'Listed in public rooms':'Join through an invite link'}</small></div><section class="create-summary">${button(`<span>${preset(s.current)}<small> · ${s.current.stages} stages</small></span>${icon('chevron-right')}`,'rules','quiet')}${button(`<span>${s.current.capacity} playing seats<small> · ${s.current.cpuMode==='Off'?'CPUs off':s.current.cpuMode==='Fill'?'CPU fill':s.current.cpuCount+' CPUs'}</small></span>${icon('chevron-right')}`,'cpus','quiet')}</section><div class="row">${button('Create room','create','primary',!s.name.trim())}</div><span class="hint">Songs are chosen in the room.</span></main></div>`;}
function room(node){const s=get(node),r=s.current,empty=s.queue[s.selected]===-1,song=empty?null:songs[s.queue[s.selected]],op=operator(s),live=active(s),members=names.slice(0,live?s.frozenHumans:s.humans),cpu=cpuNumber(r,live?s.frozenHumans:s.humans),canSong=op&&(!live||s.selected>s.stage||s.phase==='Intermission'&&s.selected>=s.stage);return `<div class="end-shell room-shell"><header class="settings-head"><div class="room-heading"><h2>${esc(s.name)}</h2>${button(icon(s.visibility==='Public'?'globe':'lock'),'access','quiet',false,s.visibility)}<span class="role-badge">${s.visibility}</span></div><div class="row">${button('Rules','rules')}${button(icon('ellipsis'),'more','quiet',false,'More room controls')}</div></header><div class="room-summary"><span class="scope-mark">${live?icon('lock'):icon('sliders-horizontal')}${preset(r)} · ${r.stages} stages</span><span class="small muted">${s.phase==='Playing'?'Stage '+(s.stage+1)+' / '+r.stages+' · Playing':s.phase==='Intermission'?'Intermission · Stage '+(s.stage+1)+' / '+r.stages:s.phase}</span></div><main class="room-grid"><section class="room-people" aria-label="Participants"><div class="people-count"><span class="small muted">${members.length+cpu} / ${r.capacity}</span>${button(icon('cpu'),'cpus','quiet',false,'CPU settings')}</div>${members.map((name,i)=>`<div class="person-line"><span class="who">${name}<small>${i===0?(s.role==='Host'?'Host · You':'Host'):i===1&&s.role==='Player'?'You':''}</small></span><span class="small muted">${live?[12,7,9,5,4,3,2,1][i]:((i===0&&s.role==='Host'||i===1&&s.role==='Player')?s.ready:s.otherReady)?icon('check'):icon('minus')}</span></div>`).join('')}${bots.slice(0,cpu).map(name=>`<div class="person-line"><span class="who">${name}<small>CPU</small></span><span class="small muted">${live?'4':icon('check')}</span></div>`).join('')}<span class="small muted">${cpu?r.profile+' CPUs':''}</span>${live&&s.humans>s.frozenHumans?'<div class="hint">Next match · '+names.slice(s.frozenHumans,s.humans).join(', ')+'</div>':''}${['Co-host','Admin','Waiting'].includes(s.role)?`<div class="person-line"><span class="who">${s.role==='Admin'?'Rowan':s.role==='Co-host'?'Quinn':'Nia'}<small>${s.role==='Admin'?'Admin · Watching':s.role==='Co-host'?'Co-host · Watching':'Next match'}</small></span></div>`:''}</section><section class="room-song">${song?`<div class="art" style="--a:${song.a};--b:${song.b}" aria-hidden="true"><span class="art-word">${song.title.toUpperCase()}</span></div><h3 class="song-title">${song.title}</h3><span class="small muted">${song.artist}</span><span class="small muted">142 BPM · 2:31</span><div class="chart-steps"><span>Easy 4</span><span>Medium 7</span><strong>Hard ${song.meter}</strong></div>`:`<div class="empty-song">${icon('music-2')}<span>Choose a song</span></div>`}${canSong?button(song?'Change song':'Choose song','library','quiet'):''}<span class="small muted">${song?s.sharesReady?icon('check')+' Songs available':icon('download')+' Sharing songs':''}</span></section><section class="song-wheel" aria-label="Match songs">${s.queue.map((index,i)=>songRow(index,i,s)).join('')}</section></main>${s.pending?`<section class="pending-strip"><span>${icon('calendar-clock')} Next match · ${changes(s.current,s.pending).length} changes</span>${button('Review','next','quiet')}</section>`:''}<div class="status-note ${s.notice?'important':''}" role="status">${esc(s.notice)}</div>${!live&&(s.queue.includes(-1)||!s.sharesReady||valid(r,s)||members.length+cpu<2)?`<p class="hint">${valid(r,s)|| (s.queue.includes(-1)?'Choose the remaining songs':!s.sharesReady?'Waiting for song sharing':'At least two players · Invite someone or add a CPU')}</p>`:''}<footer class="end-foot"><div class="row">${s.previous?button('Last match','last','quiet'):''}<span class="hint">${s.deadline?'Readiness window active':s.advance==='Automatic'?s.phase==='Playing'?'Automatic after this stage':'Automatic advance':'Host advances'}</span></div><div class="row">${!['Co-host','Admin','Waiting'].includes(s.role)&&s.phase!=='Playing'?button(s.ready?icon('check')+' Ready':'Ready','ready',s.ready?'':'primary'):''}${op&&!live?button('Start match','start','',!!valid(r,s)||s.queue.includes(-1)||!s.sharesReady||s.humans+cpu<2||s.pending!==null):''}${op&&s.phase==='Intermission'?button('Start stage','start-stage','',!s.sharesReady||s.queue[s.stage]===-1):''}</div></footer></div>`;}
function songRow(index,i,s,library=false){const song=index<0?null:songs[index],selected=library?s.candidate===index:s.selected===i;return `<button type="button" class="song-row cursor-interaction ${selected?'selected':''}" data-action="${library?'candidate-'+index:'song-'+i}" aria-pressed="${selected}" style="--drift:${library?0:Math.min(18,Math.abs(i-s.selected)*8)}px;--a:${song?.a||'#35303b'};--b:${song?.b||'#49414e'}"><span class="thumb ${song?'':'empty'}">${library?'':i+1}</span><span><span class="title">${song?song.title:'Choose song'}</span><small>${song?song.artist:'Not selected'}</small></span><span class="meter">${song?song.meter:icon('plus')}</span></button>`;}
function rulesBody(s,onlyCpu){const editable=!!s.draft&&operator(s),r=s.draft||(s.scope==='next'?(s.pending||s.current):s.current),ref=s.current,scope=s.scope==='next'?'Next match':active(s)?'Current match':'Upcoming match';let body=`<div class="preset-line"><strong>${preset(r)}</strong><span class="scope-mark ${s.scope==='next'?'planned':''}">${icon(editable?'pencil':'lock')}${scope}</span></div>`;
if(!editable){body+=`<div class="settings-grid"><section class="settings-group"><h3>Battle & match</h3>${[['Attacks','Mines'],['Defense',r.defense],['Return each stage',r.returns?'On':'Off'],['Entry during match',r.late?'Next stage':'Off'],['Stages',r.stages],['Ranking',r.returns?'Stage points':'Survival placement']].map(([k,v])=>`<div class="setting-value"><span>${k}</span><span>${v}</span></div>`).join('')}</section><section class="settings-group"><h3>Players & CPUs</h3>${[['Playing seats',r.capacity],['CPU seats',value('cpuMode',r.cpuMode)],['CPU count',cpuNumber(r,active(s)&&s.scope==='current'?s.frozenHumans:s.humans)],['Skill profile',r.profile],['Mine sensitivity',r.mines]].map(([k,v])=>`<div class="setting-value"><span>${k}</span><span>${v}</span></div>`).join('')}</section></div>${s.scope==='next'?diffHtml(changes(s.current,r)):''}<div class="dialog-foot"><span class="hint">${active(s)?'Locked until the match ends':operator(s)?'Upcoming match':'Host controls match settings'}</span><div class="row">${operator(s)&&active(s)&&s.scope!=='next'?button('Prepare next match','edit-next','primary'):''}${s.scope==='current'&&s.pending?button('Next match','view-next'):s.scope==='next'?button('Current match','view-current','quiet'):''}${button('Close','close','quiet')}</div></div>`;return body;}
body+=`<div class="settings-grid">${!onlyCpu?`<section class="settings-group"><h3>Battle</h3><div class="setting-value"><span>Attacks</span><span>Mines</span></div>${field(s,'defense',['Weakening','Play-through'],r,ref)}${check(s,'returns',r,ref)}<span class="hint">${r.returns?'Standings use stage points.':'Eliminated players wait until the next match. Ranking follows survival.'}</span><details ${r.late||!r.returns?'open':''}><summary class="cursor-interaction">More rules</summary><div>${check(s,'late',r,ref,'New entrants start between songs; earlier stages earn zero.')}</div></details>${button('Reset battle rules','reset-battle','quiet')}</section>`:''}<section class="settings-group"><h3>${onlyCpu?'Seats':'Match'}</h3>${!onlyCpu?field(s,'stages',[1,2,3,4,5,6,7,8],r,ref):''}${field(s,'capacity',[2,3,4,5,6,7,8],r,ref)}<div class="cpu-preview">${icon('users')}${s.humans} humans ${icon('cpu')}${cpuNumber(r,s.humans)} CPUs</div></section><section class="settings-group"><h3>CPU seats</h3>${field(s,'cpuMode',['Off','Fixed','Fill'],r,ref)}${r.cpuMode==='Fixed'?field(s,'cpuCount',[1,2,3,4,5,6,7],r,ref):''}<span class="hint">${r.cpuMode==='Fill'?'Open playing seats become CPUs when the roster locks. Humans may take them before the match.':r.cpuMode==='Fixed'?'A fixed number of CPUs shares the playing-seat limit.':'No CPU opponents.'}</span></section>${r.cpuMode!=='Off'?`<section class="settings-group"><h3>CPU behavior</h3>${field(s,'profile',['Gentle','Regular','Challenging'],r,ref)}${field(s,'mines',['Low','Typical','High'],r,ref)}<span class="hint">Higher mine sensitivity means more disruption from mines.</span></section>`:''}</div>${s.scope==='next'?diffHtml(changes(s.current,r))+button('Use current rules','use-current','quiet'):''}${valid(r,s)?`<p class="error-note" role="alert">${valid(r,s)}</p>`:''}<div class="dialog-foot"><span class="hint">${s.scope==='next'?'Current match and readiness stay unchanged.':s.route==='create'?'Used when the room is created.':'Applying changes clears readiness.'}</span><div class="row">${button('Cancel','close','quiet')}${button(s.scope==='next'?'Save for next match':'Apply','apply-rules','primary',!!valid(r,s)||!dirty(s))}</div></div>`;return body;}
function accessBody(s){if(!host(s))return `<div class="facts"><span>Visibility</span><span>${s.visibility}</span><span>New arrivals</span><span>${s.admission?'Open':'Closed'}</span></div><p class="hint">Room access is controlled by the host.</p>`;const a=s.accessDraft;return `<label class="config-field"><span>Room name</span><input data-access="name" value="${esc(a.name)}" maxlength="60"></label><div class="config-field"><span>Visibility</span><div class="segments">${['Public','Invite only'].map(v=>`<button type="button" class="cursor-interaction" data-action="visibility-${v}" aria-pressed="${a.visibility===v}">${icon(v==='Public'?'globe':'lock')} ${v}</button>`).join('')}</div><small>${a.visibility==='Public'?'Listed in public rooms':'Hidden from public rooms · Invite link required'}</small></div><label class="toggle-row"><span>New arrivals<small>Existing members stay in the room.</small></span><input type="checkbox" data-access="admission" ${a.admission?'checked':''}></label><label class="config-field"><span>${a.rotate?'New invite link · applies on save':'Invite link'}</span><input readonly aria-label="Invite link" value="https://example.test/#/room/after-hours-${s.inviteVersion+(a.rotate?1:0)}"></label>${s.rotateConfirm?`<div class="config-field"><span>Stop accepting the old invite link?</span><div class="row">${button('Keep link','keep-link','quiet')}${button('Replace link','confirm-rotate')}</div></div>`:button(a.rotate?'Undo link replacement':'Replace invite link',a.rotate?'undo-rotate':'rotate','quiet')}<div class="dialog-foot"><span class="hint">Applies to room access now.</span><div class="row">${button('Cancel','close','quiet')}${button('Save access','save-access','primary',!a.name.trim())}</div></div>`;}
function modal(node){const s=get(node);if(!s.overlay)return '';let title='',body='',wide=false;
if(s.overlay==='rules'||s.overlay==='cpus'){title=s.overlay==='rules'?'Rules':'CPU settings';body=rulesBody(s,s.overlay==='cpus');wide=true;}
else if(s.overlay==='access'){title='Room access';body=accessBody(s);}
else if(s.overlay==='more'){title='Room';body=`<div class="row">${host(s)?button('Room access','access'):''}${operator(s)?button('Advancement','advance'):''}${button('Rules','rules')}${s.pending?button('Next match','view-next'):''}${s.previous?button('Last match','last'):''}</div>`;}
else if(s.overlay==='advance'){title='Advancement';body=operator(s)?`<label class="config-field"><span>Advance stages</span><select data-input="advanceDraft"><option ${s.advanceDraft==='Host'?'selected':''}>Host</option><option ${s.advanceDraft==='Automatic'?'selected':''}>Automatic</option></select></label><p class="hint">${s.phase==='Playing'?'Takes effect after this stage. The song keeps playing.':'Automatic advancement requires prepared songs and a ready human.'}</p>${!s.sharesReady&&s.advanceDraft==='Automatic'?'<p class="error-note">Finish sharing the remaining songs first.</p>':''}<div class="dialog-foot">${button('Cancel','close','quiet')}${button('Apply','save-advance','primary',s.advanceDraft==='Automatic'&&(!s.sharesReady||s.queue.includes(-1)))}</div>`:'<p class="hint">Host or co-host controls advancement.</p>';}
else if(s.overlay==='library'){title='Choose song';wide=true;body=`<div class="library-list">${songs.map((_,i)=>songRow(i,i,s,true)).join('')}</div><div class="dialog-foot"><span class="hint">Stage ${s.selected+1}</span>${button('Use song','use-song','primary')}</div>`;}
else if(s.overlay==='discard'){title='Discard changes?';body=`<p class="hint">Unsaved settings will be lost.</p><div class="row">${button('Keep editing','keep-editing','primary')}${button('Discard','discard')}</div>`;}
else if(s.overlay==='last'){title='Last match';body=`<span class="scope-mark">${preset(s.previous||base())} · ${(s.previous||base()).stages} stages</span><div class="facts"><span>Mira</span><span>40 pts</span><span>Sol</span><span>37 pts</span><span>Kai</span><span>35 pts</span></div><span class="hint">Completed results stay unchanged.</span>`;}
return `<div class="overlay"><section class="dialog ${wide?'settings-dialog':'small-dialog'}" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog-head"><h2>${title}</h2>${button(icon('x'),'close','quiet',false,'Close')}</div>${body}</section></div>`;}
function render(node){const s=get(node);node.innerHTML=(s.route==='create'?create(node):room(node))+modal(node);node.classList.toggle('has-overlay',!!s.overlay);for(const child of [...node.children])if(!child.classList.contains('overlay'))child.inert=!!s.overlay;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function reshapeQueue(s,count){s.queue=s.queue.slice(0,count);while(s.queue.length<count)s.queue.push(-1);s.selected=Math.min(s.selected,count-1);}
function applyRules(s){if(!operator(s)||!s.draft||valid(s.draft,s))return;if(active(s)&&s.scope!=='next')return;if(s.scope==='next'&&active(s)){s.pending=changes(s.current,s.draft).length?copy(s.draft):null;s.notice=s.pending?'Settings saved for the next match':'Next-match changes cleared';}else{const edits=changes(s.current,s.draft);s.current=copy(s.draft);reshapeQueue(s,s.current.stages);if(edits.length){s.ready=false;s.otherReady=false;s.deadline=false;s.notice='Rules updated · Ready again';}s.pending=null;}s.overlay='';s.draft=null;}
function finishMatch(s){s.previous=copy(s.current);s.phase='Between matches';s.stage=0;s.ready=false;s.otherReady=false;s.deadline=false;s.snapshot=null;if(s.pending&&!valid(s.pending,s)){s.lastChanges=changes(s.current,s.pending);s.current=copy(s.pending);s.pending=null;reshapeQueue(s,s.current.stages);s.notice='New match settings applied';}else if(s.pending){s.notice='Next-match settings need review · '+valid(s.pending,s);}else{s.notice='Match finished · Ready for another match';}}
function close(s){if(s.draft&&dirty(s)&&['rules','cpus'].includes(s.overlay)){s.accessReturn=s.overlay;s.overlay='discard';return;}s.overlay='';s.draft=null;s.accessDraft=null;s.rotateConfirm=false;}
function act(node,a){const s=get(node);if(a==='create'&&s.name.trim()&&!valid(s.current,s)){s.route='room';s.ready=false;s.notice=s.visibility==='Public'?'Room created · Public':'Room created · Invite only';}else if(a.startsWith('create-visibility-')&&s.route==='create'){s.visibility=a.slice(18);}else if(a==='rules'||a==='cpus')openRules(s,a);else if(['next','edit-next','view-next'].includes(a)){openRules(s,'rules','next');}else if(a==='view-current')openRules(s,'rules','current');else if(a==='apply-rules')applyRules(s);else if(a==='use-current'&&operator(s)&&s.scope==='next'&&s.draft)s.draft=copy(s.current);else if(a==='reset-battle'&&s.draft){s.draft.defense='Weakening';s.draft.returns=true;s.draft.late=false;}else if(a==='access'){s.overlay='access';s.accessDraft={name:s.name,visibility:s.visibility,admission:s.admission,rotate:false};s.rotateConfirm=false;}else if(a.startsWith('visibility-')&&host(s)&&s.accessDraft)s.accessDraft.visibility=a.slice(11);else if(a==='rotate'&&host(s))s.rotateConfirm=true;else if(a==='keep-link')s.rotateConfirm=false;else if(a==='confirm-rotate'&&host(s)&&s.accessDraft){s.accessDraft.rotate=true;s.rotateConfirm=false;}else if(a==='undo-rotate'&&host(s)&&s.accessDraft)s.accessDraft.rotate=false;else if(a==='save-access'&&host(s)&&s.accessDraft?.name.trim()){s.name=s.accessDraft.name.trim();s.visibility=s.accessDraft.visibility;s.admission=s.accessDraft.admission;if(s.accessDraft.rotate)s.inviteVersion++;s.overlay='';s.accessDraft=null;s.notice='Room access updated';}else if(a==='more')s.overlay='more';else if(a==='advance'&&operator(s)){s.advanceDraft=s.advance;s.overlay='advance';}else if(a==='save-advance'&&operator(s)&&!(s.advanceDraft==='Automatic'&&(!s.sharesReady||s.queue.includes(-1)))){s.advance=s.advanceDraft;s.overlay='';s.notice=s.phase==='Playing'?'Advancement changes after this stage':'Advancement updated';}else if(a.startsWith('song-'))s.selected=Number(a.slice(5));else if(a==='library'&&operator(s)&&(!active(s)||s.selected>s.stage||s.phase==='Intermission'&&s.selected>=s.stage)){s.candidate=Math.max(0,s.queue[s.selected]);s.overlay='library';}else if(a.startsWith('candidate-'))s.candidate=Number(a.slice(10));else if(a==='use-song'&&operator(s)&&(!active(s)||s.selected>s.stage||s.phase==='Intermission'&&s.selected>=s.stage)){s.queue[s.selected]=s.candidate;s.sharesReady=false;s.overlay='';if(s.phase!=='Playing'){s.ready=false;s.otherReady=false;s.deadline=false;}s.notice='Stage '+(s.selected+1)+' song changed'+(s.phase==='Playing'?' · Current stage continues':' · Ready again');}else if(a==='ready'&&!['Co-host','Admin','Waiting'].includes(s.role)&&s.phase!=='Playing')s.ready=!s.ready;else if(a==='start'&&operator(s)&&!active(s)&&!valid(s.current,s)&&!s.queue.includes(-1)&&s.sharesReady&&!s.pending&&s.humans+cpuNumber(s.current,s.humans)>=2){s.deadline=true;s.notice='Readiness window opened';}else if(a==='start-stage'&&operator(s)&&s.phase==='Intermission'){s.deadline=true;s.notice='Readiness window opened';}else if(a==='last')s.overlay='last';else if(a==='close')close(s);else if(a==='keep-editing')s.overlay=s.accessReturn||'rules';else if(a==='discard'){s.overlay='';s.draft=null;}
render(node);save(node);if(s.overlay){if(a!=='close')node.returnAction=a;node.querySelector('[data-action="close"]')?.focus();}else if(node.returnAction)node.querySelector('[data-action="'+node.returnAction+'"]')?.focus();}
function update(node,target){const s=get(node),key=target.dataset.field;if(key&&s.draft&&operator(s)){s.draft[key]=['returns','late'].includes(key)?target.checked:['stages','capacity','cpuCount'].includes(key)?Number(target.value):target.value;}else if(target.dataset.access&&host(s)&&s.accessDraft){const k=target.dataset.access;s.accessDraft[k]=k==='admission'?target.checked:target.value.slice(0,60);}else if(target.dataset.input==='name'&&s.route==='create')s.name=target.value.slice(0,60);else if(target.dataset.input==='advanceDraft'&&operator(s))s.advanceDraft=target.value;render(node);save(node);}
for(const node of nodes){render(node);node.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(node,b.dataset.action);});node.addEventListener('change',e=>update(node,e.target));node.addEventListener('input',e=>{if(e.target.type!=='text'&&e.target.tagName!=='INPUT'||e.target.type==='checkbox'||e.target.readOnly)return;const pos=e.target.selectionStart,kind=e.target.dataset.access?'access':'input',key=e.target.dataset[kind];if(!key)return;update(node,e.target);const input=node.querySelector('[data-'+kind+'="'+key+'"]');input?.focus();if(input&&Number.isInteger(pos))input.setSelectionRange(pos,pos);});node.addEventListener('keydown',e=>{if(e.key==='Escape'&&get(node).overlay){act(node,'close');e.preventDefault();}if(e.key==='Tab'&&get(node).overlay){const items=[...node.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog select,.dialog summary')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){last?.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first?.focus();e.preventDefault();}}});
if(globalThis.Tweak){const s=get(node);const t=new Tweak({container:node,onChange:()=>{if(!operator(s))s.draft=null;const e=s.studyEvent;s.studyEvent='No update';if(e==='Match starts'&&!active(s)&&!valid(s.current,s)&&!s.queue.includes(-1)&&s.sharesReady&&playingHumanReady(s)&&s.humans+cpuNumber(s.current,s.humans)>=2&&!s.pending){s.phase='Playing';s.stage=0;s.snapshot=copy(s.current);s.frozenHumans=s.humans;s.deadline=false;s.ready=false;s.otherReady=false;if(s.scope!=='next'){if(s.draft&&dirty(s)){s.scope='next';s.notice='Match started · These edits are for the next match';}else{s.draft=null;s.scope='current';}}}else if(e==='Intermission'&&s.phase==='Playing'){if(s.stage+1>=s.current.stages){finishMatch(s);s.overlay='';s.draft=null;}else{s.phase='Intermission';s.stage++;s.selected=s.stage;s.ready=false;s.otherReady=false;}}else if(e==='Match ends'&&active(s)){finishMatch(s);s.overlay='';s.draft=null;}if(!host(s))s.accessDraft=null;else if(s.overlay==='access'&&!s.accessDraft)s.accessDraft={name:s.name,visibility:s.visibility,admission:s.admission,rotate:false};if(operator(s)&&['rules','cpus'].includes(s.overlay)&&!s.draft&&(!active(s)||s.scope==='next'))s.draft=copy(s.scope==='next'?(s.pending||s.current):s.current);render(node);save(node);}});if(node.dataset.view!=='create')t.addSelect(s,'role',{label:'View as',options:['Host','Co-host','Admin','Player','Waiting']});t.addSelect(s,'studyEvent',{label:'Simulate match boundary',options:['No update','Match starts','Intermission','Match ends']});t.addSlider(s,'humans',{label:active(s)?'Humans for next match':'Humans with playing seats',min:1,max:8,step:1});t.addToggle(s,'sharesReady',{label:'Remaining songs shared'});}}
window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(data?.version!==1)return;for(const node of nodes){restore(get(node),data.views?.[node.dataset.view]);render(node);}});
})();
