# The announcer kokoro.py's `pack` makes: every line the game speaks
# (docs/announcer-lines.md), each text a variant the game picks among in
# a shuffle. Made with Kokoro-82M (Apache-2.0), ours to release as CC0;
# the same bytes again from the same file. See README.md.
#
#     uv run tools/announcer-design/kokoro.py pack
#
# The texts never name a grade's letter or a judgment: the game maps
# every ruleset's grades onto StepMania's seven by place, and names
# judgments by ruleset, so a line says how it went, not what it is called.

name = "Mr. Clank"
# One of Kokoro's voices, or a blend of their styles by weight, e.g.
# { bm_george = 0.8, bm_lewis = 0.2 }.
voice = "bm_george"
speed = 1
# "lead": each line said after a lead, which is cut off (Kokoro is weakest
# on utterances this short, and how it says the lead carries into the
# line); "plain": each line on its own. A [[line]] may set its own
# `style`, and its own `lead` (which puts it in the lead style). A folder
# may be given in several [[line]]s, its sounds theirs together: the same
# text after two leads, say.
style = "lead"

# A lead for each place the game speaks, by a folder's first word, to set
# its tone; or one for every line, as `lead = "Alright, everybody.…"`
# above. The cut goes in the pause between lead and line, so end the lead
# as a sentence ends, . or !: George pauses 150–250 ms there. A … after
# it (said as a trailing pause) makes that a little longer and steadier;
# without . or !, a lead runs into its line, or … alone may.
[lead]
select = "Hey there, welcome back.…"
gameplay = "Oh yeah, here we go!…"
evaluation = "And the results are in.…"

[kokoro]
repo = "onnx-community/Kokoro-82M-v1.0-ONNX"
revision = "1939ad2a8e416c0acfeecc08a694d14ef25f2231"
model = "onnx/model.onnx"

# Words Kokoro's dictionary lacks, in misaki's phonemes (none yet: it
# says "DDI" as its letters).
[kokoro.words]

# --- On song select --------------------------------------------------------

[[line]]
folder = "select music intro"  # each time song select shows, after a play too
texts = [
  "Welcome to DDI!",
  "This is DDI. Pick a song!",
  "Pick a song!",
  "What shall we dance to?",
  "Choose your next song.",
  "Let's find something to dance to.",
]

[[line]]
folder = "select music comment general"  # a chart chosen
texts = [
  "Good choice!",
  "Nice pick.",
  "Ooh, I like this one.",
  "Let's do it!",
  "Sounds good to me!",
]

[[line]]
folder = "select music comment new"  # never played under these rules
texts = [
  "Something new! Let's see what you've got.",
  "A first time for everything!",
  "Never played this one? Let's find out!",
  "Fresh territory!",
]

[[line]]
folder = "select music comment repeat"  # played in this run
texts = [
  "Back for another go?",
  "This one again? Let's nail it!",
  "Round two!",
  "Once more, with feeling!",
]

[[line]]
folder = "select music comment hard"  # meter 10 or more
texts = [
  "Ooh, a tough one!",
  "Brave choice!",
  "That's a hard one. Good luck!",
  "Feeling bold today?",
  "Now that's a challenge!",
]

