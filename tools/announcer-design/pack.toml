# Ours: as the last note keeps a full combo, of its kind (w1: nothing
# worse than the first judgment), then `cleared`. A kind without its own
# says `gameplay full combo` (w4's, where the rules keep a combo on it).
[[line]]
folder = "gameplay full combo w1"
texts = ["Perfection! Every single step!", "Absolutely flawless!", "Not one step out of place!"]

[[line]]
folder = "gameplay full combo w2"
texts = ["Full combo! So close to perfect!", "Brilliant full combo!"]

[[line]]
folder = "gameplay full combo w3"
texts = ["That's a full combo!", "Full combo! Well done!"]

[[line]]
folder = "gameplay full combo"
texts = ["Full combo!", "You kept the combo!"]

[[line]]
folder = "gameplay cleared"
texts = ["Cleared!", "You made it!", "Stage cleared!", "Well done!", "And that's a clear!"]

[[line]]
folder = "gameplay failed"  # carries into the results
texts = ["Not this time...", "Oh no!", "So close... Try again!", "That's the end of that one."]

# --- On the results -------------------------------------------------------
# One of these, the first that applies: quit, first clear, new record,
# the full combo, the grade; then the cheer, for the top three grades.

[[line]]
folder = "evaluation quit"
texts = ["Calling it there? No problem.", "Maybe next time.", "Taking a break? Fair enough."]

[[line]]
folder = "evaluation first clear"  # ours
texts = ["Your first clear on this one! Congratulations!", "First clear! Nicely done!", "You cleared it!"]

[[line]]
folder = "evaluation new record"
texts = ["A new record!", "New personal best!", "That's your best yet!"]

[[line]]
folder = "evaluation full combo w1"
texts = ["A perfect full combo! Incredible!", "Every step perfect. Outstanding!"]

[[line]]
folder = "evaluation full combo w2"
texts = ["A full combo, and nearly perfect!", "Superb full combo!"]

[[line]]
folder = "evaluation full combo w3"
texts = ["Full combo! Great work!", "Full combo! Nicely done!"]

[[line]]
folder = "evaluation full combo w4"  # where the rules keep a combo on the fourth judgment
texts = ["Full combo! You held it together!", "A full combo! Well played."]

