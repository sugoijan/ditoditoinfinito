folder = "evaluation aaaa"
texts = ["Phenomenal!", "Simply perfect!", "Masterful!"]

[[line]]
folder = "evaluation aaa"
texts = ["Outstanding!", "Superb dancing!", "Brilliant performance!"]

[[line]]
