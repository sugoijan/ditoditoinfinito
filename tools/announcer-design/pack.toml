[[line]]
folder = "evaluation b"
texts = ["Not bad at all!", "Nice work.", "Good effort!"]

[[line]]
folder = "evaluation c"
texts = ["You got through it!", "Keep practicing!", "Getting there."]

[[line]]
folder = "evaluation d"
texts = ["That was a tough one.", "It can only get better!", "Practice makes perfect."]

[[line]]
folder = "evaluation e"  # a failed play (Etterna's `evaluation f` falls back to it)
