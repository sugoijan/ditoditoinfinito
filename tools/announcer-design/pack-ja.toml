# Our announcer in Japanese, made by kokoro.py's `pack` as pack.toml's
# English one is: every line the game speaks (docs/announcer-lines.md),
# each text a variant. See pack.toml for what each line is and why no
# text names a grade's letter or a judgment.
#
#     uv run tools/announcer-design/kokoro.py pack tools/announcer-design/pack-ja.toml
#
# The game is ディトイン, in kana: Japanese has no reading for Latin
# letters here, so they are written in kana, as is any word the
# dictionary reads wrong on its own (一回 as いちかい, 一歩一歩); numbers
# are kanji, which it reads right (its kana for 300 comes out "san-bi-ya-ku").
# A file is named by how its text sounds.

name = "ガキンさん"
# Who holds the pack (CC0): its PROVENANCE.toml when bundled.
author = "すごいジャン"
# Kokoro's Japanese voices: jf_alpha (its best, C+), jf_gongitsune and
# jf_tebukuro (C), jf_nezumi and jm_kumo (C-; jm_kumo its one man). All
# but jf_alpha learned from one announcer's CC BY 3.0 readings, which a
# pack made with them credits (kokoro.py writes it in its PROVENANCE.toml).
# Or another language's voice speaking Japanese, or a blend, with lang = "j".
voice = "jm_kumo"
speed = 1
style = "lead"
lead = "さあ、みんな。…"

[kokoro]
repo = "onnx-community/Kokoro-82M-v1.0-ONNX"
revision = "1939ad2a8e416c0acfeecc08a694d14ef25f2231"
model = "onnx/model.onnx"

