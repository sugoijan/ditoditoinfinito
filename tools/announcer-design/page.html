<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcer audition</title>
<!-- announcer.py writes this page beside what it made, with its data in D. -->
<style>
:root {
  --bg: #f6f5f9; --panel: #ffffff; --ink: #1d1b24; --muted: #6b6878;
  --line: #dddbe5; --accent: #5b3fd1; --accent-ink: #ffffff; --star: #d99a00;
  --playing: #e7e1ff; --warn: #b45309;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121018; --panel: #1b1823; --ink: #ecebf2; --muted: #9a97a8;
    --line: #2e2a3a; --accent: #9d86ff; --accent-ink: #121018; --star: #ffc53d;
    --playing: #2d2550; --warn: #f59e0b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; flex: 1; }
header .now { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50vw; }
main { padding: 16px; max-width: 1400px; margin: 0 auto; }
section { margin-bottom: 28px; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .desc { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.chip .own-lead { color: var(--muted); font-size: 12px; }
.card p.mood { margin: 2px 0; font-size: 13px; }
th.mood { text-align: center; }
.warn { color: var(--warn); }
.round { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.round > .label { color: var(--muted); font-size: 13px; width: 64px; }
.round > .label.wide { width: 84px; }
.round > .label.folder { width: 230px; font: 12px ui-monospace, Menlo, monospace; }
.card h3 { display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
button:hover { background: var(--playing); }
button.play.playing { background: var(--accent); color: var(--accent-ink); }
button.star { color: var(--muted); padding: 3px 5px; }
button.star.on { color: var(--star); }
button.primary { background: var(--accent); color: var(--accent-ink); }
.kept { font-size: 12px; color: var(--accent); padding: 0 6px; }
code.cmd { font-size: 12px; color: var(--muted); cursor: copy; padding: 0 6px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--panel); font-size: 13px; white-space: nowrap; }
tbody th { font-weight: normal; min-width: 220px; }
tbody th .folder { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
td { white-space: nowrap; }
textarea { width: 100%; min-height: 90px; font: 12px ui-monospace, Menlo, monospace; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Announcer audition</h1>
  <span class="now" id="now"></span>
  <button id="stop" title="Escape">Stop</button>
</header>
<main id="main"></main>
<script>
const D = /*DATA*/null;
const main = document.getElementById("main");
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};

// One player, one queue: a row or a column plays its clips in turn.
const audio = new Audio();
let queue = [];
let current = null;
function mark(item, on) {
  if (!item) return;
  item.button.classList.toggle("playing", on);
  document.getElementById("now").textContent = on ? item.label : "";
}
function next() {
  mark(current, false);
  current = queue.shift() || null;
  if (!current) return;
  mark(current, true);
  audio.src = encodeURI(current.src);
  audio.play().catch(next);
}
function play(items) { queue = items.slice(); next(); }
function stop() { queue = []; audio.pause(); mark(current, false); current = null; }
audio.addEventListener("ended", () => setTimeout(next, 300));
audio.addEventListener("error", next);
document.getElementById("stop").onclick = stop;
addEventListener("keydown", (e) => { if (e.key === "Escape") stop(); });

// Stars: kept in this browser only; the picks below are what to paste back.
const KEY = "ddi-announcer-audition-stars";
let stars = new Set();
try { stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch {}
function saveStars() {
  try { localStorage.setItem(KEY, JSON.stringify([...stars])); } catch {}
  picks.value = JSON.stringify([...stars].sort(), null, 1);
}
function star(id) {
  const b = el("button", { className: "star", title: "Star", textContent: "☆" });
  const show = () => { const on = stars.has(id); b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; };
  b.onclick = () => { stars.has(id) ? stars.delete(id) : stars.add(id); show(); saveStars(); };
  show();
  return b;
}
function clip(src, text, label) {
  const button = el("button", { className: "play", textContent: "▶ " + text });
  const item = { src, button, label };
  button.onclick = () => play([item]);
  return item;
}
const picks = el("textarea", { readOnly: true });

if (!D) {
  main.append(el("p", { className: "empty", textContent: "Nothing yet: run announcer.py design." }));
} else {
  // The design rounds (ElevenLabs).
  const designs = el("section", {}, el("h2", { textContent: "Voice designs" }));
  const samples = D.samples || [];
  if (D.designText) designs.append(el("p", { className: "note", textContent: "Every preview reads: “" + D.designText + "”" }));
  if (!D.designs.length) designs.append(el("p", { className: "empty", textContent: "No design rounds yet." }));
  for (const v of D.designs) {
    const last = v.rounds[v.rounds.length - 1];
    const card = el("div", { className: "card" },
      el("h3", { textContent: v.voice }),
      el("p", { className: "desc", textContent: last ? last.description : "" }));
    for (const r of v.rounds) {
      const row = el("div", { className: "round" }, el("span", { className: "label", textContent: "Round " + r.round }));
      for (const p of r.previews) {
        const item = clip(p.file, p.id, v.voice + " " + p.id);
        const chip = el("span", { className: "chip" }, item.button, star(p.file));
        if (v.kept[p.id]) chip.append(el("span", { className: "kept", textContent: "kept as " + v.kept[p.id] }));
        else {
          const cmd = "python3 tools/announcer-design/announcer.py keep " + v.voice + " " + p.id;
          const code = el("code", { className: "cmd", title: "Copy: " + cmd, textContent: "keep" });
          code.onclick = () => { navigator.clipboard?.writeText(cmd); code.textContent = "copied"; };
          chip.append(code);
        }
        row.append(chip);
      }
      card.append(row);
    }
    designs.append(card);
  }
  const packs = D.packs || [];
  if (D.designs.length || (!samples.length && !packs.length)) main.append(designs);

  // Our announcer: every line it has, by where the game speaks it.
  const WHERE = [["select music", "On song select"], ["gameplay", "In play"], ["evaluation", "On the results"]];
  const whereOf = (folder) => (WHERE.find(([prefix]) => folder.startsWith(prefix)) || [, "Other"])[1];
  for (const pk of packs) {
    const sec = el("section", {}, el("h2", { textContent: "Pack: " + pk.name }));
    const styles = [...new Set(pk.lines.flatMap((l) => l.items.map((v) => v.style)))].join(" and ");
    sec.append(el("p", { className: "note", textContent: pk.detail + ", " + styles + " style" +
      ". Each sound a variant of its line, which the game takes in a shuffle. ▶▶ on a line plays its variants in turn; on a card, the first of each line." }));
    const cards = new Map();
    for (const line of pk.lines) {
      const where = whereOf(line.folder);
      if (!cards.has(where)) {
        const firsts = [];
        const all = el("button", { className: "play", title: "The first variant of each line", textContent: "▶▶" });
        all.onclick = () => play(firsts);
        // The lead most of its sounds are said after, cut off; a sound said after another, or none, shows its own.
        const here = pk.lines.filter((l) => whereOf(l.folder) === where).flatMap((l) => l.items);
        const counts = new Map();
        for (const v of here) if (v.lead) counts.set(v.lead, (counts.get(v.lead) || 0) + 1);
        const [top] = [...counts].sort((a, b) => b[1] - a[1]);
        const lead = top && top[1] * 2 > here.length ? top[0] : undefined;
        const card = el("div", { className: "card" }, el("h3", {}, where, all));
        if (lead) card.append(el("p", { className: "desc", textContent: "Said after “" + lead + "”, cut off." }));
        cards.set(where, { card, firsts, lead });
        sec.append(card);
      }
      const { card, firsts, lead } = cards.get(where);
      const items = [];
      const all = el("button", { className: "play", title: "Play the variants", textContent: "▶▶" });
      all.onclick = () => play(items);
      const row = el("div", { className: "round" },
        el("span", { className: "label folder", textContent: line.folder,
          title: [...new Set(line.items.map((v) => v.style))].join(" and ") + " style" }), all);
      for (const v of line.items) {
        const after = v.lead ? " (after “" + v.lead + "”)" : "";
        const item = clip(v.file, v.text, pk.name + " · " + line.folder + " · " + v.text + after);
        items.push(item);
        const chip = el("span", { className: "chip", title: v.style + " style" + after }, item.button);
        if ((v.lead || undefined) !== lead) chip.append(el("span", { className: "own-lead", textContent: v.lead ? "after “" + v.lead + "”" : "plain" }));
        chip.append(star(v.file));
        row.append(chip);
      }
      firsts.push(items[0]);
      card.append(row);
    }
    main.append(sec);
  }

  // Lines said around a lead and a closer: plainly, then each mood's lead, closer and both.
  for (const st of D.contexts || []) {
    const sec = el("section", {}, el("h2", { textContent: "Lead and closer: " + st.name }));
    sec.append(el("p", { className: "note", textContent: st.detail + ". Each line said plainly, then after a mood's lead, " +
      "before its closer, and between both, cut off each time. ▶ on a line plays it across; on a column, down. " +
      "⚠: a cut landed in a sound, not the pause." }));
    const legend = el("div", { className: "card" });
    for (const m of st.moods) {
      legend.append(el("p", { className: "mood" }, el("b", { textContent: m.name }),
        ": lead “" + m.lead + "”, closer “" + m.closer + "”"));
    }
    sec.append(legend);
    const ways = [{ key: "plain", label: "plain", title: "Each line on its own" }];
    for (const m of st.moods) {
      ways.push({ key: m.name + "-lead", label: m.name + " lead", title: "After “" + m.lead + "”" },
        { key: m.name + "-closer", label: m.name + " closer", title: "Before “" + m.closer + "”" },
        { key: m.name + "-both", label: m.name + " both", title: "After “" + m.lead + "”, before “" + m.closer + "”" });
    }
    const cols = ways.map(() => []);
    const colButton = (i, text) => {
      const b = el("button", { className: "play", title: ways[i].title, textContent: "▶ " + text });
      b.onclick = () => play(cols[i]);
      return b;
    };
    const top = el("tr", {}, el("th", { rowSpan: 2, textContent: "Line" }), el("th", { rowSpan: 2 }, colButton(0, "plain")));
    const sub = el("tr");
    st.moods.forEach((m, mi) => {
      top.append(el("th", { colSpan: 3, className: "mood", textContent: m.name }));
      ["lead", "closer", "both"].forEach((w, wi) => sub.append(el("th", {}, colButton(1 + mi * 3 + wi, w))));
    });
    const body = el("tbody");
    for (const r of st.rows) {
      const rowItems = [];
      const rowButton = el("button", { className: "play", title: "Play the line across", textContent: "▶" });
      rowButton.onclick = () => play(rowItems);
      const tr = el("tr", {}, el("th", {}, rowButton, " ", r.text));
      ways.forEach((w, i) => {
        const td = el("td");
        const c = r.cells[w.key];
        if (c) {
          const item = clip(c.file, "", st.name + " · " + r.text + " · " + w.label);
          rowItems.push(item);
          cols[i].push(item);
          const chip = el("span", { className: "chip", title: w.title }, item.button, star(c.file));
          const dbs = (c.cutDb || []).filter((d) => d != null);
          if (dbs.some((d) => d > -35)) {
            chip.append(el("span", { className: "warn", title: "Cut in a sound: " + dbs.join(", ") + " dB under its loudest", textContent: "⚠" }));
          }
          td.append(chip);
        }
        tr.append(td);
      });
      body.append(tr);
    }
    sec.append(el("div", { className: "scroll" }, el("table", {}, el("thead", {}, top, sub), body)));
    main.append(sec);
  }

  // Kokoro's voices, and our blends of them, reading the same text.
  if (samples.length) {
    const sec = el("section", {}, el("h2", { textContent: "Kokoro voices" }));
    const texts = (D.sampleTexts || []).map((t) => "“" + t + "”").join(" or ");
    sec.append(el("p", { className: "note", textContent: "Each reads, in its language: " + texts + " ▶▶ plays a row in turn." }));
    const card = el("div", { className: "card" });
    for (const g of samples) {
      const items = [];
      const all = el("button", { className: "play", title: "Play the row", textContent: "▶▶" });
      all.onclick = () => play(items);
      const row = el("div", { className: "round" }, el("span", { className: "label wide", textContent: g.group }), all);
      for (const s of g.items) {
        const item = clip(s.file, s.name, "kokoro " + s.name + (s.detail && s.detail !== s.name ? " (" + s.detail + ")" : ""));
        items.push(item);
        row.append(el("span", { className: "chip", title: s.detail }, item.button, star(s.file)));
      }
      card.append(row);
    }
    sec.append(card);
    main.append(sec);
  }

  // The lines, voice and style across.
  const lines = el("section", {}, el("h2", { textContent: "Lines" }));
  if (!D.grid.length) {
    lines.append(el("p", { className: "empty", textContent: "No lines yet: keep a voice, then run announcer.py speak." }));
  } else {
    lines.append(el("p", { className: "note", textContent: "▶ on a header plays its row or column, the first take of each. Escape stops." }));
    const cols = D.columns.map(() => []);
    const head = el("tr", {}, el("th", { textContent: "Line" }));
    D.columns.forEach((name, i) => {
      const b = el("button", { className: "play", title: (D.details || {})[name] || "", textContent: "▶ " + name.replace("--", " · ") });
      b.onclick = () => play(cols[i]);
      head.append(el("th", {}, b));
    });
    const body = el("tbody");
    for (const r of D.grid) {
      const rowItems = [];
      const rowButton = el("button", { className: "play", textContent: "▶" });
      rowButton.onclick = () => play(rowItems);
      const tr = el("tr", {}, el("th", {}, rowButton, " ", r.text, el("div", { className: "folder", textContent: r.folder })));
      r.cells.forEach((takes, i) => {
        const td = el("td");
        takes.forEach((src, n) => {
          const item = clip(src, String(n + 1), D.columns[i] + " · " + r.text + " · take " + (n + 1));
          if (n === 0) { rowItems.push(item); cols[i].push(item); }
          td.append(el("span", { className: "chip" }, item.button, star(src)), " ");
        });
        tr.append(td);
      });
      body.append(tr);
    }
    lines.append(el("div", { className: "scroll" }, el("table", {}, el("thead", {}, head), body)));
  }
  main.append(lines);

  const copy = el("button", { className: "primary", textContent: "Copy" });
  copy.onclick = () => { picks.select(); navigator.clipboard?.writeText(picks.value); };
  main.append(el("section", {},
    el("h2", { textContent: "Picks" }),
    el("p", { className: "note", textContent: "Starred clips, to paste back into the conversation." }),
    picks, el("p", {}, copy)));
  saveStars();
}
</script>
</body>
</html>
