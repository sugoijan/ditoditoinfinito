# What announcer.py auditions. Edit freely: a design round or a clip
# already made is kept (and not paid for again) as long as its voice,
# style, line and text stay the same.

# Voice Design: each round of a voice gives three previews of it reading
# this text (100 to 1000 characters, charged by its length).
[design]
model = "eleven_ttv_v3"
text = """Welcome to Dito Dito Infinito! Pick a song... Ready? Here we go!
You're on fire! Hang in there, don't give up now! Five hundred combo!
Oh... combo broken. Shake it off! Cleared! Now that's dancing!"""
# Any other key here goes to the design request as it is, e.g.
# guidance_scale = 5, loudness = 0.5, quality = 0.5, should_enhance = false.

# Voices designed from a description (ElevenLabs' suggested form: language,
# gender and age, quality, persona, emotion, then timbre and delivery).
# Never describe a real person, another game or its announcer. A voice
# with `voice_id` in place of `description` is an existing one (one of
# ElevenLabs' own default voices, say): it skips design and is spoken
# as a kept voice under its name.

[[voice]]
name = "arcade-mc"
description = "Native English. Male, 30s. Studio quality. Persona: energetic arcade MC. Emotion: hyped, playful, confident. Bright, punchy voice with a slight rasp; short phrases that land on the beat, energy rising at the end of each line."

[[voice]]
name = "stadium"
description = "Native English. Female, late 20s. Studio quality. Persona: stadium hype announcer. Emotion: thrilled, commanding, warm. Clear, ringing projection as if calling over a crowd, crisp consonants and long bold vowels on the key words."

[[voice]]
name = "late-night"
description = "Native English. Male, 40s. Studio quality. Persona: laid-back late-night radio host. Emotion: smooth, amused, encouraging. Deep, velvety timbre and relaxed pacing, with a smile in the voice even when teasing."

[[voice]]
name = "game-computer"
description = "Native English. Female, 20s. Studio quality. Persona: friendly retro-futuristic game computer. Emotion: upbeat, precise, cheeky. Clean voice with a light synthetic sheen, crisp diction and a quick, bouncy rhythm."

# How the kept voices speak the lines. `tags = false` strips the audio
# tags ([excited] and the like) for models that would read them out;
# `settings` goes to the request's voice_settings as it is; each take is
# the same request with its own seed (1, 2, ...).

[[style]]
name = "v4"
model = "eleven_v4"
tags = true
takes = 2
settings = { stability = 0.5 }

[[style]]
name = "v3"
model = "eleven_v3"
tags = true
takes = 2
settings = { stability = 0.5 }

[[style]]
name = "v2"
model = "eleven_multilingual_v2"
tags = false
takes = 1
settings = { stability = 0.35, similarity_boost = 0.75, style = 0.45 }

# The lines, by the folder a pack keeps them in (StepMania's names, as
# `ddi_library::announcer::Line::folder` has them), a range of moods
# rather than the whole set. Each text is a variant the game picks among.

[[line]]
folder = "select music intro"
texts = ["[warm] Pick a song!", "[playful] What are we dancing to today?"]

[[line]]
folder = "gameplay ready"
texts = ["[confident] Ready?", "[playful] Get ready..."]

[[line]]
folder = "gameplay here we go normal"
texts = ["[excited] Here we go!", "[excited] Let's dance!"]

[[line]]
folder = "gameplay comment hot"
texts = ["[excited] You're on fire!", "[impressed] Look at those feet go!"]

[[line]]
folder = "gameplay comment danger"
texts = ["[urgent] Hang in there!", "[encouraging] Don't give up now!"]

[[line]]
folder = "gameplay 500 combo"
texts = ["[excited] Five hundred combo!"]

[[line]]
folder = "gameplay combo stopped"
texts = ["[sighs] Combo broken.", "[reassuring] Shake it off!"]

[[line]]
folder = "gameplay failed"
texts = ["[disappointed] Not this time...", "[gentle] So close. Try again!"]

[[line]]
folder = "gameplay cleared"
texts = ["[cheering] Cleared!", "[proud] You made it!"]

[[line]]
folder = "evaluation aa"
texts = ["[impressed] Excellent!", "[excited] Now that's dancing!"]

# --- Kokoro (kokoro.py) ----------------------------------------------------
# Kokoro-82M (Apache-2.0), run here: no account, nothing to pay, and what
# it makes is ours to release as CC0. It has no audio tags (taken out of
# the lines above); its delivery follows the punctuation.

[kokoro]
repo = "onnx-community/Kokoro-82M-v1.0-ONNX"
revision = "1939ad2a8e416c0acfeecc08a694d14ef25f2231"
model = "onnx/model.onnx"
# Kokoro's English voices, best graded first (its VOICES.md), each reading
# [design] text. Most share their names with other services' stock voices
# (OpenAI's alloy, echo, fable, nova, onyx, sky; Gemini's aoede, kore,
# puck, fenrir; ElevenLabs' bella, nicole, sarah, jessica, river, adam,
# michael, eric, liam, alice, lily, george, daniel), and its model card
# says some of its training audio was closed services' synthetic speech:
# they may imitate those voices, which blends blur. af_sky is left out:
# the voice it is named after was withdrawn in a dispute over its
# likeness to an actor's.
sample = [
  "af_heart", "af_bella", "af_nicole", "af_aoede", "af_kore", "af_sarah",
  "af_alloy", "af_nova", "af_jessica", "af_river",
  "am_fenrir", "am_michael", "am_puck", "am_echo", "am_eric", "am_liam",
  "am_onyx", "am_santa", "am_adam",
  "bf_emma", "bf_isabella", "bf_alice", "bf_lily",
  "bm_george", "bm_fable", "bm_lewis", "bm_daniel",
  # Japanese (pack-ja.toml), reading [kokoro.texts] j. All but jf_alpha
  # learned from minutes of one TV Nishinippon announcer reading a
  # children's story, recordings under CC BY 3.0 (the Koniwa corpus's
  # `tnc`): a pack with them credits that.
  "jf_alpha", "jf_gongitsune", "jf_tebukuro", "jf_nezumi", "jm_kumo",
]
# Said before each line in the `lead` style, then cut off: Kokoro is
# weakest on utterances this short. The ellipsis after the period makes
# the pause it is cut in longer.
lead = "Alright, everybody.…"

# Words its dictionary lacks, in misaki's phonemes (its American set: O is
# the vowel of "go", I of "fire", A of "day").
[kokoro.words]
"Dito Dito Infinito" = "dˈitO dˈitO ˌɪnfɪnˈitO"

# What the voices of other languages read in `sample` (English reads
# [design] text), by Kokoro's language code.
[kokoro.texts]
j = """ディーディーアイへようこそ！曲を選んでね…準備はいい？いくよ！
絶好調だね！がんばれ、諦めないで！500コンボ！
あっ…コンボが途切れた。気にしないで！クリア！これぞダンス！"""

# The voices that say the lines: one of Kokoro's, or a blend of their
# styles by weight (a voice of our own); `speed` 1 is Kokoro's pace.
[[kokoro.voice]]
name = "heart"
voice = "af_heart"

[[kokoro.voice]]
name = "bella"
voice = "af_bella"

[[kokoro.voice]]
name = "emma"
voice = "bf_emma"

[[kokoro.voice]]
name = "puck"
voice = "am_puck"

[[kokoro.voice]]
name = "fenrir"
voice = "am_fenrir"

[[kokoro.voice]]
name = "michael"
voice = "am_michael"

[[kokoro.voice]]
name = "heart-bella"
voice = { af_heart = 0.5, af_bella = 0.5 }

[[kokoro.voice]]
name = "puck-fenrir"
voice = { am_puck = 0.5, am_fenrir = 0.5 }

# The pack's voice (pack.toml), for its two styles side by side.
[[kokoro.voice]]
name = "george"
voice = "bm_george"

# George speaking Japanese (`lang`: Kokoro's language code; a voice
# speaks its own otherwise), and Kokoro's one Japanese man with him.
[[kokoro.voice]]
name = "george-ja"
voice = "bm_george"
lang = "j"

[[kokoro.voice]]
name = "kumo-george"
voice = { jm_kumo = 0.5, bm_george = 0.5 }
lang = "j"

# How what is said around a line changes how it is said (`context`): each
# line said plainly, then after each mood's lead, before its closer and
# between both, cut off each time; a grid on the page. A closer is cut in
# the pause the line's own . ! or ? leaves before it.
[[kokoro.context]]
name = "george"
voice = "bm_george"
lines = ["Nice!", "Ready?", "Full combo!", "Good job!", "You made it!", "Maybe next time."]

[[kokoro.context.mood]]
name = "neutral"
lead = "Alright, everybody.…"
closer = "Okay, on to the next one."

[[kokoro.context.mood]]
name = "excited"
lead = "Oh wow, this is incredible!…"
closer = "I can't believe it, that was amazing!"

[[kokoro.context.mood]]
name = "sarcastic"
lead = "Oh, great. Just wonderful.…"
closer = "Yeah, sure. Whatever you say."

[[kokoro.context.mood]]
name = "disappointed"
lead = "Oh no. What a shame.…"
closer = "Oh well. It just wasn't meant to be."
