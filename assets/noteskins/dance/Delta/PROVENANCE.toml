modifications = [
    "_center tap note 12x8.png, _center receptor 4x1.png and Center Tap Explosion Bright.png made from _down tap note 12x8.png, Receptor 4x1.png and Down Tap Explosion Bright.png by python3 tools/noteskin-centers/generate.py: the arrow reshaped into a rounded square, every frame (the rim and the explosion's glow by depth, the fill from the arrow's own pixels)",
    "Center Tap Note.lua and Center Receptor.lua: Down Tap Note.lua and Down Receptor.lua with those images' names; Center Tap Explosion Dim.redir: Down's, to the center's",
