[Global]
FallbackNoteSkin=Peters-DDR
Buttons=Down,Up,Left,Right,UpLeft,UpRight,DownLeft,DownRight,Center,Onigiri

[Parameters]
List=Colors,NoteTimedCharge,Onigiri,ShockArrows,Explosions,ReceptorFill,HitVariation

[Parameter Colors]
Type=Choice
Label=Note colors
Description=Vivid shifts the spiral by note timing. Rainbow uses four timing-color families. Flat gives every note the same cycling spiral.
Choices=Vivid,Rainbow,Flat
ChoiceLabels=Vivid,Rainbow,Flat
Skins=,,
Default=Vivid

[Parameter NoteTimedCharge]
Type=Toggle
Label=Charge by note timing
Description=Give each note its own one-beat charge cycle, reaching full charge at its hit time. Lifts keep their reversed sequence and empty at release.
Default=1

[Parameter ShockArrows]
Type=Toggle
Label=Shock arrows
Description=Use lane-shaped shock notes instead of the shared spiked mine. This changes their appearance only.
Default=0

[Parameter Onigiri]
Type=Toggle
Label=Onigiri note
Description=Use the rounded rice triangle on Onigiri lanes. Disable to use the center square.
Default=1

[Parameter Explosions]
Type=Toggle
Label=Explosions
Description=Original SVG flashes for hits, holds, rolls and mines.
Default=1

[Parameter ReceptorFill]
Type=Toggle
Label=Receptor interior
Description=Faint neutral fill follows the note's inset charge regions. Disable for a hollow receptor.
Default=1

[Parameter HitVariation]
Type=Toggle
Label=Vary bursts
Description=Randomizes broad-burst rotation on each hit. Arrow echoes and linked mine contours stay aligned; colors and timing stay fixed.
Default=1

