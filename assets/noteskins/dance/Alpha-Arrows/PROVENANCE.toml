# Alpha-Arrows by Aozora Tori: its dance images (and its center's, which
# pump layouts draw), readme and licence, byte for byte. Its Lua and
# metrics.ini are not bundled (its readme says the code is "based from"
# skins that carry no licence, and its explosion is another author's);
# this folder's NoteSkin.lua, Down *.lua, Center *.lua and metrics.ini are
# this repository's own, written for the images.
author = "Aozora Tori"
credit = "Aozora Tori · Apache 2.0"
excluded = [
    "NoteSkin.lua, Fallback Explosion.lua, Down/Center *.lua and metrics.ini (code without a clear licence; replaced)",
    "Down Mine Body/TopCap/BottomCap and Down Hold LiftTail (OutFox's mine and lift holds)",
]
modifications = [
    "the folder renamed alpha-arrows → Alpha-Arrows",
    "NoteSkin.lua, Down Tap Note.lua, Down Tap Lift.lua, Down Tap Mine.lua, Down Receptor.lua, Down Explosion.lua and metrics.ini written anew (MIT, Dito Dito Infinito)",
    "Center Tap Note.lua and Center Receptor.lua written anew for the upstream center images (pump layouts' center panel; Down Receptor.lua and Down Explosion.lua draw the center's receptor and glow from them), MIT, Dito Dito Infinito",
    "LICENSE copied from the repository's root",
]

