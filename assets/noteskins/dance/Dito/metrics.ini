[Global]
FallbackNoteSkin=default

; Dito's parameters, our extension (docs/plans/skin-parameters.md): the rows
; Options shows under Arrows. Each color scheme is a skin falling back on
; this one, loaded in its place. The game reads Colors, ChartColors and
; Lighter itself (the built-in arrows draw in Dito's colors, and draw a
; song's own colors and the lighter choice); Down Explosion.lua reads
; Explosions.
[Parameters]
List=Colors,ChartColors,Explosions,Lighter

[Parameter Colors]
Type=Choice
Label=Note colors
Description=Vivid: a cycling rainbow, shifted by subdivision. Rainbow: by position in the beat, flowing. Flat: all notes alike.
Choices=Vivid,Rainbow,Quantized,Flat,Single
ChoiceLabels=Vivid,Rainbow,By subdivision,Flat,Single color
Skins=Dito Vivid,Dito Rainbow,,Dito Flat,Dito Single
Default=Vivid

[Parameter ChartColors]
Type=Toggle
Label=Songs' own colors
Description=Uses a song's own note colors when it has them (Dancing☆Onigiri works), drawn by the built-in arrows.
Default=0

[Parameter Explosions]
Type=Toggle
Label=Explosions
Description=Bursts at the receptors for each hit, completed hold and mine.
Default=1

[Parameter Lighter]
Type=Toggle
Label=Lighter
Description=Draws the same arrows without the skin: no Lua and no explosions, for slow devices.
Default=0

; Dito: the built-in arrows as a skin (docs/plans/bundled-skins.md).
; Quantized: the tap sheet has a color a row (4ths to 192nds, padded to 16
; rows), picked by the engine's texture translation.
[NoteDisplay]
DitoTapFrames=1
TapNoteAnimationLength=1
TapNoteAnimationIsVivid=0
TapNoteNoteColorTextureCoordSpacingX=0
TapNoteNoteColorTextureCoordSpacingY=0.0625
TapNoteNoteColorCount=9
TapNoteNoteColorType=Denominator
TapLiftAnimationLength=1
TapLiftAnimationIsVivid=0
TapLiftNoteColorTextureCoordSpacingX=0
TapLiftNoteColorTextureCoordSpacingY=0.0625
TapLiftNoteColorCount=9
TapLiftNoteColorType=Denominator
TapFakeAnimationLength=1
TapFakeAnimationIsVivid=0
TapFakeNoteColorTextureCoordSpacingX=0
TapFakeNoteColorTextureCoordSpacingY=0.0625
TapFakeNoteColorCount=9
TapFakeNoteColorType=Denominator
HoldHeadAnimationLength=1
HoldHeadAnimationIsVivid=0
HoldHeadNoteColorTextureCoordSpacingX=0
HoldHeadNoteColorTextureCoordSpacingY=0.0625
HoldHeadNoteColorCount=9
HoldHeadNoteColorType=Denominator
TapMineAnimationLength=1
StartDrawingHoldBodyOffsetFromHead=0
; The bottom cap (a quarter of a lane) is the body's rounded end.
StopDrawingHoldBodyOffsetFromTail=-16
HoldLetGoGrayPercent=0.5
