[Global]
FallbackNoteSkin=default

; Dito: the built-in arrows as a skin (docs/plans/bundled-skins.md).
; Quantized: the tap sheet has a color a row (4ths to 192nds, padded to 16
; rows), picked by the engine's texture translation.
[NoteDisplay]
DitoTapFrames=1
TapNoteAnimationLength=1
TapNoteAnimationIsVivid=0
TapNoteNoteColorTextureCoordSpacingX=0
TapNoteNoteColorTextureCoordSpacingY=0.0625
TapNoteNoteColorCount=9
TapNoteNoteColorType=Denominator
TapLiftAnimationLength=1
TapLiftAnimationIsVivid=0
TapLiftNoteColorTextureCoordSpacingX=0
TapLiftNoteColorTextureCoordSpacingY=0.0625
TapLiftNoteColorCount=9
TapLiftNoteColorType=Denominator
TapFakeAnimationLength=1
TapFakeAnimationIsVivid=0
TapFakeNoteColorTextureCoordSpacingX=0
TapFakeNoteColorTextureCoordSpacingY=0.0625
TapFakeNoteColorCount=9
TapFakeNoteColorType=Denominator
HoldHeadAnimationLength=1
HoldHeadAnimationIsVivid=0
HoldHeadNoteColorTextureCoordSpacingX=0
HoldHeadNoteColorTextureCoordSpacingY=0.0625
HoldHeadNoteColorCount=9
HoldHeadNoteColorType=Denominator
TapMineAnimationLength=1
StartDrawingHoldBodyOffsetFromHead=0
; The bottom cap (a quarter of a lane) is the body's rounded end.
StopDrawingHoldBodyOffsetFromTail=-16
HoldLetGoGrayPercent=0.5
