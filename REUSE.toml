# StepMania 5.1's noteskin metrics and Lua (from NoteSkins/dance/default/,
# NoteSkins/pump/default/ and NoteSkins/common/common/ at
# stepmania/stepmania 825467b; licence in
# Docs/Licenses.txt there), and StepMania 3.9's dance/default and
# dance/flat metrics (v390release 5d417c1f; licence in
# stepmania/Docs/Copying.txt, the same terms), byte for byte. Credited
# through THIRD_PARTY.toml.
[[annotations]]
path = ["noteskin/src/builtin/stepmania/**", "noteskin/src/builtin/stepmania39/**"]
SPDX-FileCopyrightText = ["Chris Danford, the StepMania development team, et al.", "AJ Kelly, Midiman, shakesoda (the spinal shark collective), and other contributors"]
SPDX-License-Identifier = "LicenseRef-StepMania"

