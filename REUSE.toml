version = 1

# Code, docs, configuration and the project's own assets.
[[annotations]]
path = ["**"]
SPDX-FileCopyrightText = "すごいジャン <me@sugoijan.dev>"
SPDX-License-Identifier = "MIT"

# The video decoder module (target/video/ddivideo.wasm, built by
# video/build.sh, never committed) is FFmpeg, LGPL-2.1-or-later, with zlib
# and wasi-libc linked in; the build writes their notices and licence texts
# next to it (ddivideo.LICENSE.txt) and the site serves both. Its sources
# here (video/) are MIT like the rest.

# Dancing☆Onigiri key mode and key code tables, generated from danoniplus
# (https://github.com/cwtickle/danoniplus, js/lib/danoni_constants.js).
[[annotations]]
path = ["chart/src/layout/danoni_table.rs", "chart/src/formats/danoni/keycodes.rs"]
SPDX-FileCopyrightText = "2018 tickle"
SPDX-License-Identifier = "MIT"

# StepMania 5.1's noteskin metrics and Lua (from NoteSkins/dance/default/
# and NoteSkins/common/common/ at stepmania/stepmania 825467b), byte for
# byte; its licence is Docs/Licenses.txt there. Credited through
# THIRD_PARTY.toml.
[[annotations]]
path = ["noteskin/src/builtin/stepmania/**"]
SPDX-FileCopyrightText = ["Chris Danford, the StepMania development team, et al.", "AJ Kelly, Midiman, shakesoda (the spinal shark collective), and other contributors"]
SPDX-License-Identifier = "LicenseRef-StepMania"

# Bundled noteskins live under assets/noteskins/<game>/<name>/ and are NOT
# MIT; each has a PROVENANCE.toml (docs/plans/bundled-skins.md).

# StepMania 5.1's Delta (stepmania/stepmania 825467b, NoteSkins/dance/Delta),
# byte for byte: CC BY 3.0 by its readme.txt; its Lua and metrics were later
# edited by StepMania's developers under StepMania's licence.
[[annotations]]
path = ["assets/noteskins/dance/Delta/*.png", "assets/noteskins/dance/Delta/readme.txt"]
SPDX-FileCopyrightText = "shakesoda"
SPDX-License-Identifier = "CC-BY-3.0"

[[annotations]]
path = ["assets/noteskins/dance/Delta/*.lua", "assets/noteskins/dance/Delta/*.redir", "assets/noteskins/dance/Delta/metrics.ini"]
SPDX-FileCopyrightText = ["shakesoda", "AJ Kelly, the StepMania development team and other contributors"]
SPDX-License-Identifier = "CC-BY-3.0 AND LicenseRef-StepMania"

# Alpha-Arrows by Aozora Tori (Tiny-Foxes/Aozora-Tori-Assets 499ee273,
# Noteskins/alpha-arrows): its images, readme and licence byte for byte,
# Apache-2.0. Its Lua and metrics.ini here are this repository's own (MIT,
# the default annotation).
[[annotations]]
path = ["assets/noteskins/dance/Alpha-Arrows/*.png", "assets/noteskins/dance/Alpha-Arrows/*.txt", "assets/noteskins/dance/Alpha-Arrows/LICENSE"]
SPDX-FileCopyrightText = "2022 Aozora \"Aqui\" Tori"
SPDX-License-Identifier = "Apache-2.0"

# Dake by hanubeki (hanubeki/dake e26aa8d0): its dance files byte for byte,
# Apache-2.0.
[[annotations]]
path = ["assets/noteskins/dance/Dake/*.png", "assets/noteskins/dance/Dake/*.lua", "assets/noteskins/dance/Dake/metrics.ini", "assets/noteskins/dance/Dake/README.md", "assets/noteskins/dance/Dake/LICENSE"]
SPDX-FileCopyrightText = "hanubeki"
SPDX-License-Identifier = "Apache-2.0"

# Bundled songs live under assets/songs/<slug>/ and are NOT MIT. Each song gets
# its own annotations below naming the musician, chart authors and graphic
# authors with the exact licence of each file. See docs/PLAN.md §8.

[[annotations]]
path = ["assets/fonts/IosevkaCustom-*.ttf"]
SPDX-FileCopyrightText = "2015-2026 Renzhi Li (aka. Belleve Invis) <belleve@typeof.net>"
SPDX-License-Identifier = "OFL-1.1"

