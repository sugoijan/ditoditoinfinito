name: Desktop release

# A pushed tag `v<version>` (the workspace's version in Cargo.toml) builds
# the desktop game on macOS (Apple silicon), Linux (x86_64) and Windows
# (x86_64), packages it (tools/package/package.py dist: a signed ad hoc
# .app in a zip and a .dmg, a tarball, a zip) and attaches the archives to
# a draft release for the maintainer to publish. Run by hand from any
# branch, it builds and keeps the archives as the run's artifacts only.
# docs/plans/packaging.md has the layouts and what is left (notarization,
# Intel Macs, Windows' video helper).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# As deploy.yml: no debug info (its dev-profile xtask runs then share
# deploy's desktop caches, restored, never saved from here), and the
# helper's FFmpeg from the build-inputs release.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  GH_TOKEN: ${{ github.token }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
            # Windows builds neither the URL importer (its confinement is
            # still to come) nor, yet, the video helper's FFmpeg (MSYS2 and
            # the MSVC tools, untested): movies show their song background.
            package_flags: --without-video-helper
    runs-on: ${{ matrix.os }}
    # A cold build prepares the importer's pinned Ruffle worker and the
    # helper's FFmpeg; the caches below keep later ones far shorter.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Python 3.11+ for the packaging script and the importer's build driver.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python tools/package/package.py version)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml's version $version" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: runner.os != 'Windows'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build libraries and the importer's prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt
        with:
          packages: libasound2-dev libudev-dev libssl-dev nasm cmake pkg-config libvulkan1 mesa-vulkan-drivers
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          command -v cmake || brew install cmake
          command -v pkg-config || brew install pkgconf
      # The same key as danoni.yml's, so a tag's run starts from main's cache.
      - name: Cache the importer's build
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ditoditoinfinito/danoni-importer
          key: ${{ runner.os }}-${{ runner.arch }}-danoni-native-${{ hashFiles('Cargo.lock', 'tools/danoni-dump/ruffle/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-danoni-native-
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          save-if: false
      - name: The helper's FFmpeg, built already
        if: runner.os != 'Windows'
        run: .github/scripts/video-assets.sh fetch native || true
      - name: Generated indexes and credits
        run: |
          cargo run --locked -p xtask -- gen-songs
          cargo run --locked -p xtask -- gen-noteskins
          cargo run --locked -p xtask -- gen-credits
      - name: Build the game (desktop profile, default features)
        run: cargo build --locked -p ddi --profile desktop
      - name: Package and check it
        run: python tools/package/package.py dist --app target/desktop/ddi${{ runner.os == 'Windows' && '.exe' || '' }} --output-dir "$RUNNER_TEMP/dist" ${{ matrix.package_flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Attach the archives to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Dito Dito Infinito ${GITHUB_REF_NAME#v}"
          fi
          gh release upload --clobber "$GITHUB_REF_NAME" ./*
