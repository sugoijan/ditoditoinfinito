name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push to a branch, or to a pull request, cancels that ref's
# outdated run; other refs' runs go on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The desktop's default `danoni-importer` feature prepares the native URL
# importer (a JDK, CMake, the pinned Ruffle release); checks and tests
# build without it, URL import unavailable. Its own build and package
# run in danoni.yml. No debug info: smaller caches, faster links, and
# nothing here reads it. Rust caches are saved on main only and pruned
# after the run (prune-caches below) to stay under the repository's cap;
# the FFmpeg builds come from the build-inputs release
# (.github/scripts/video-assets.sh).
env:
  DDI_IMPORTER_TEST_ONLY: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE lint
        uses: fsfe/reuse-action@v6

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The desktop's sound (cpal) links ALSA, its controllers (gilrs)
      # libudev; nasm assembles the video helper's FFmpeg when it is built
      # here (.github/actions/apt: from the Actions cache, or Canonical's
      # archive before the throttling Azure mirror). The ffmpeg command
      # decodes the decoders' references (bundled songs, MP3s) and encodes
      # the video tests' clips: a pinned static build from GitHub, not
      # Ubuntu's package (.github/scripts/ffmpeg-command.sh).
      - name: ALSA and udev headers, nasm
        uses: ./.github/actions/apt
        with:
          packages: libasound2-dev libudev-dev nasm
      - name: The ffmpeg command
        run: .github/scripts/ffmpeg-command.sh
      # The video helper's static FFmpeg (video/build-native.sh), as the
      # build-inputs release has it; crates/desktop/build.rs builds it (a
      # few minutes) when the release lacks this recipe's.
      - name: The helper's FFmpeg, built already
        run: .github/scripts/video-assets.sh fetch native || true
      # The bundled songs' and noteskins' indexes the desktop's tests read
      # (its tests also write them when missing).
      - name: Generated files are fresh
        run: |
          cargo run -p xtask -- gen-songs
          python3 tools/noteskin-danoni/generate.py --check
          cargo run -p xtask -- gen-noteskins
          cargo run -p xtask -- gen-credits --check
      - name: Native tests
        run: cargo test -p ddi-chart -p ddi-engine -p ddi-render -p ddi-platform -p ddi-library -p ddi-actor -p ddi-ui -p ddi-theme -p ddi-noteskin -p ddi-lua -p ddi-session -p ddi-shell -p ddi-desktop -p ddi -p xtask --features ddi-platform/decode,ddi-library/nfkd,ddi-ui/layout

  # The desktop shell on the three systems it is for, with and without
  # background movies (the `video` feature: the sandboxed FFmpeg helper,
  # built on Linux and macOS; Windows skips it, so its movie tests skip,
  # until its FFmpeg builds in CI). Not among the
  # deploy's needs: the site does not use it, so a desktop-only break does
  # not hold back the web (the `test` job still builds and tests the
  # desktop crate on Linux before a deploy). GPU tests skip as on a
  # machine without one (`DDI_NO_GPU`: a runner's software adapter draws
  # pictures the tests were not checked against); sound tests never open
  # a device unless asked (`DDI_AUDIO_DEVICE_TESTS`); the VideoToolbox
  # comparisons skip (`DDI_SKIP_VT`: the macOS runners' virtual machines
  # stalled in them) and run on a Mac instead.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A healthy run takes under 10 minutes; a stuck decoder must not hold
    # a runner for the default 6 hours.
    timeout-minutes: 45
    env:
      DDI_NO_GPU: "1"
      DDI_SKIP_VT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: ALSA and udev headers, nasm
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt
        with:
          packages: libasound2-dev libudev-dev nasm
      # The command generates reference clips; the decoder helper's static
      # FFmpeg libraries contain no encoders or command-line executable.
      - name: Video test fixture encoders on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: The helper's FFmpeg, built already
        if: runner.os != 'Windows'
        run: .github/scripts/video-assets.sh fetch native || true
      - name: The bundled songs' and noteskins' indexes
        run: |
          cargo run -p xtask -- gen-songs
          cargo run -p xtask -- gen-noteskins
      - name: Build and test the desktop shell (background movies on)
        run: cargo test -p ddi-desktop --no-fail-fast
      - name: The decoder helper's sandbox holds on this runner
        if: runner.os != 'Windows'
        run: target/debug/video/ddi-video-helper --sandbox-check
      - name: Build and test it without background movies
        run: cargo test -p ddi-desktop --no-default-features --no-fail-fast

  # The software video decoder (video/): FFmpeg built with wasi-sdk, as
  # the build-inputs release has it (with its source tarball, served next
  # to the module by xtask stage-video); built and checked on generated
  # clips against the ffmpeg command's own decode when the release lacks
  # this recipe's.
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The module, built already
        id: fetch
        run: |
          if .github/scripts/video-assets.sh fetch module; then
            echo "built=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.fetch.outputs.built != '1'
        with:
          node-version: 22
      - name: Build the module
        if: steps.fetch.outputs.built != '1'
        run: video/build.sh
      - name: Describe the module
        run: cat target/video/ddivideo.json
      # What configure found, to compare builds on different hosts.
      - name: Keep the build's configuration
        if: always() && steps.fetch.outputs.built != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ddivideo-build
          path: |
            target/video/ffmpeg-build/config.h
            target/video/ffmpeg-build/config_components.h
            target/video/ffmpeg-build/ffbuild/config.mak
            target/video/ffmpeg-build/ffbuild/config.log
            target/video/ffmpeg-build/configure.out
            target/video/ffmpeg-build/make.out
            target/video/ffmpeg-build/link.out
            target/video/ffmpeg-build/lib*/lib*.a
      - name: The ffmpeg command
        if: steps.fetch.outputs.built != '1'
        run: .github/scripts/ffmpeg-command.sh
      - name: Check the module on generated clips
        if: steps.fetch.outputs.built != '1'
        run: video/clips.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ddivideo
          path: |
            target/video/ddivideo.*
            target/video/downloads/ffmpeg-*.tar.xz

  build:
    needs: video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo + trunk
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-directories: |
            ~/.cargo/bin
      - name: Install Trunk
        run: |
          if ! command -v trunk >/dev/null; then
            cargo install trunk --locked
          fi
      - name: Set public url
        run: |
          # Pages serves the repo segment case-insensitively; the site is
          # referenced as the lowercase path everywhere.
          REPO_NAME="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            PUBLIC_URL="/"
          else
            PUBLIC_URL="/${REPO_NAME}/"
          fi
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
      # After rust-cache, which may clean target/ when it restores. Staged
      # into the site by Trunk's post_build hook (xtask stage-video).
      - uses: actions/download-artifact@v4
        with:
          name: ddivideo
          path: target/video
      - name: Trunk build
        run: trunk build --release --public-url "$PUBLIC_URL"
      - name: The site includes the video decoder and its source
        run: |
          test -s dist/video/ddivideo.wasm && test -s dist/video/ddivideo.json && test -s dist/video/ddivideo.LICENSE.txt
          tarball="$(sed -n 's|^tarball_url = ".*/\(.*\)"$|\1|p' video/FFMPEG.toml)"
          test -n "$tarball" && test -s "dist/video/$tarball"
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The Actions caches must fit the repository's 10 GB cap, or GitHub
  # evicts what was used least recently and jobs start cold: after the
  # jobs above saved theirs, every key's predecessor goes, and every cache
  # of another ref (.github/scripts/prune-caches.sh).
  prune-caches:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, desktop, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete the stale caches
        run: .github/scripts/prune-caches.sh

  deploy:
    if: github.event_name != 'pull_request'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    # One Pages deployment at a time: a newer one waits for one under way.
    # (Cancelling an outdated run still stops its deployment, which leaves
    # the live site as it was until the newer run deploys.)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
