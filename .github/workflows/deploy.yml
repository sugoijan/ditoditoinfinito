name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push to a branch, or to a pull request, cancels that ref's
# outdated run; other refs' runs go on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE lint
        uses: fsfe/reuse-action@v6

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The desktop's sound (cpal) links ALSA, its controllers (gilrs)
      # libudev; ffmpeg decodes the decoders' references (bundled songs,
      # MP3s); nasm assembles the video helper's FFmpeg.
      - name: ALSA and udev headers, ffmpeg, nasm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev ffmpeg nasm
      # The video helper's static FFmpeg (video/build-native.sh), built by
      # desktop/build.rs when missing: a few minutes, so cached by recipe.
      - name: Cache the helper's FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            target/video/native
            target/video/downloads/ffmpeg-*.tar.xz
            target/video/downloads/zlib-*.tar.gz
          key: ffmpeg-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('video/build-native.sh', 'video/lib.sh', 'video/FFMPEG.toml') }}
      # The bundled songs' and noteskins' indexes the desktop's tests read
      # (its tests also write them when missing).
      - name: Generated files are fresh
        run: |
          cargo run -p xtask -- gen-songs
          cargo run -p xtask -- gen-dito --check
          python3 tools/noteskin-danoni/generate.py --check
          cargo run -p xtask -- gen-noteskins
          cargo run -p xtask -- gen-credits --check
      - name: Native tests
        run: cargo test -p ddi-chart -p ddi-engine -p ddi-render -p ddi-platform -p ddi-library -p ddi-actor -p ddi-ui -p ddi-theme -p ddi-noteskin -p ddi-lua -p ddi-session -p ddi-desktop -p ditoditoinfinito -p xtask --features ddi-platform/decode,ddi-library/nfkd,ddi-ui/layout

  # The desktop shell on the three systems it is for, with and without
  # background movies (the `video` feature: the sandboxed FFmpeg helper,
  # built on Linux and macOS; Windows skips it, so its movie tests skip,
  # until its FFmpeg builds in CI). Not among the
  # deploy's needs: the site does not use it, so a desktop-only break does
  # not hold back the web (the `test` job still builds and tests the
  # desktop crate on Linux before a deploy). GPU tests skip as on a
  # machine without one (`DDI_NO_GPU`: a runner's software adapter draws
  # pictures the tests were not checked against); sound tests never open
  # a device unless asked (`DDI_AUDIO_DEVICE_TESTS`).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DDI_NO_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: ALSA and udev headers, nasm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev nasm
      # The command generates reference clips; the decoder helper's static
      # FFmpeg libraries contain no encoders or command-line executable.
      - name: Video test fixture encoders on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Cache the helper's FFmpeg
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            target/video/native
            target/video/downloads/ffmpeg-*.tar.xz
            target/video/downloads/zlib-*.tar.gz
          key: ffmpeg-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('video/build-native.sh', 'video/lib.sh', 'video/FFMPEG.toml') }}
      - name: The bundled songs' and noteskins' indexes
        run: |
          cargo run -p xtask -- gen-songs
          cargo run -p xtask -- gen-noteskins
      - name: Build and test the desktop shell (background movies on)
        run: cargo test -p ddi-desktop --no-fail-fast
      - name: The decoder helper's sandbox holds on this runner
        if: runner.os != 'Windows'
        run: target/debug/video/ddi-video-helper --sandbox-check
      - name: Build and test it without background movies
        run: cargo test -p ddi-desktop --no-default-features --no-fail-fast

  # The software video decoder (video/): FFmpeg built with wasi-sdk, checked
  # on generated clips against the ffmpeg command's own decode.
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # With FFmpeg's release tarball, served next to the module as its
      # source (xtask stage-video).
      - name: Cache the module
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            target/video/ddivideo.wasm
            target/video/ddivideo.json
            target/video/ddivideo.LICENSE.txt
            target/video/downloads/ffmpeg-*.tar.xz
          key: video-${{ hashFiles('video/build.sh', 'video/FFMPEG.toml', 'video/ddivideo.c', 'video/packets.c') }}
      - name: Build the module
        if: steps.cache.outputs.cache-hit != 'true'
        run: video/build.sh
      - name: Describe the module
        run: cat target/video/ddivideo.json
      # What configure found, to compare builds on different hosts.
      - name: Keep the build's configuration
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ddivideo-build
          path: |
            target/video/ffmpeg-build/config.h
            target/video/ffmpeg-build/config_components.h
            target/video/ffmpeg-build/ffbuild/config.mak
            target/video/ffmpeg-build/ffbuild/config.log
            target/video/ffmpeg-build/configure.out
            target/video/ffmpeg-build/make.out
            target/video/ffmpeg-build/link.out
            target/video/ffmpeg-build/lib*/lib*.a
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check the module on generated clips
        run: video/clips.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ddivideo
          path: |
            target/video/ddivideo.*
            target/video/downloads/ffmpeg-*.tar.xz

  build:
    needs: video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo + trunk
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/bin
      - name: Install Trunk
        run: |
          if ! command -v trunk >/dev/null; then
            cargo install trunk --locked
          fi
      - name: Set public url
        run: |
          # Pages serves the repo segment case-insensitively; the site is
          # referenced as the lowercase path everywhere.
          REPO_NAME="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            PUBLIC_URL="/"
          else
            PUBLIC_URL="/${REPO_NAME}/"
          fi
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
      # After rust-cache, which may clean target/ when it restores. Staged
      # into the site by Trunk's post_build hook (xtask stage-video).
      - uses: actions/download-artifact@v4
        with:
          name: ddivideo
          path: target/video
      - name: Trunk build
        run: trunk build --release --public-url "$PUBLIC_URL"
      - name: The site includes the video decoder and its source
        run: |
          test -s dist/video/ddivideo.wasm && test -s dist/video/ddivideo.json && test -s dist/video/ddivideo.LICENSE.txt
          tarball="$(sed -n 's|^tarball_url = ".*/\(.*\)"$|\1|p' video/FFMPEG.toml)"
          test -n "$tarball" && test -s "dist/video/$tarball"
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    # One Pages deployment at a time: a newer one waits for one under way.
    # (Cancelling an outdated run still stops its deployment, which leaves
    # the live site as it was until the newer run deploys.)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
