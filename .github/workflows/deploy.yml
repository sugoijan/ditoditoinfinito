name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE lint
        uses: fsfe/reuse-action@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native tests
        run: cargo test -p ddi-chart -p ddi-engine -p ddi-render -p ddi-platform -p ddi-library -p xtask --features ddi-platform/decode
      - name: Generated files are fresh
        run: |
          cargo run -p xtask -- gen-songs
          cargo run -p xtask -- gen-credits --check

  # The software video decoder (video/): FFmpeg built with wasi-sdk, checked
  # on generated clips against the ffmpeg command's own decode.
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the module
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            target/video/ddivideo.wasm
            target/video/ddivideo.json
            target/video/ddivideo.LICENSE.txt
          key: video-${{ hashFiles('video/build.sh', 'video/FFMPEG.toml', 'video/ddivideo.c') }}
      - name: Build the module
        if: steps.cache.outputs.cache-hit != 'true'
        run: video/build.sh
      - name: Describe the module
        run: cat target/video/ddivideo.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check the module on generated clips
        run: video/clips.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ddivideo
          path: target/video/ddivideo.*

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo + trunk
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/bin
      - name: Install Trunk
        run: |
          if ! command -v trunk >/dev/null; then
            cargo install trunk --locked
          fi
      - name: Set public url
        run: |
          # Pages serves the repo segment case-insensitively; the site is
          # referenced as the lowercase path everywhere.
          REPO_NAME="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            PUBLIC_URL="/"
          else
            PUBLIC_URL="/${REPO_NAME}/"
          fi
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
      - name: Trunk build
        run: trunk build --release --public-url "$PUBLIC_URL"
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
